[package]
name = "ostudy"
version = "0.1.0"
description = "Local-first flashcards and study tools"
authors = ["jferments"]
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
name = "ostudy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = "=0.4.45"
futures-util = "=0.3.33"
oxidize-pdf = { version = "=4.2.2", default-features = false, features = ["compression", "semantic"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
ring = "=0.17.14"
rs-fsrs = "=1.2.1"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "backup", "trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-ostudy-platform = { path = "../plugins/ostudy-platform" }
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
url = "=2.5.7"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "=4.1.6"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
