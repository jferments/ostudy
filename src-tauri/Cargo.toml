[package]
name = "ostudy"
version = "0.1.0"
description = "Local-first flashcards and study tools"
authors = ["jferments"]
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
name = "ostudy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = "=0.4.45"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
keyring = "=4.1.6"
oxidize-pdf = { version = "=4.2.2", default-features = false, features = ["compression", "semantic"] }
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rs-fsrs = "=1.2.1"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "backup", "trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
url = "=2.5.7"
