[package]
name = "ostudy"
default-run = "ostudy"
version = "0.1.0"
description = "Local-first flashcards and study tools"
authors = ["jferments"]
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
name = "ostudy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Headless study-guide evaluation runner; never part of the application build.
guide-eval = []

[[bin]]
name = "guide-eval"
required-features = ["guide-eval"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
chrono = "=0.4.45"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
typst = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
oxidize-pdf = { version = "=5.5.0", default-features = false, features = ["compression", "semantic"] }
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
roxmltree = "=0.21.1"
ring = "=0.17.14"
rs-fsrs = "=1.2.1"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "backup", "trace"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-ostudy-platform = { path = "../plugins/ostudy-platform" }
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "sync", "time"] }
url = "=2.5.8"
xberg = { git = "https://github.com/xberg-io/xberg", rev = "276cbba4b7ae6a91352fc6da1358688cab72b637", default-features = false, features = ["tokio-runtime", "office", "excel"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "=4.1.6"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }

# Local speech recognition. Its prebuilt libraries are pinned and verified in
# scripts/native-deps-manifest.json. Windows is left out until its static
# libraries (built for the static C runtime) are qualified there.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android"))'.dependencies]
sherpa-onnx = { version = "=2.0.0", default-features = false, features = ["static"] }

# Lets the Linux webview record from the microphone (WebKitGTK denies media
# capture unless the application enables it).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

# Development builds (`pnpm desktop`) are what the maintainer studies with.
# Optimizing dependencies (SQLite, JSON, hashing, PDF and image code) makes
# local document work several times faster there, while oStudy's own crate
# stays unoptimized for quick rebuilds and full debug information.
[profile.dev.package."*"]
opt-level = 2
