[package]
name = "ostudy"
version = "0.1.0"
description = "A local-first flashcard and study application"
authors = ["ostudy contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.97.1"

[lib]
name = "ostudy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
chrono = "=0.4.45"
rs-fsrs = "=1.2.1"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
