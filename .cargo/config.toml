[net]
retry = 3

[env]
# Without this the bundled SQLite counts memory under one process-wide mutex,
# so concurrent connections contend on every allocation. oStudy never reads
# sqlite3_memory_used() or sets a soft heap limit.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"
# The sherpa-onnx speech libraries are linked from archives that
# scripts/install-native-deps.sh pins and verifies, never downloaded by the
# sherpa-onnx-sys build script itself.
SHERPA_ONNX_ARCHIVE_DIR = { value = "src-tauri/resources/native/sherpa-onnx", relative = true }

# Link the C runtime into ostudy.exe so a Windows PC without the Visual C++
# Redistributable can run the installed app.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
