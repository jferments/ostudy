name: Normalize Android project verifier

on:
  push:
    branches:
      - agent/android-a1-a3

permissions:
  contents: write

concurrency:
  group: normalize-android-verifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 15
    steps:
      - name: Check out Android branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-a1-a3
          fetch-depth: 0

      - name: Make machine-local SDK state verifier-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/verify-android-project.mjs")
          text = path.read_text()
          old = '''if (existsSync(resolve(root, "src-tauri/gen/android/local.properties"))) {
            failures.push("src-tauri/gen/android/local.properties must remain untracked and machine-local");
          }
          '''
          new = '''const trackedLocalProperties = execFileSync(
            "git",
            ["ls-files", "--error-unmatch", "src-tauri/gen/android/local.properties"],
            { cwd: root, encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] },
          ).trim();
          if (trackedLocalProperties !== "") {
            failures.push("src-tauri/gen/android/local.properties must remain untracked and machine-local");
          }
          '''
          if old not in text:
              raise SystemExit("Android local.properties verifier anchor was not found")
          text = text.replace(
              'import { existsSync } from "node:fs";\n',
              'import { execFileSync } from "node:child_process";\nimport { existsSync } from "node:fs";\n',
              1,
          )
          text = text.replace(old, new, 1)
          # git ls-files --error-unmatch exits nonzero for the desired untracked
          # state, so use a small helper instead of allowing execFileSync to throw.
          text = text.replace(
              '''const trackedLocalProperties = execFileSync(
            "git",
            ["ls-files", "--error-unmatch", "src-tauri/gen/android/local.properties"],
            { cwd: root, encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] },
          ).trim();
          if (trackedLocalProperties !== "") {''',
              '''let trackedLocalProperties = "";
          try {
            trackedLocalProperties = execFileSync(
              "git",
              ["ls-files", "--error-unmatch", "src-tauri/gen/android/local.properties"],
              { cwd: root, encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] },
            ).trim();
          } catch {
            trackedLocalProperties = "";
          }
          if (trackedLocalProperties !== "") {''',
              1,
          )
          path.write_text(text)
          PY
          rm -f .github/workflows/fix-android-verifier.yml

      - name: Commit verifier normalization
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: keep Android SDK paths machine-local"
          git push origin HEAD:agent/android-a1-a3
