name: UI platform overhaul terminal gate

on:
  push:
    branches:
      - agent/ui-platform-overhaul
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  fast-gate:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Require finalized product tree
        id: finalized
        shell: bash
        run: |
          if [[ -f scripts/apply-ui-platform-overhaul.mjs ]] || compgen -G 'scripts/fix-ui-platform-overhaul-migration*.mjs' >/dev/null || [[ -f scripts/finalize-ui-platform-overhaul.mjs ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The generated implementation has not reached its terminal commit yet."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.finalized.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run fast repository gate
        id: check
        if: steps.finalized.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check-fast.sh 2>&1 | tee ui-platform-overhaul-fast-gate.log

      - name: Upload gate log
        if: always() && steps.finalized.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ui-platform-overhaul-fast-gate-${{ github.run_id }}
          path: ui-platform-overhaul-fast-gate.log
          if-no-files-found: error
          retention-days: 14

      - name: Update pull request status comment
        if: always()
        uses: actions/github-script@v7
        env:
          FINALIZED: ${{ steps.finalized.outputs.ready }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const marker = '<!-- ui-platform-overhaul-terminal-gate -->';
            const { owner, repo } = context.repo;
            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:agent/ui-platform-overhaul`,
              state: 'open',
            });
            const pull = pulls.data[0];
            if (!pull) return;

            let body;
            if (process.env.FINALIZED !== 'true') {
              body = `${marker}\n### UI overhaul gate\n\n⏳ The branch is still waiting for its generated product-only commit. Validation has not started.`;
            } else if (process.env.CHECK_OUTCOME === 'success') {
              body = `${marker}\n### UI overhaul gate\n\n✅ \`./scripts/check-fast.sh\` passed on the self-hosted runner. The complete log is attached to workflow run **${context.runId}**.`;
            } else {
              body = `${marker}\n### UI overhaul gate\n\n❌ \`./scripts/check-fast.sh\` failed on the self-hosted runner. The complete log is attached to workflow run **${context.runId}**. The pull request remains draft.`;
            }

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.data.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
            }

      - name: Fail terminal gate
        if: steps.finalized.outputs.ready == 'true' && steps.check.outcome != 'success'
        run: exit 1
