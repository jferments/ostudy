name: Apply final diagnostics boundaries

on:
  push:
    branches:
      - agent/pre-public-platform-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-diagnostics-boundaries
  cancel-in-progress: false

jobs:
  harden:
    runs-on:
      - self-hosted
      - linux
      - x64
      - ostudy-unified
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Expose toolchains and native cache
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"

      - name: Apply final source transformation
        run: |
          python3 scripts/apply-final-diagnostics.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          rm scripts/apply-final-diagnostics.py
          rm .github/workflows/apply-final-diagnostics-boundaries.yml

      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden diagnostic redaction and event bounds"
          git push origin HEAD:agent/pre-public-platform-hardening

      - name: Provision native runtime and validate targeted contracts
        run: |
          ./scripts/install-native-deps.sh --pdfium-only
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib logging::tests::opaque_authorization_tokens_are_redacted -- --exact
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib logging::tests::serialized_events_have_a_hard_byte_ceiling -- --exact
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib database::tests::regenerate_public_baseline_schema_manifest -- --exact
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
