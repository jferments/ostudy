name: Stage 3.3 Clippy fixes

on:
  push:
    branches:
      - agent/stage-3-3-managed-assets-undo-delete

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, ostudy]
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/stage-3-3-managed-assets-undo-delete
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply exact Clippy fixes
        run: |
          python3 scripts/apply-stage33-clippy-fixes.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Commit fixed sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "fix: satisfy Stage 3.3 warning-free Clippy"
          git push origin HEAD:agent/stage-3-3-managed-assets-undo-delete
