name: Apply platform P2 file foundation

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p2-files-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Repair and apply P2 file foundation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-platform-p2-files-foundation.mjs')
          text = path.read_text()
          text = text.replace('`ExternalFilePort`', "'ExternalFilePort'")
          start = text.index('let pathsWithDirs = paths.replace(')
          end = text.index('const pathMethods = `', start)
          replacement = '''let pathsWithDirs = paths.replace(
            "        let document_staging_dir = documents_dir.join(\\\"staging\\\");\\n        std::fs::create_dir_all(&images_dir)?;\\n        std::fs::create_dir_all(&asset_staging_dir)?;\\n        std::fs::create_dir_all(&asset_quarantine_dir)?;\\n        std::fs::create_dir_all(&documents_dir)?;\\n        std::fs::create_dir_all(&document_staging_dir)?;",
            "        let document_staging_dir = documents_dir.join(\\\"staging\\\");\\n        let transfer_imports_dir = app_data_dir.join(\\\"transfers\\\").join(\\\"imports\\\");\\n        let transfer_exports_dir = app_data_dir.join(\\\"transfers\\\").join(\\\"exports\\\");\\n        std::fs::create_dir_all(&images_dir)?;\\n        std::fs::create_dir_all(&asset_staging_dir)?;\\n        std::fs::create_dir_all(&asset_quarantine_dir)?;\\n        std::fs::create_dir_all(&documents_dir)?;\\n        std::fs::create_dir_all(&document_staging_dir)?;\\n        std::fs::create_dir_all(&transfer_imports_dir)?;\\n        std::fs::create_dir_all(&transfer_exports_dir)?;",
          );
          if (pathsWithDirs === paths) throw new Error("paths.rs: directory block not found");
          '''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY
          node ./scripts/apply-platform-p2-files-foundation.mjs

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          ./scripts/install-native-deps.sh --pdfium-only

      - name: Format and compile
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          pnpm exec tsc -b --pretty false
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features
          node ./scripts/verify-project-manifests.mjs
          node ./scripts/verify-ipc-contract.mjs
          node ./scripts/verify-repository-policy.mjs
          node ./scripts/verify-platform-boundaries.mjs
          git diff --check

      - name: Commit qualified foundation
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add opaque external-file transfer foundation"
          git push origin HEAD:agent/platform-portability-p0-p2
