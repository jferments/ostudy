              "}\n"
              "if (authoring.includes(\"#[allow(dead_code)]\")) {\n"
              "  failures.push(\"authoring boundary contains a dead-code compatibility allowance\");\n"
              "}\n\n"
              "if (\n  !rustCommands.includes(\"practice_selection::start_card_practice\") ||\n",
          )
          replace_exact(
