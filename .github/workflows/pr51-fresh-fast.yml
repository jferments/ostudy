name: PR 51 fresh fast qualification

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): fresh fast check') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 60
    env:
      CI: true
      CARGO_TERM_COLOR: never
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Run fast qualification
        id: fast
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./scripts/check-fast.sh 2>&1 | tee "$RUNNER_TEMP/pr51-fresh-fast.log"

      - name: Record exact result
        env:
          OUTCOME: ${{ steps.fast.outcome }}
        run: |
          rm -f .github/pr51-fresh-fast-*
          if [[ "$OUTCOME" == "success" ]]; then
            touch .github/pr51-fresh-fast-pass
          else
            touch .github/pr51-fresh-fast-fail
            cp "$RUNNER_TEMP/pr51-fresh-fast.log" .github/pr51-fresh-fast.log
            python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/pr51-fresh-fast.log').read_text(errors='replace')
          patterns = {
              'typescript': r'error TS[0-9]+',
              'frontend-test': r'Test Files.*failed|Tests.*failed|FAIL .*\.test',
              'rust': r'error\[E[0-9]+\]|could not compile',
              'clippy': r'clippy|warnings-as-errors',
              'format': r'cargo fmt|Diff in /',
              'dependency': r'supply-chain|lockfile|dependency verification|Cargo.lock',
              'ipc-policy': r'IPC contract',
              'repo-policy': r'Repository policy|Platform boundaries',
              'docs-policy': r'Documentation:',
              'migration': r'migration contract|schema upgrade|migration.*failed',
              'sync-test': r'DeviceSync|device_sync',
          }
          for name, pattern in patterns.items():
              if re.search(pattern, text, re.I):
                  Path(f'.github/pr51-fresh-fast-{name}').touch()
          PY
          fi
          rm -f .github/workflows/pr51-fresh-fast.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add .github/pr51-fresh-fast-* .github/workflows/pr51-fresh-fast.yml
          git commit -m "chore(pr51): fresh fast check ${OUTCOME}"
          git push origin HEAD:agent/android-completion-a4-a7
          [[ "$OUTCOME" == "success" ]]
