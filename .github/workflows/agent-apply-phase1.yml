name: Agent apply phase one

on:
  push:
    branches: [agent/ui-ai-semantic-generation-overhaul]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-ai-semantic-generation-overhaul
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply phase one patch when present
        run: |
          set -Eeuo pipefail
          payload=.github/agent/phase1.patch.gz.b64
          [[ -f "$payload" ]] || exit 0
          base64 --decode "$payload" | gzip --decompress > "$RUNNER_TEMP/phase1.patch"
          git apply --index "$RUNNER_TEMP/phase1.patch"
          git rm -f "$payload" .github/workflows/agent-apply-phase1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Implement root navigation and compact study workflows"
          git push origin HEAD:agent/ui-ai-semantic-generation-overhaul
