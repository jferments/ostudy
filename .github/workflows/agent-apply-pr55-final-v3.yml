name: Apply PR 55 complete implementation v3

on:
  push:
    branches: [agent/ui-ai-semantic-generation-overhaul]
    paths:
      - .github/workflows/agent-apply-pr55-final-v3.yml

permissions:
  contents: write

concurrency:
  group: agent-apply-pr55-final-v3
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 180
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply every requested phase
        run: |
          set -Eeuo pipefail
          for script in \
            scripts/agent-pr55-phase1-3.py \
            scripts/agent-pr55-ai-settings.py \
            scripts/agent-pr55-document-policy.py \
            scripts/agent-pr55-semantic-targets.py \
            scripts/agent-pr55-compile-compat.py
          do
            if [[ -f "$script" ]]; then
              python3 "$script"
            fi
          done

      - name: Remove all temporary agent automation
        run: |
          rm -f scripts/agent-pr55-*.py .github/workflows/agent-*.yml

      - name: Format complete changed surface
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write 'src/**/*.{ts,tsx,css}' 'docs/**/*.md'
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run repository, TypeScript, and locked Rust qualification
        run: |
          set -Eeuo pipefail
          bash ./scripts/check-static.sh
          pnpm exec tsc --noEmit
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Publish compile-qualified fast-forward commit
        run: |
          set -Eeuo pipefail
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          tree_sha="$(git write-tree)"
          git fetch --no-tags origin agent/ui-ai-semantic-generation-overhaul
          parent_sha="$(git rev-parse FETCH_HEAD)"
          commit_sha="$(printf '%s\n' 'feat: overhaul responsive AI-assisted study workflows' | git commit-tree "$tree_sha" -p "$parent_sha")"
          git reset --hard "$commit_sha"
          git push origin HEAD:agent/ui-ai-semantic-generation-overhaul
