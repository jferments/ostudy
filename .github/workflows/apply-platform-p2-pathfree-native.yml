name: Apply path-free native workflows

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p2-pathfree-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply native migration
        run: |
          node ./scripts/run-platform-p2-pathfree-native.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src-tauri/src/authoring/card_types_and_templates/generated_import/mod.rs')
          text = path.read_text()
          text = text.replace(
              'use prepare::prepare_flashcard_import_bytes;',
              '#[cfg(test)]\nuse prepare::prepare_flashcard_import;\nuse prepare::prepare_flashcard_import_bytes;',
          )
          path.write_text(text)

          path = Path('src-tauri/src/authoring/card_types_and_templates/generated_import/apply.rs')
          text = path.read_text()
          text = text.replace(
              'pub(super) fn import_prepared_flashcards(',
              '#[cfg(test)]\npub(super) fn import_prepared_flashcards(',
              1,
          )
          path.write_text(text)

          path = Path('src-tauri/src/asset_lifecycle.rs')
          text = path.read_text()
          text = text.replace(
              'fn stage_source_in_connection(',
              '#[cfg(test)]\nfn stage_source_in_connection(',
              1,
          )
          path.write_text(text)

          path = Path('src-tauri/src/authoring/card_types_and_templates/templates.rs')
          text = path.read_text()
          text = text.replace('let relative_path: String = row.get(4)?;', 'let _relative_path: String = row.get(4)?;')
          text = re.sub(
              r'(fn load_template_assets\([^)]*?\n\s*)paths: &AppPaths,',
              r'\1_paths: &AppPaths,',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'(fn load_template_assets_for_templates\([^)]*?\n\s*)paths: &AppPaths,',
              r'\1_paths: &AppPaths,',
              text,
              flags=re.S,
          )
          path.write_text(text)

          path = Path('src-tauri/src/external_files.rs')
          text = path.read_text()
          text = re.sub(
              r'pub\(crate\) struct ResolvedStagedImport \{[\s\S]*?\n\}',
              'pub(crate) struct ResolvedStagedImport {\n    pub path: PathBuf,\n    pub display_name: String,\n}',
              text,
              count=1,
          )
          text = re.sub(
              r'struct StoredPreparedExport \{\n    dto: PreparedExportDto,\n    relative_path: String,\n    state: String,\n    summary_json: String,\n\}',
              'struct StoredPreparedExport {\n    dto: PreparedExportDto,\n    relative_path: String,\n    summary_json: String,\n}',
              text,
              count=1,
          )
          text = re.sub(
              r'Ok\(ResolvedStagedImport \{[\s\S]*?\n    \}\)',
              'Ok(ResolvedStagedImport {\n        path,\n        display_name: stored.0.display_name,\n    })',
              text,
              count=1,
          )
          text = text.replace('        state: row.6,\n', '')
          path.write_text(text)

          path = Path('src-tauri/src/library_backup.rs')
          text = path.read_text()
          text = re.sub(
              r'fn normalize_backup_path\([\s\S]*?\n\}\n\n',
              '',
              text,
              count=1,
          )
          path.write_text(text)

          path = Path('src-tauri/src/studydeck.rs')
          text = path.read_text().replace(
              'const MAX_PACKAGE_FILE_BYTES: u64 = 640 * 1024 * 1024;\n',
              '',
          )
          path.write_text(text)
          PY

      - name: Provision native dependencies
        run: ./scripts/install-native-deps.sh --pdfium-only

      - name: Format and compile native tree
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features
          git diff --check

      - name: Commit native migration
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consume opaque file handles natively"
          git push origin HEAD:agent/platform-portability-p0-p2
