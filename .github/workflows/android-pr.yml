name: Android PR qualification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 90
    env:
      CI: true
      CARGO_TERM_COLOR: always
      GRADLE_USER_HOME: ${{ github.workspace }}/.runner-cache/gradle
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Expose persistent toolchain caches
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$GRADLE_USER_HOME" "$OSTUDY_CARGO_TARGET_DIR"

      - name: Verify unified runner and nested KVM
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Install exact JavaScript graph
        run: pnpm install --frozen-lockfile

      - name: Android compile, lint, unit, instrumentation-package, and APK gate
        run: bash ./scripts/android-test.sh

      - name: Android API 36 emulator smoke gate
        run: bash ./scripts/android-emulator-smoke.sh

      - name: Upload Android failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-pr-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            src-tauri/gen/android/app/build/reports/**
            src-tauri/gen/android/app/build/outputs/**
            .runner-artifacts/android-smoke/**
          if-no-files-found: ignore
          retention-days: 14
