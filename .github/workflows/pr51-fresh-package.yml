name: PR 51 fresh Android packaging

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  package:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): fresh package check') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 120
    env:
      CI: true
      CARGO_TERM_COLOR: never
      GRADLE_USER_HOME: ${{ github.workspace }}/.runner-cache/gradle
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact JavaScript graph
        run: pnpm install --frozen-lockfile

      - name: Build installable debug APK through the public wrapper
        id: debug
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm android:build:debug 2>&1 | tee "$RUNNER_TEMP/pr51-package-debug.log"

      - name: Enumerate Android artifacts and checksums
        id: artifacts
        if: steps.debug.outcome == 'success'
        continue-on-error: true
        run: pnpm android:artifacts 2>&1 | tee "$RUNNER_TEMP/pr51-package-artifacts.log"

      - name: Verify a debug APK exists
        id: verify_debug
        if: steps.debug.outcome == 'success'
        continue-on-error: true
        run: |
          apk="$(find src-tauri/gen/android/app/build/outputs -type f -name '*debug*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          sha256sum "$apk" | tee "$RUNNER_TEMP/pr51-debug-apk.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 20

      - name: Build release APK through the public wrapper
        id: release_apk
        if: steps.debug.outcome == 'success'
        continue-on-error: true
        run: pnpm android:build:release 2>&1 | tee "$RUNNER_TEMP/pr51-package-release-apk.log"

      - name: Build release AAB through the public wrapper
        id: release_aab
        if: steps.release_apk.outcome == 'success'
        continue-on-error: true
        run: pnpm android:bundle:release 2>&1 | tee "$RUNNER_TEMP/pr51-package-release-aab.log"

      - name: Record exact result
        env:
          DEBUG_OUTCOME: ${{ steps.debug.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifacts.outcome }}
          VERIFY_DEBUG_OUTCOME: ${{ steps.verify_debug.outcome }}
          RELEASE_APK_OUTCOME: ${{ steps.release_apk.outcome }}
          RELEASE_AAB_OUTCOME: ${{ steps.release_aab.outcome }}
        run: |
          rm -f .github/pr51-fresh-package-*
          success=true
          for value in "$DEBUG_OUTCOME" "$ARTIFACT_OUTCOME" "$VERIFY_DEBUG_OUTCOME" "$RELEASE_APK_OUTCOME" "$RELEASE_AAB_OUTCOME"; do
            [[ "$value" == "success" ]] || success=false
          done
          if [[ "$success" == true ]]; then
            touch .github/pr51-fresh-package-pass
          else
            touch .github/pr51-fresh-package-fail
            [[ "$DEBUG_OUTCOME" == "success" ]] || touch .github/pr51-fresh-package-debug
            [[ "$ARTIFACT_OUTCOME" == "success" ]] || touch .github/pr51-fresh-package-artifacts
            [[ "$VERIFY_DEBUG_OUTCOME" == "success" ]] || touch .github/pr51-fresh-package-verify-debug
            [[ "$RELEASE_APK_OUTCOME" == "success" ]] || touch .github/pr51-fresh-package-release-apk
            [[ "$RELEASE_AAB_OUTCOME" == "success" ]] || touch .github/pr51-fresh-package-release-aab
            for log in "$RUNNER_TEMP"/pr51-package-*.log; do
              [[ -f "$log" ]] || continue
              echo "===== $(basename "$log") =====" >> .github/pr51-fresh-package.log
              tail -n 160 "$log" >> .github/pr51-fresh-package.log
            done
          fi
          rm -f .github/workflows/pr51-fresh-package.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add .github/pr51-fresh-package-* .github/workflows/pr51-fresh-package.yml
          git commit -m "chore(pr51): fresh package check $success"
          git push origin HEAD:agent/android-completion-a4-a7
          [[ "$success" == true ]]

      - name: Upload APK and AAB evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-android-packages-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
            ${{ runner.temp }}/pr51-debug-apk.sha256
          if-no-files-found: ignore
          retention-days: 14
