name: Apply atomic draft retirement natively

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p2-atomic-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply native atomicity changes
        run: node ./scripts/run-platform-p2-atomic-native.mjs

      - name: Provision native dependencies
        run: |
          ./scripts/install-native-deps.sh --pdfium-only
          echo "OSTUDY_PDFIUM_PATH=$GITHUB_WORKSPACE/src-tauri/resources/native/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Qualify native atomicity
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features
          git diff --check

      - name: Remove applicator and commit
        run: |
          rm scripts/apply-platform-p2-atomic-native.mjs
          rm scripts/run-platform-p2-atomic-native.mjs
          rm .github/workflows/apply-platform-p2-atomic-native.yml
          git diff --check
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: retire durable drafts inside canonical transactions"
          git push origin HEAD:agent/platform-portability-p0-p2
