name: PR 51 consolidated integration

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

concurrency:
  group: pr51-consolidated-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): integrate Android completion') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 90
    env:
      CI: true
      CARGO_TERM_COLOR: always
      GRADLE_USER_HOME: ${{ github.workspace }}/.runner-cache/gradle
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Verify unified runner
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Correct pre-execution insertion semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/pr51-integrate.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              'content = insert_after(content, anchor, commands, "path-free sync commands")',
              'content = content.replace(anchor, commands + anchor, 1)',
          )
          content = content.replace(
              'content = insert_after(content, anchor, helpers, "transport sync helpers")',
              'content = content.replace(anchor, helpers + anchor, 1)',
          )
          path.write_text(content, encoding="utf-8")
          PY

      - name: Apply consolidated exact-anchor integration
        run: python3 ./scripts/pr51-integrate.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Install exact JavaScript graph
        run: pnpm install --frozen-lockfile

      - name: Resolve and compile the Rust graph
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Run fast repository qualification
        run: bash ./scripts/check-fast.sh

      - name: Run Android compile and instrumentation-package qualification
        run: bash ./scripts/android-test.sh

      - name: Commit integrated result and remove temporary machinery
        env:
          EXPECTED_BRANCH: agent/android-completion-a4-a7
        run: |
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(pr51): integrate Android completion"
          git push origin HEAD:"$EXPECTED_BRANCH"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-integration-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/reports/**
            src-tauri/gen/android/app/build/outputs/**
            Cargo.lock
          if-no-files-found: ignore
          retention-days: 14
