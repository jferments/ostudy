name: Apply analytics overhaul

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .agent/apply_analytics.py.gz
      - .github/workflows/agent-apply-analytics.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply deterministic analytics changes
        run: |
          gzip -dc .agent/apply_analytics.py.gz > .agent/apply_analytics.py
          python3 .agent/apply_analytics.py
          rm -f .agent/apply_analytics.py

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate analytics and core UI changes
        run: |
          git diff --check
          ./scripts/check-fast.sh

      - name: Remove one-shot transformation
        run: rm -f .agent/apply_analytics.py.gz .github/workflows/agent-apply-analytics.yml

      - name: Commit source changes
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: add line analytics and custom date ranges"
          git push origin HEAD:${GITHUB_REF_NAME}
