name: Regenerate public baseline manifest

on:
  push:
    branches: [agent/pre-public-platform-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-public-baseline-manifest
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 45

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Expose toolchains and native cache
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"

      - name: Add the bundled-SQLite manifest generator
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/database.rs")
          source = path.read_text(encoding="utf-8")
          marker = '''    #[test]
              fn public_baseline_is_idempotent_and_matches_manifest() {
          '''
          generator = '''    #[test]
              #[ignore = "maintenance utility"]
              fn regenerate_public_baseline_schema_manifest() {
                  use sha2::{Digest, Sha256};

                  let database = Database::open_in_memory().expect("database should open");
                  let objects = database
                      .with_connection(|connection| {
                          let objects = schema_objects(connection).map_err(CommandError::database)?;
                          serde_json::to_value(objects).map_err(CommandError::serialization)
                      })
                      .expect("public schema objects should serialize");
                  let manifest = serde_json::json!({
                      "formatVersion": 1,
                      "schemaLineage": PUBLIC_SCHEMA_LINEAGE,
                      "schemaVersion": LATEST_SCHEMA_VERSION,
                      "baselineSha256": format!(
                          "{:x}",
                          Sha256::digest(MIGRATIONS[0].sql.as_bytes())
                      ),
                      "objects": objects,
                  });
                  let output = serde_json::to_string_pretty(&manifest)
                      .expect("public schema manifest should serialize");
                  let path = std::path::Path::new(env!("CARGO_MANIFEST_DIR"))
                      .join("tests/fixtures/public-baseline-schema.json");
                  std::fs::write(path, format!("{output}\\n"))
                      .expect("public schema manifest should be written");
              }

              #[test]
              fn public_baseline_is_idempotent_and_matches_manifest() {
          '''
          if source.count(marker) != 1:
              raise SystemExit(f"expected one baseline test insertion point, found {source.count(marker)}")
          path.write_text(source.replace(marker, generator, 1), encoding="utf-8")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit generator source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/database.rs
          git commit -m "test: add public schema manifest generator"
          git push origin HEAD:agent/pre-public-platform-hardening

      - name: Provision native runtime
        run: ./scripts/install-native-deps.sh --pdfium-only

      - name: Regenerate with the bundled SQLite engine
        run: |
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-features \
            --lib \
            database::tests::regenerate_public_baseline_schema_manifest \
            -- --ignored --exact

      - name: Commit regenerated manifest
        run: |
          git add src-tauri/tests/fixtures/public-baseline-schema.json
          git diff --cached --quiet && { echo 'Manifest was already current.'; exit 0; }
          git commit -m "test: regenerate public baseline schema manifest"
          git push origin HEAD:agent/pre-public-platform-hardening

      - name: Verify exact baseline contract
        run: |
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-features \
            --lib \
            database::tests::public_baseline_is_idempotent_and_matches_manifest \
            -- --exact
