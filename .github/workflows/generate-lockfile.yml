name: Finalize Phase 1 generated files

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-phase-1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'chore/phase-1-repository-stabilization'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: chore/phase-1-repository-stabilization
          fetch-depth: 0

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Regenerate the pnpm lockfile
        run: |
          npm install --global pnpm@11.14.0
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Format Rust sources with the pinned toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit generated files when needed
        run: |
          set -Eeuo pipefail
          git add pnpm-lock.yaml src-tauri/src
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh generated Phase 1 files"
          git push origin HEAD:chore/phase-1-repository-stabilization
