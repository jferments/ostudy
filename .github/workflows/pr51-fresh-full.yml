name: PR 51 fresh full qualification

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): fresh full check') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 90
    env:
      CI: true
      CARGO_TERM_COLOR: never
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Run authoritative full qualification
        id: full
        continue-on-error: true
        run: |
          set -o pipefail
          bash ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/pr51-fresh-full.log"

      - name: Record exact result
        env:
          OUTCOME: ${{ steps.full.outcome }}
        run: |
          rm -f .github/pr51-fresh-full-*
          if [[ "$OUTCOME" == "success" ]]; then
            touch .github/pr51-fresh-full-pass
          else
            touch .github/pr51-fresh-full-fail
            cp "$RUNNER_TEMP/pr51-fresh-full.log" .github/pr51-fresh-full.log
            python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/pr51-fresh-full.log').read_text(errors='replace')
          patterns = {
              'webdriver': r'WebDriver|tauri-driver|RemoteDisconnected|connection reset by peer',
              'native-smoke': r'Native Tauri/WebDriver smoke|durable-library',
              'frontend': r'Test Files.*failed|error TS[0-9]+',
              'rust': r'error\[E[0-9]+\]|could not compile',
              'build': r'Standalone Tauri build|beforeBuildCommand|vite build.*failed',
              'policy': r'Repository policy|IPC contract|Platform boundaries|Documentation:',
              'timeout': r'timed out|timeout',
          }
          for name, pattern in patterns.items():
              if re.search(pattern, text, re.I):
                  Path(f'.github/pr51-fresh-full-{name}').touch()
          PY
          fi
          rm -f .github/workflows/pr51-fresh-full.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add .github/pr51-fresh-full-* .github/workflows/pr51-fresh-full.yml
          git commit -m "chore(pr51): fresh full check ${OUTCOME}"
          git push origin HEAD:agent/android-completion-a4-a7
          [[ "$OUTCOME" == "success" ]]

      - name: Upload bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-full-${{ github.sha }}
          path: |
            .github/pr51-fresh-full.log
            .artifacts/**
          if-no-files-found: ignore
          retention-days: 14
