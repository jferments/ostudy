name: Remove alphabetical card sort

on:
  push:
    branches:
      - agent/ui-platform-overhaul

permissions:
  contents: write

concurrency:
  group: remove-alphabetical-card-sort
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Apply cleanup
        run: node ./scripts/remove-alphabetical-card-sort.mjs

      - name: Verify obsolete sort is gone
        run: |
          if grep -R --line-number --fixed-strings 'question_asc' src src-tauri tests; then
            echo 'Obsolete question_asc references remain.' >&2
            exit 1
          fi

      - name: Normalize Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Publish product-only cleanup
        run: |
          git rm scripts/remove-alphabetical-card-sort.mjs .github/workflows/remove-alphabetical-card-sort.yml
          git add -A
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "refactor: remove alphabetical card sorting"
          git push origin HEAD:agent/ui-platform-overhaul
