name: UI policy

on:
  pull_request:
    paths:
      - "src/ui/**"
      - "src/screens/**"
      - "scripts/generate-ui-tokens.mjs"
      - "scripts/verify-ui-policy.mjs"
      - ".github/workflows/ui-policy.yml"
  push:
    branches:
      - agent/ui-foundation-overhaul-u0-u9
    paths:
      - "src/ui/**"
      - "src/screens/**"
      - "scripts/generate-ui-tokens.mjs"
      - "scripts/verify-ui-policy.mjs"
      - ".github/workflows/ui-policy.yml"

permissions:
  contents: read

concurrency:
  group: ui-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify semantic UI policy
        run: node scripts/verify-ui-policy.mjs
