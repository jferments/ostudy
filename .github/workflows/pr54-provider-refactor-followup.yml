name: PR54 provider refactor follow-up

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: pr54-provider-refactor-followup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply follow-up
        run: |
          python3 ./scripts/pr54_provider_refactor_followup.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo 'Provider refactor follow-up is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/src/ai/document_intelligence.rs \
            src-tauri/src/ai/gateway.rs
          git diff --cached --check
          git commit -m 'fix(ai): finish provider-neutral stream integration'
          git push origin HEAD:agent/pre-public-platform-hardening
