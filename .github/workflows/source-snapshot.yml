name: Finalize PR 86

on:
  push:
    branches:
      - agent/mobile-flashcards-navigation-cleanup

permissions:
  contents: write

concurrency:
  group: finalize-pr86
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 30
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/mobile-flashcards-navigation-cleanup
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final smoke, compatibility, and documentation updates
        run: |
          python3 ./scripts/finish-pr86.py
          rm -f ./scripts/finish-pr86.py
          rm -f ./.github/workflows/source-snapshot.yml

      - name: Verify lightweight contracts
        run: |
          python3 -m py_compile tests/webdriver/ui_platform_smoke.py
          bash -n scripts/android-emulator-smoke.sh
          node --check scripts/verify-route-smoke-contract.mjs
          node scripts/verify-route-smoke-contract.mjs
          python3 -m unittest tests.scripts.test_route_smoke_contract
          python3 -m unittest tests.scripts.test_mobile_navigation_contract

      - name: Run static and fast qualification
        run: |
          OSTUDY_FORCE_CHECK=1 ./scripts/check-static.sh
          OSTUDY_FORCE_CHECK=1 ./scripts/check-fast.sh

      - name: Commit and publish the final source
        run: |
          if git diff --quiet --exit-code && git diff --cached --quiet --exit-code; then
            echo 'No final source changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ui): complete navigation and smoke coverage'
          git push origin HEAD:agent/mobile-flashcards-navigation-cleanup
