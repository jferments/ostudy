name: Source Snapshot

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Package repository source
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=target \
            --exclude=src-tauri/target \
            --exclude=artifacts \
            --exclude=.pnpm-store \
            -czf "$RUNNER_TEMP/ostudy-source-snapshot.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-source-snapshot-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ostudy-source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
