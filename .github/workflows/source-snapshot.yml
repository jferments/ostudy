name: Source Snapshot

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Upload selected sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-source-snapshot-${{ github.event.pull_request.head.sha }}
          path: |
            tests/webdriver/ui_platform_smoke.py
            src-tauri/gen/android/app/src/androidTest/java/io/github/jferments/ostudy/AndroidSmokeTest.kt
            src/controllers/useAppController.ts
            src/controllers/useAppController.checkpoint.test.tsx
            src/App.tsx
            src/App.test.tsx
            src/components/NavigationSidebar.module.css
            src/screens/SettingsScreen.test.tsx
            src/screens/flashcards/DeckLibraryWorkspace.test.tsx
            src/navigation/flashcardsRoutes.test.ts
            scripts/route-smoke-contract.json
            scripts/verify-route-smoke-contract.mjs
            tests/scripts/test_route_smoke_contract.py
            docs/architecture/ui.md
            docs/user-guide/getting-started.md
          if-no-files-found: warn
          retention-days: 1
