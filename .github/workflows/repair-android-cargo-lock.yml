name: Repair Android Cargo lockfile

on:
  push:
    branches:
      - agent/android-a1-a3
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-android-cargo-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 20

    steps:
      - name: Check out Android branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-a1-a3
          fetch-depth: 0

      - name: Expose Rust tools
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Update the existing lockfile resolution
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 >/dev/null
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --format-version 1 >/dev/null
          grep -q 'name = "tauri-plugin-ostudy-platform"' src-tauri/Cargo.lock
          git diff --check

      - name: Retire repair workflow and commit lockfile
        run: |
          rm .github/workflows/repair-android-cargo-lock.yml
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/Cargo.lock .github/workflows/repair-android-cargo-lock.yml
          git diff --cached --check
          git commit -m "fix: synchronize Android Cargo lockfile"
          git push origin HEAD:agent/android-a1-a3
