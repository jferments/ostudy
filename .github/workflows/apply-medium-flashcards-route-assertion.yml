name: Apply medium Flashcards route assertion

on:
  push:
    branches:
      - agent/pre-public-platform-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-medium-flashcards-route-assertion
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - ostudy-unified
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Replace redundant navigation mutation
        run: |
          python3 scripts/apply-medium-flashcards-route-assertion.py
          python3 -m py_compile tests/webdriver/ui_platform_smoke.py
          rm scripts/apply-medium-flashcards-route-assertion.py
          rm .github/workflows/apply-medium-flashcards-route-assertion.yml
          rm -f scripts/medium-flashcards-route-trigger.txt

      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: avoid redundant Flashcards navigation mutation"
          git push origin HEAD:agent/pre-public-platform-hardening
