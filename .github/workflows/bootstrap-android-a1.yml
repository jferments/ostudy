name: Bootstrap Android A1 shell

on:
  push:
    branches:
      - agent/android-a1-a3
    paths:
      - .github/workflows/bootstrap-android-a1.yml
      - scripts/android-env.sh
      - scripts/android-doctor.sh
      - scripts/install-android-deps.sh
      - versions.env
      - package.json
      - pnpm-lock.yaml
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-android-a1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 90
    steps:
      - name: Check out Android branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-a1-a3
          fetch-depth: 0

      - name: Expose repository tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Provision JDK 17
        run: |
          if ! command -v javac >/dev/null 2>&1 \
             || [[ "$(javac -version 2>&1 | sed -E 's/^javac ([0-9]+).*/\1/')" != "17" ]]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk-headless
          fi
          java_path="$(readlink -f "$(command -v javac)")"
          java_home="$(dirname "$(dirname "$java_path")")"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          echo "$java_home/bin" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      - name: Install pinned Android SDK and NDK
        run: |
          bash ./scripts/install-android-deps.sh
          source ./scripts/android-env.sh
          android_emit_github_environment

      - name: Install JavaScript and Rust targets
        run: |
          pnpm install --frozen-lockfile
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Generate Tauri Android project
        run: |
          source ./scripts/android-env.sh
          if [[ ! -f src-tauri/gen/android/gradlew ]]; then
            pnpm tauri android init --ci
          else
            echo "Android project already exists; keeping the committed generated shell."
          fi
          android_write_local_properties
          find src-tauri/gen/android -maxdepth 6 -type f | sort

      - name: Commit generated Android shell
        run: |
          rm -f src-tauri/gen/android/local.properties
          git update-index --chmod=+x \
            scripts/android-env.sh \
            scripts/android-doctor.sh \
            scripts/install-android-deps.sh
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/gen/android src-tauri/tauri.android.conf.json \
            scripts/android-env.sh scripts/android-doctor.sh scripts/install-android-deps.sh 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated Android changes were required."
            exit 0
          fi
          git commit -m "feat: generate the Tauri Android shell"
          git push origin HEAD:agent/android-a1-a3
