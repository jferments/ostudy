name: Apply platform P1 runtime ports

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ hashFiles('scripts/apply-platform-p1.mjs') != '' }}
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply P1 transformation
        run: node ./scripts/apply-platform-p1.mjs

      - name: Format generated sources
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit P1 implementation
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: introduce portable runtime services"
          git push origin HEAD:agent/platform-portability-p0-p2
