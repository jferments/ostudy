name: Apply native WebDriver polling recovery

on:
  push:
    branches:
      - agent/pre-public-platform-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-native-webdriver-polling-recovery
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - ostudy-unified
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded read-only polling recovery
        run: |
          python3 scripts/apply-webdriver-poll-retry.py
          rm scripts/apply-webdriver-poll-retry.py
          rm .github/workflows/apply-webdriver-poll-retry.yml
          rm -f scripts/webdriver-poll-retry-trigger.txt

      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: recover read-only WebDriver polling disconnects"
          git push origin HEAD:agent/pre-public-platform-hardening

      - name: Run WebDriver harness regression tests
        run: |
          python3 -m unittest discover -s tests/scripts -p 'test_webdriver_smoke.py'
          python3 -m py_compile tests/webdriver/smoke.py tests/webdriver/ui_platform_smoke.py
