name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            jq \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            python3 \
            sqlite3 \
            webkit2gtk-driver \
            xauth \
            xvfb

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.14.0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Generate qualified Linux artifacts
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ostudy-${{ github.ref_name }}-linux
          path: artifacts/${{ github.ref_name }}/**
          if-no-files-found: error
