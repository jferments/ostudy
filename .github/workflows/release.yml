name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 75
    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Generate qualified Linux artifacts
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ostudy-${{ github.ref_name }}-linux
          path: artifacts/${{ github.ref_name }}/**
          if-no-files-found: error
