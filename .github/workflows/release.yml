name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 180
    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI runner identity and isolation
        run: bash ./scripts/runner/ci-runtime-preflight.sh

      - name: Expose pinned user toolchains and persistent cache
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/ostudy/cargo-target"

      - name: Generate qualified Linux artifacts
        run: ./scripts/release.sh "$GITHUB_REF_NAME"

      - name: Persist release artifacts on runner
        run: |
          bash ./scripts/persist-runner-output.sh linux-release \
            "artifacts/${GITHUB_REF_NAME}"
