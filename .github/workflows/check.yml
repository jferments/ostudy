name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Qualification tier to run
        required: true
        default: all-full
        type: choice
        options:
          - preflight
          - static
          - fast
          - linux-full
          - android-full
          - all-full
      force_requalification:
        description: Ignore reusable qualification stamps and rerun the selected gate
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  # Automatic and manual runs use separate pending slots. New source/lifecycle
  # events supersede automatic work; duplicate manual runs supersede manual work.
  cancel-in-progress: true

permissions:
  contents: read

# Check never writes source. Draft source updates stay fast. Ready pull
# requests and explicit manual dispatches are the only paths to terminal full
# qualification. Static always validates the exact current source. Expensive
# Linux/Android tiers may reuse a prior runner-local pass only when their
# product/toolchain fingerprint is unchanged; a manual dispatch can force a
# fresh execution. A failed run ends with its failure summary and an error
# annotation, so the last lines of the job log say what failed and how to
# reproduce it.

jobs:
  check:
    # A closed event exists only to enter this concurrency group and cancel
    # obsolete work for the abandoned PR.
    if: github.event.action != 'closed'
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-check' || 'check' }}
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 300

    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OSTUDY_CI_LOG_FILTER: warn,ostudy=info
      OSTUDY_LOG: warn,ostudy=info
      OSTUDY_DIAGNOSTICS_ACTIVE: "1"
      OSTUDY_DIAGNOSTICS_AUTOMATIC: "1"
      OSTUDY_KEEP_FAILURE_ARTIFACTS: "1"
      OSTUDY_ALLOW_QUALIFICATION_REUSE: "1"
      OSTUDY_FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.force_requalification && '1' || '0' }}

    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI runner identity and isolation
        run: bash ./scripts/runner/ci-runtime-preflight.sh

      - name: Expose pinned user toolchains and persistent caches
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "OSTUDY_DIAGNOSTIC_ARTIFACT_ROOT=$RUNNER_TEMP/ostudy-diagnostics" >> "$GITHUB_ENV"
          mkdir -p \
            "$HOME/.cache/ostudy/gradle" \
            "$HOME/.cache/ostudy/cargo-target"

      - name: Bound the persistent Cargo target
        run: bash ./scripts/runner/bound-cargo-target.sh

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Select qualification gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_GATE: ${{ inputs.gate || 'all-full' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          gate="$(node ./scripts/select-check-gate.mjs)"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Selected qualification gate: $gate"

      - name: Run static qualification first
        id: static
        if: steps.gate.outputs.gate != 'preflight'
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            bash ./scripts/check-static.sh

      - name: Verify unified runner resources and nested KVM
        id: preflight
        if: steps.gate.outputs.gate != 'static'
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Require committed Rust dependency graph
        id: dependency_graph
        if: steps.gate.outputs.gate != 'static'
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            --locked \
            > /dev/null

      - name: Run fast qualification
        id: fast
        if: steps.gate.outputs.gate == 'fast'
        env:
          OSTUDY_STATIC_CHECK_PASSED: ${{ steps.static.outcome == 'success' && '1' || '0' }}
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            bash ./scripts/check-fast.sh

      - name: Run authoritative Linux qualification
        id: linux_full
        if: steps.gate.outputs.gate == 'linux-full' || steps.gate.outputs.gate == 'all-full'
        env:
          OSTUDY_STATIC_CHECK_PASSED: ${{ steps.static.outcome == 'success' && '1' || '0' }}
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            bash ./scripts/check.sh

      - name: Qualify production Debian package
        id: linux_package
        if: steps.gate.outputs.gate == 'linux-full' || steps.gate.outputs.gate == 'all-full'
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-linux-package.log" \
            bash ./scripts/check-linux-package.sh \
              --output "$RUNNER_TEMP/ostudy-linux-package"

      - name: Persist production Debian package on runner
        if: always() && steps.linux_package.outcome == 'success'
        run: |
          bash ./scripts/persist-runner-output.sh linux-package \
            "$RUNNER_TEMP/ostudy-linux-package"

      - name: Run authoritative Android compile and package qualification
        id: android_compile
        if: steps.gate.outputs.gate == 'android-full' || steps.gate.outputs.gate == 'all-full'
        env:
          OSTUDY_LINUX_FULL_PASSED: ${{ steps.linux_full.outcome == 'success' && '1' || '0' }}
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            bash ./scripts/android-test.sh

      - name: Run authoritative Android Emulator smoke qualification
        id: android_smoke
        if: steps.gate.outputs.gate == 'android-full' || steps.gate.outputs.gate == 'all-full'
        env:
          OSTUDY_ANDROID_COMPILE_PASSED: ${{ steps.android_compile.outcome == 'success' && '1' || '0' }}
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            bash ./scripts/android-emulator-smoke.sh \
              --artifacts "$RUNNER_TEMP/android-smoke"

      - name: Write machine-readable qualification evidence
        id: qualification_evidence
        if: always()
        env:
          GATE: ${{ steps.gate.outputs.gate || 'unknown' }}
          JOB_STATUS: ${{ job.status }}
          STATIC_STATUS: ${{ steps.static.outcome }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outcome }}
          DEPENDENCY_STATUS: ${{ steps.dependency_graph.outcome }}
          FAST_STATUS: ${{ steps.fast.outcome }}
          LINUX_STATUS: ${{ steps.linux_full.outcome }}
          LINUX_PACKAGE_STATUS: ${{ steps.linux_package.outcome }}
          ANDROID_COMPILE_STATUS: ${{ steps.android_compile.outcome }}
          ANDROID_SMOKE_STATUS: ${{ steps.android_smoke.outcome }}
        run: |
          node ./scripts/write-qualification-result.mjs \
            --output "$RUNNER_TEMP/ostudy-qualification-result.json" \
            --status "$JOB_STATUS" \
            --gate "$GATE" \
            --step "static=${STATIC_STATUS:-skipped}" \
            --step "preflight=${PREFLIGHT_STATUS:-skipped}" \
            --step "dependency-graph=${DEPENDENCY_STATUS:-skipped}" \
            --step "fast=${FAST_STATUS:-skipped}" \
            --step "linux-full=${LINUX_STATUS:-skipped}" \
            --step "linux-package=${LINUX_PACKAGE_STATUS:-skipped}" \
            --step "android-compile=${ANDROID_COMPILE_STATUS:-skipped}" \
            --step "android-smoke=${ANDROID_SMOKE_STATUS:-skipped}" \
            --diagnostics "$RUNNER_TEMP/ostudy-diagnostics" \
            --diagnostics "$RUNNER_TEMP/android-smoke" \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            "$RUNNER_TEMP/ostudy-linux-package.log" \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize qualification failure
        if: failure()
        run: |
          summary="$RUNNER_TEMP/ostudy-failure-summary.md"
          node ./scripts/summarize-check-failure.mjs \
            --headline "$RUNNER_TEMP/ostudy-failure-headline.txt" \
            --diagnostics "$RUNNER_TEMP/ostudy-diagnostics" \
            --diagnostics "$RUNNER_TEMP/android-smoke" \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            "$RUNNER_TEMP/ostudy-linux-package.log" \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            > "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "Failure summary written; it is printed again as the last step of this job."

      - name: Export diagnostics after failure
        if: failure()
        run: bash ./scripts/export-diagnostics.sh "$RUNNER_TEMP/ostudy-unified-diagnostics.tar.gz"

      - name: Persist bounded diagnostic evidence on runner
        if: always()
        run: |
          bash ./scripts/persist-runner-output.sh qualification \
            "$RUNNER_TEMP/ostudy-qualification-result.json" \
            "$RUNNER_TEMP/ostudy-failure-summary.md" \
            "$RUNNER_TEMP/ostudy-diagnostics"

      - name: Persist bounded failure evidence on runner
        if: failure()
        run: |
          bash ./scripts/persist-runner-output.sh failure \
            "$RUNNER_TEMP/ostudy-unified-diagnostics.tar.gz" \
            "$RUNNER_TEMP/ostudy-failure-summary.md" \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            "$RUNNER_TEMP/ostudy-linux-package.log" \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            "$RUNNER_TEMP/ostudy-linux-package" \
            "$RUNNER_TEMP/android-smoke" \
            "src-tauri/gen/android/app/build/reports"

      - name: Publish exact-head qualification summary
        if: always()
        env:
          GATE: ${{ steps.gate.outputs.gate || 'unknown' }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '# ostudy qualification'
            echo
            echo "- Head: \`$QUALIFIED_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Gate: \`$GATE\`"
            echo "- Diagnostic baseline: \`$OSTUDY_CI_LOG_FILTER\`"
            echo "- Status: **$JOB_STATUS**"
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep this step last. Agents and people read a failed run from the end
      # of the job log, so the summary and the annotation must close it.
      - name: Report qualification failure
        if: failure()
        run: |
          summary="$RUNNER_TEMP/ostudy-failure-summary.md"
          headline="$RUNNER_TEMP/ostudy-failure-headline.txt"
          if [[ -s "$summary" ]]; then
            # Log excerpts in the summary must not be read as workflow commands.
            token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "::stop-commands::$token"
            cat "$summary"
            echo "::$token::"
          fi
          message="Qualification failed; see the steps above."
          if [[ -s "$headline" ]]; then
            message="$(head -n 1 "$headline" | sed 's/%/%25/g')"
          fi
          echo "::error title=ostudy qualification failed::$message"
