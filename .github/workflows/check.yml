name: Check

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, converted_to_draft]

concurrency:
  group: pr54-final-document-ai-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 15
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Expose pinned Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply deterministic cleanup
        run: python3 ./scripts/pr54_finalize_document_ai.py
      - name: Canonical Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
      - name: Commit product cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src docs/architecture/ai-and-document-processing.md
          git diff --cached --check
          git commit -m 'fix(ai): finish document routing cleanup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
