name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Qualification tier to run
        required: true
        default: all-full
        type: choice
        options:
          - preflight
          - static
          - fast
          - linux-full
          - android-full
          - all-full

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only source/lifecycle events reach this workflow, so a newer invocation for
  # the same PR/ref always supersedes obsolete work.
  cancel-in-progress: true

permissions:
  contents: read

# Source-writing maintenance is deliberately isolated in
# maintain-generated-candidates.yml and is never performed by Check.
# Draft source updates stay fast. Ready pull requests and explicit manual
# dispatches are the only paths to terminal full qualification.

jobs:
  check:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 300

    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OSTUDY_CI_LOG_FILTER: warn,ostudy=info
      OSTUDY_LOG: warn,ostudy=info
      OSTUDY_DIAGNOSTICS_ACTIVE: "1"
      OSTUDY_DIAGNOSTICS_AUTOMATIC: "1"
      OSTUDY_KEEP_FAILURE_ARTIFACTS: "1"

    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Expose pinned user toolchains and persistent caches
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          echo "OSTUDY_DIAGNOSTIC_ARTIFACT_ROOT=$RUNNER_TEMP/ostudy-diagnostics" >> "$GITHUB_ENV"
          mkdir -p \
            "$HOME/.cache/ostudy/gradle" \
            "$HOME/.cache/ostudy/cargo-target"

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Select qualification gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_GATE: ${{ inputs.gate || 'all-full' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          gate="$(node ./scripts/select-check-gate.mjs)"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Selected qualification gate: $gate"

      - name: Verify pull-request execution contract
        id: pr_contract
        if: github.event_name == 'pull_request'
        run: |
          node ./scripts/verify-pr-contract.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/ostudy-pr-contract.json"

      - name: Run static qualification first
        id: static
        if: steps.gate.outputs.gate != 'preflight'
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            bash ./scripts/check-static.sh

      - name: Verify unified runner resources and nested KVM
        id: preflight
        if: steps.gate.outputs.gate != 'static'
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Require committed Rust dependency graph
        id: dependency_graph
        if: steps.gate.outputs.gate != 'static'
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            --locked \
            > /dev/null

      - name: Run fast qualification
        id: fast
        if: steps.gate.outputs.gate == 'fast'
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            bash ./scripts/check-fast.sh

      - name: Run authoritative Linux qualification
        id: linux_full
        if: steps.gate.outputs.gate == 'linux-full' || steps.gate.outputs.gate == 'all-full'
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            bash ./scripts/check.sh

      - name: Run authoritative Android compile and package qualification
        id: android_compile
        if: steps.gate.outputs.gate == 'android-full' || steps.gate.outputs.gate == 'all-full'
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            bash ./scripts/android-test.sh

      - name: Run authoritative Android Emulator smoke qualification
        id: android_smoke
        if: steps.gate.outputs.gate == 'android-full' || steps.gate.outputs.gate == 'all-full'
        run: |
          bash ./scripts/run-ci-captured.sh \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            bash ./scripts/android-emulator-smoke.sh \
              --artifacts "$RUNNER_TEMP/android-smoke"

      - name: Write machine-readable qualification evidence
        id: qualification_evidence
        if: always()
        env:
          GATE: ${{ steps.gate.outputs.gate || 'unknown' }}
          JOB_STATUS: ${{ job.status }}
          PR_CONTRACT_STATUS: ${{ steps.pr_contract.outcome }}
          STATIC_STATUS: ${{ steps.static.outcome }}
          PREFLIGHT_STATUS: ${{ steps.preflight.outcome }}
          DEPENDENCY_STATUS: ${{ steps.dependency_graph.outcome }}
          FAST_STATUS: ${{ steps.fast.outcome }}
          LINUX_STATUS: ${{ steps.linux_full.outcome }}
          ANDROID_COMPILE_STATUS: ${{ steps.android_compile.outcome }}
          ANDROID_SMOKE_STATUS: ${{ steps.android_smoke.outcome }}
        run: |
          node ./scripts/write-qualification-result.mjs \
            --output "$RUNNER_TEMP/ostudy-qualification-result.json" \
            --status "$JOB_STATUS" \
            --gate "$GATE" \
            --step "pr-contract=${PR_CONTRACT_STATUS:-skipped}" \
            --step "static=${STATIC_STATUS:-skipped}" \
            --step "preflight=${PREFLIGHT_STATUS:-skipped}" \
            --step "dependency-graph=${DEPENDENCY_STATUS:-skipped}" \
            --step "fast=${FAST_STATUS:-skipped}" \
            --step "linux-full=${LINUX_STATUS:-skipped}" \
            --step "android-compile=${ANDROID_COMPILE_STATUS:-skipped}" \
            --step "android-smoke=${ANDROID_SMOKE_STATUS:-skipped}" \
            --diagnostics "$RUNNER_TEMP/ostudy-diagnostics" \
            --diagnostics "$RUNNER_TEMP/android-smoke" \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Render evidence-derived handoff
        id: handoff
        if: always()
        run: |
          arguments=(
            --qualification "$RUNNER_TEMP/ostudy-qualification-result.json"
            --repository-root "$GITHUB_WORKSPACE"
            --output "$RUNNER_TEMP/ostudy-agent-handoff.md"
          )
          if [[ -f "$RUNNER_TEMP/ostudy-pr-contract.json" ]]; then
            arguments+=(--contract "$RUNNER_TEMP/ostudy-pr-contract.json")
          fi
          status=0
          node ./scripts/render-agent-handoff.mjs "${arguments[@]}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ -f "$RUNNER_TEMP/ostudy-agent-handoff.md" ]]; then
            cat "$RUNNER_TEMP/ostudy-agent-handoff.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize qualification failure
        if: failure()
        run: |
          summary="$RUNNER_TEMP/ostudy-failure-summary.md"
          node ./scripts/summarize-check-failure.mjs \
            --diagnostics "$RUNNER_TEMP/ostudy-diagnostics" \
            --diagnostics "$RUNNER_TEMP/android-smoke" \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            > "$summary"
          cat "$summary"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Export diagnostics after failure
        if: failure()
        run: bash ./scripts/export-diagnostics.sh "$RUNNER_TEMP/ostudy-unified-diagnostics.tar.gz"

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-diagnostics-${{ env.QUALIFIED_SHA }}
          path: |
            ${{ runner.temp }}/ostudy-qualification-result.json
            ${{ runner.temp }}/ostudy-pr-contract.json
            ${{ runner.temp }}/ostudy-agent-handoff.md
            ${{ runner.temp }}/ostudy-failure-summary.md
            ${{ runner.temp }}/ostudy-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-unified-${{ env.QUALIFIED_SHA }}
          path: |
            ${{ runner.temp }}/ostudy-unified-diagnostics.tar.gz
            ${{ runner.temp }}/ostudy-failure-summary.md
            ${{ runner.temp }}/ostudy-static-check.log
            ${{ runner.temp }}/ostudy-fast-check.log
            ${{ runner.temp }}/ostudy-full-check.log
            ${{ runner.temp }}/ostudy-android-test.log
            ${{ runner.temp }}/ostudy-android-smoke.log
            ${{ runner.temp }}/android-smoke/**
            src-tauri/gen/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish exact-head qualification summary
        if: always()
        env:
          GATE: ${{ steps.gate.outputs.gate || 'unknown' }}
          JOB_STATUS: ${{ job.status }}
          HANDOFF_STATUS: ${{ steps.handoff.outputs.status || 'unknown' }}
        run: |
          {
            echo '# ostudy qualification'
            echo
            echo "- Head: \`$QUALIFIED_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Gate: \`$GATE\`"
            echo "- Diagnostic baseline: \`$OSTUDY_CI_LOG_FILTER\`"
            echo "- Handoff evidence status: \`$HANDOFF_STATUS\`"
            echo "- Status before evidence-integrity enforcement: **$JOB_STATUS**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce handoff evidence integrity
        if: always() && steps.handoff.outputs.status != '0'
        run: |
          echo "Evidence-derived handoff integrity failed; see the uploaded handoff artifact." >&2
          exit 1
