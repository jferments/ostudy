name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 45

    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run the repository gate
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-check.log"

      - name: Export diagnostics after a failure
        if: failure()
        run: ./scripts/export-diagnostics.sh "$RUNNER_TEMP/ostudy-diagnostics.tar.gz"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ostudy-check-diagnostics
          path: |
            ${{ runner.temp }}/ostudy-diagnostics.tar.gz
            ${{ runner.temp }}/ostudy-check.log
          if-no-files-found: ignore
