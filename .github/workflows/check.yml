name: Check

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, converted_to_draft, ready_for_review]

concurrency:
  group: pr54-document-routing-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize-document-routing:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 45
    steps:
      - name: Check out writable PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned toolchains
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"

      - name: Apply final document-routing regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gateway = Path('src-tauri/src/ai/gateway.rs')
          value = gateway.read_text()
          old = '''        if stream.content.trim().is_empty() && stream.tool_arguments.trim().is_empty() {
              let finish = stream.finish_reason.as_deref().unwrap_or("not provided");
              return Err(error(
                  "ai_empty_response",
                  &format!(
                      "The provider ended the streamed document request with finish_reason={finish}, but returned no final content or structured tool arguments."
                  ),
                  true,
                  None,
              ));
          }
          '''
          new = '''        if stream.content.trim().is_empty() && stream.tool_arguments.trim().is_empty() {
              let finish = stream.finish_reason.as_deref().unwrap_or("not provided");
              return Err(empty_stream_failure(finish));
          }
          '''
          if old not in value:
              raise SystemExit('gateway empty-stream classification anchor not found')
          value = value.replace(old, new, 1)

          helper_anchor = 'fn should_retry_document_stream_error(error_value: &AiGatewayError) -> bool {'
          helper = '''fn empty_stream_failure(finish_reason: &str) -> AiGatewayError {
              let code = if finish_reason == "length" {
                  "ai_document_output_truncated"
              } else {
                  "ai_empty_response"
              };
              error(
                  code,
                  &format!(
                      "The provider ended the streamed document request with finish_reason={finish_reason}, but returned no final content or structured tool arguments."
                  ),
                  true,
                  None,
              )
          }

          '''
          if helper_anchor not in value:
              raise SystemExit('gateway retry helper anchor not found')
          value = value.replace(helper_anchor, helper + helper_anchor, 1)

          # Four concurrent OpenRouter windows can legitimately encounter an
          # account/upstream 429. Reuse the existing bounded one-retry path and
          # honor a short Retry-After instead of failing the whole batch.
          value = value.replace(
              '            | "ai_initial_response_timeout"\n',
              '            | "ai_initial_response_timeout"\n            | "ai_rate_limited"\n            | "ai_http_rate_limited"\n',
              1,
          )

          test_anchor = '    #[test]\n    fn document_stream_retry_is_limited_to_transient_transport_failures() {'
          test = '''    #[test]
              fn empty_length_finished_stream_is_output_truncation() {
                  let failure = empty_stream_failure("length");
                  assert_eq!(failure.safe.code, "ai_document_output_truncated");
                  assert!(!should_retry_document_stream_error(&failure));

                  let ordinary_empty = empty_stream_failure("stop");
                  assert_eq!(ordinary_empty.safe.code, "ai_empty_response");
              }

          '''
          if test_anchor not in value:
              raise SystemExit('gateway test anchor not found')
          value = value.replace(test_anchor, test + test_anchor, 1)
          value = value.replace(
              '        assert!(should_retry_document_stream_error(&error(\n            "ai_network_error",\n            "network",\n            true,\n            None,\n        )));\n',
              '        assert!(should_retry_document_stream_error(&error(\n            "ai_network_error",\n            "network",\n            true,\n            None,\n        )));\n        assert!(should_retry_document_stream_error(&error(\n            "ai_rate_limited",\n            "rate limit",\n            true,\n            Some(1),\n        )));\n',
              1,
          )
          gateway.write_text(value)

          openrouter = Path('src-tauri/src/ai/providers/openrouter.rs')
          value = openrouter.read_text()
          old_quant = 'const HIGH_PRECISION_QUANTIZATIONS: [&str; 5] = ["int8", "fp8", "fp16", "bf16", "fp32"];'
          new_quant = 'const HIGH_PRECISION_QUANTIZATIONS: [&str; 6] = ["int8", "fp8", "mxfp8", "fp16", "bf16", "fp32"];'
          if old_quant in value:
              value = value.replace(old_quant, new_quant, 1)
          value = value.replace(
              'Some(&json!(["int8", "fp8", "fp16", "bf16", "fp32"]))',
              'Some(&json!(["int8", "fp8", "mxfp8", "fp16", "bf16", "fp32"]))',
              1,
          )
          openrouter.write_text(value)

          semantics = Path('src-tauri/src/document_semantics.rs')
          value = semantics.read_text()
          anchor = '    #[test]\n    fn partitioned_windows_receive_unique_global_indices_within_one_partition() {'
          regression = '''    #[test]
              fn heading_dense_fifty_five_page_source_uses_a_small_number_of_outline_windows() {
                  let mut chunks = (0..55)
                      .map(|index| chunk(index, &[index + 1], 600))
                      .collect::<Vec<_>>();
                  for (index, value) in chunks.iter_mut().enumerate() {
                      value.heading_context = Some(format!("Section {} > Topic", index + 1));
                  }
                  let plan = DocumentScalePlan::for_unit_count(55);
                  let windows = build_partitioned_semantic_windows(
                      &chunks,
                      plan,
                      plan.outline_window_max_tokens,
                      plan.outline_window_max_units,
                      plan.outline_window_overlap_tokens,
                  );
                  assert!(windows.len() <= 4, "55 heading-dense pages produced {} outline windows", windows.len());
                  assert_eq!(windows.first().unwrap().source_locator().first(), 1);
                  assert_eq!(windows.last().unwrap().source_locator().last(), 55);
              }

          '''
          if 'heading_dense_fifty_five_page_source_uses_a_small_number_of_outline_windows' not in value:
              if anchor not in value:
                  raise SystemExit('semantic regression anchor not found')
              value = value.replace(anchor, regression + anchor, 1)
          semantics.write_text(value)
          PY

      - name: Canonical formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Focused compile and tests
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked
          cargo test --manifest-path src-tauri/Cargo.toml --lib ai::gateway
          cargo test --manifest-path src-tauri/Cargo.toml --lib document_semantics
          cargo test --manifest-path src-tauri/Cargo.toml --lib document_scale
          cargo test --manifest-path src-tauri/Cargo.toml --lib ai::providers::openrouter
          cargo test --manifest-path src-tauri/Cargo.toml --lib document_generation

      - name: Commit validated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src
          git diff --cached --check
          git commit -m 'perf(ai): finalize concurrent document routing and truncation recovery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
