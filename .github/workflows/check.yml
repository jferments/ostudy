name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-analytics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out analytics branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-stage-5-learning-analytics

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Apply and publish exact rustfmt output
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git add src-tauri/src/analytics.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format learning analytics backend"
          git push origin HEAD:agent/phase-2-stage-5-learning-analytics
