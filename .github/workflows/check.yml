name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Qualification tier to run
        required: true
        default: full
        type: choice
        options:
          - static
          - fast
          - full
      apply_candidates:
        description: Commit canonical Cargo.lock and rustfmt output to the selected branch
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  normalize-rustfmt:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10

    steps:
      - name: Check out PR head branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Expose user-local tools
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply PR38 follow-up postfix and canonical rustfmt
        id: format
        run: |
          node ./scripts/apply-pr38-followup-postfix.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
          if git diff --quiet -- src-tauri/src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit PR38 follow-up postfix
        if: steps.format.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          git commit -m "fix: finalize bounded global document synthesis"
          git push origin "HEAD:${HEAD_REF}"

  check:
    if: github.event_name != 'workflow_dispatch' || inputs.apply_candidates != true
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 45

    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure persistent self-hosted build cache
        run: |
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/ostudy/cargo-target"

      - name: Resolve candidate Rust lockfile
        id: rust_lock
        run: |
          cp src-tauri/Cargo.lock "$RUNNER_TEMP/ostudy-Cargo.lock.committed"
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            > /dev/null
          if cmp -s src-tauri/Cargo.lock "$RUNNER_TEMP/ostudy-Cargo.lock.committed"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp src-tauri/Cargo.lock "$RUNNER_TEMP/ostudy-Cargo.lock.generated"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Rust dependency resolution changed Cargo.lock. The generated candidate will be uploaded."
          fi

      - name: Format candidate Rust sources
        id: rust_format
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff -- '*.rs' > "$RUNNER_TEMP/ostudy-rustfmt.patch"
          if [[ -s "$RUNNER_TEMP/ostudy-rustfmt.patch" ]]; then
            git diff --name-only -- '*.rs' > "$RUNNER_TEMP/ostudy-rustfmt-files.txt"
            tar -czf "$RUNNER_TEMP/ostudy-rustfmt-sources.tar.gz" \
              -T "$RUNNER_TEMP/ostudy-rustfmt-files.txt"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Rust formatting changed tracked sources. The formatted candidate will be uploaded."
          else
            rm -f "$RUNNER_TEMP/ostudy-rustfmt.patch"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select qualification gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_GATE: ${{ inputs.gate || 'full' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gate="$DISPATCH_GATE"
          elif [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            gate="fast"
          else
            gate="full"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Selected qualification gate: $gate"

      - name: Run static checks
        if: steps.gate.outputs.gate == 'static'
        run: |
          set -o pipefail
          bash ./scripts/check-static.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-static-check.log"

      - name: Run fast high-return checks
        if: steps.gate.outputs.gate != 'static'
        run: |
          set -o pipefail
          bash ./scripts/check-fast.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-fast-check.log"

      - name: Run full qualification gate
        if: steps.gate.outputs.gate == 'full'
        env:
          OSTUDY_FAST_CHECK_PASSED: "1"
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-full-check.log"

      - name: Require committed Rust formatting
        if: always() && steps.rust_format.outputs.changed == 'true'
        run: |
          echo "Rust sources must be formatted and committed. Same-repository PR branches are normalized automatically; other refs can use the uploaded candidate." >&2
          exit 1

      - name: Require committed Rust lockfile
        if: always() && steps.rust_lock.outputs.changed == 'true'
        run: |
          echo "src-tauri/Cargo.lock must be updated and committed for the exact dependency graph." >&2
          exit 1

      - name: Summarize qualification failure
        if: failure()
        run: |
          node ./scripts/summarize-check-failure.mjs \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Export diagnostics after a failure
        if: failure()
        run: ./scripts/export-diagnostics.sh "$RUNNER_TEMP/ostudy-diagnostics.tar.gz"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-check-diagnostics
          path: |
            ${{ runner.temp }}/ostudy-diagnostics.tar.gz
            ${{ runner.temp }}/ostudy-static-check.log
            ${{ runner.temp }}/ostudy-fast-check.log
            ${{ runner.temp }}/ostudy-full-check.log
            ${{ runner.temp }}/ostudy-Cargo.lock.generated
            ${{ runner.temp }}/ostudy-rustfmt.patch
            ${{ runner.temp }}/ostudy-rustfmt-sources.tar.gz
          if-no-files-found: ignore

  apply-generated-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_candidates == true
    permissions:
      contents: write
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 15

    steps:
      - name: Check out selected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Expose user-local tools
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve and format canonical Rust sources
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            > /dev/null
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Validate generated scope
        run: |
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          if [[ -z "$changed" ]]; then
            echo "No generated Rust changes were required."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^src-tauri/(Cargo\.lock|.*\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Generated normalization changed unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit canonical candidates
        run: |
          if git diff --quiet -- src-tauri; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock src-tauri/src src-tauri/build.rs
          git commit -m "chore: normalize Rust source and lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
