name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Apply pending transfer fixture cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/phase-2-stage-2-search-filter-redesign'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f .github/workflows/one-off-fix-transfer-test.yml ]]; then
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/transfer.rs")
          source = path.read_text(encoding="utf-8")
          old = '''        database
            .with_connection(|connection| {
                crate::cards::create_card_in_connection(
                    connection,
                    &paths,
                    &deck.id,
                    crate::cards::validate_content(
                        paragraph("What is the action of metoprolol?"),
                        paragraph("It selectively blocks beta-1 adrenergic receptors."),
                        "ignored snapshot".to_string(),
                        "ignored snapshot".to_string(),
                    )?,
                )
            })
            .expect("card should be created");
'''
          new = '''        database
            .with_connection(|connection| {
                let content = crate::cards::validate_content(
                    paragraph("What is the action of metoprolol?"),
                    paragraph("It selectively blocks beta-1 adrenergic receptors."),
                    "ignored snapshot".to_string(),
                    "ignored snapshot".to_string(),
                )?;
                let now = unix_time_millis()?;
                let note_id = generate_id(connection)?;
                let card_id = generate_id(connection)?;
                connection
                    .execute(
                        "INSERT INTO notes (
                             id, deck_id, note_type, content_format, content_schema_version,
                             front_doc, back_doc, front_text, back_text, duplicate_hash,
                             created_at, updated_at, revision
                         ) VALUES (
                             ?1, ?2, 'basic', 'tiptap-json', 1,
                             ?3, ?4, ?5, ?6, '', ?7, ?7, 1
                         )",
                        params![
                            note_id,
                            deck.id,
                            content.front_doc_json,
                            content.back_doc_json,
                            content.front_text,
                            content.back_text,
                            now,
                        ],
                    )
                    .map_err(CommandError::database)?;
                connection
                    .execute(
                        "INSERT INTO cards (
                             id, note_id, deck_id, direction, template_ordinal,
                             created_at, updated_at
                         ) VALUES (?1, ?2, ?3, 'forward', 0, ?4, ?4)",
                        params![card_id, note_id, deck.id, now],
                    )
                    .map_err(CommandError::database)?;
                insert_new_schedule(connection, &card_id, now)?;
                Ok(())
            })
            .expect("card should be created");
'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected one obsolete transfer test block, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          rm .github/workflows/one-off-fix-transfer-test.yml
          git show origin/main:.github/workflows/check.yml > .github/workflows/check.yml
          git diff --check

          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add src-tauri/src/transfer.rs .github/workflows/check.yml .github/workflows/one-off-fix-transfer-test.yml
          git commit -m "test: remove obsolete card helper from transfer fixture"
          git push origin HEAD:agent/phase-2-stage-2-search-filter-redesign

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            jq \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            python3 \
            sqlite3 \
            webkit2gtk-driver \
            xauth \
            xvfb

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.14.0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Run the repository gate
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-check.log"

      - name: Export diagnostics after a failure
        if: failure()
        run: ./scripts/export-diagnostics.sh "$RUNNER_TEMP/ostudy-diagnostics.tar.gz"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ostudy-check-diagnostics
          path: |
            ${{ runner.temp }}/ostudy-diagnostics.tar.gz
            ${{ runner.temp }}/ostudy-check.log
          if-no-files-found: ignore
