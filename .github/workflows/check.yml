name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Qualification tier to run
        required: true
        default: full
        type: choice
        options:
          - static
          - fast
          - diagnostic
          - full
      apply_candidates:
        description: Explicitly commit canonical Cargo.lock and rustfmt output to the selected branch
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.apply_candidates != true
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 150

    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      OSTUDY_DIAGNOSTIC_PR: ${{ github.event.pull_request.number || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configure persistent self-hosted build cache
        run: |
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/ostudy/cargo-target"

      - name: Require committed Rust dependency graph
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            --locked \
            > /dev/null

      - name: Select qualification gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_GATE: ${{ inputs.gate || 'full' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gate="$DISPATCH_GATE"
          elif [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]] \
            && { [[ "$PR_BODY" == *'<!-- agent-diagnostics:core -->'* ]] \
              || [[ "$PR_BODY" == *'<!-- agent-diagnostics:all -->'* ]]; }; then
            gate="diagnostic"
          elif [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            gate="fast"
          else
            gate="full"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Selected qualification gate: $gate"

      - name: Run static checks
        if: steps.gate.outputs.gate == 'static'
        run: |
          set -o pipefail
          bash ./scripts/check-static.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-static-check.log"

      - name: Run fast high-return checks
        if: steps.gate.outputs.gate == 'fast' || steps.gate.outputs.gate == 'full'
        run: |
          set -o pipefail
          bash ./scripts/check-fast.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-fast-check.log"

      - name: Run multi-failure core diagnostic sweep
        if: steps.gate.outputs.gate == 'diagnostic'
        run: |
          bash ./scripts/check-diagnostic.sh \
            --profile core \
            --output-dir "$RUNNER_TEMP/ostudy-agent-diagnostics"

      - name: Publish diagnostic summary
        if: always() && steps.gate.outputs.gate == 'diagnostic'
        run: |
          summary="$RUNNER_TEMP/ostudy-agent-diagnostics/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ostudy agent diagnostics\n\nNo summary was produced; inspect the job log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload core diagnostic evidence
        if: always() && steps.gate.outputs.gate == 'diagnostic'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-agent-diagnostics-core-${{ github.event.pull_request.number || 'dispatch' }}-${{ github.sha }}
          path: ${{ runner.temp }}/ostudy-agent-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

      - name: Run full qualification gate
        if: steps.gate.outputs.gate == 'full'
        env:
          OSTUDY_FAST_CHECK_PASSED: "1"
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-full-check.log"

      - name: Summarize authoritative qualification failure
        if: failure() && steps.gate.outputs.gate != 'diagnostic'
        run: |
          node ./scripts/summarize-check-failure.mjs \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Export authoritative diagnostics after a failure
        if: failure() && steps.gate.outputs.gate != 'diagnostic'
        run: ./scripts/export-diagnostics.sh "$RUNNER_TEMP/ostudy-diagnostics.tar.gz"

      - name: Upload authoritative failure diagnostics
        if: failure() && steps.gate.outputs.gate != 'diagnostic'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-check-diagnostics
          path: |
            ${{ runner.temp }}/ostudy-diagnostics.tar.gz
            ${{ runner.temp }}/ostudy-static-check.log
            ${{ runner.temp }}/ostudy-fast-check.log
            ${{ runner.temp }}/ostudy-full-check.log
          if-no-files-found: ignore

  apply-generated-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_candidates == true
    permissions:
      contents: write
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 15

    steps:
      - name: Check out selected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Expose user-local tools
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve and format canonical Rust sources
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            > /dev/null
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Validate generated scope
        run: |
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          if [[ -z "$changed" ]]; then
            echo "No generated Rust changes were required."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^src-tauri/(Cargo\.lock|.*\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Generated normalization changed unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit canonical candidates
        run: |
          if git diff --quiet -- src-tauri; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock src-tauri/src src-tauri/build.rs
          git commit -m "chore: normalize Rust source and lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
