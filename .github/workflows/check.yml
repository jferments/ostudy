name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-analytics-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out analytics branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-stage-5-learning-analytics

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.14.0

      - name: Generate and publish exact frozen lock
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate analytics lockfile"
          git push origin HEAD:agent/phase-2-stage-5-learning-analytics
