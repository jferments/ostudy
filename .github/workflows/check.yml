name: Check

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: one-shot-rustfmt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-and-restore:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0

      - name: Expose pinned Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply canonical rustfmt and restore canonical workflow
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git show 667cf6ef230f152543ff84b86980eb38770d186e:.github/workflows/check.yml > .github/workflows/check.yml
          git diff --check

      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/src .github/workflows/check.yml
          git diff --cached --check
          git commit -m 'style(rust): format outline routing rework'
          git push origin HEAD:agent/pre-public-platform-hardening
