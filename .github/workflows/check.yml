name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gate:
        description: Qualification tier to run
        required: true
        default: all-full
        type: choice
        options:
          - preflight
          - static
          - fast
          - linux-full
          - android-full
          - all-full
      apply_candidates:
        description: Explicitly commit canonical Cargo.lock and rustfmt output to the selected branch
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  check:
    if: github.event_name != 'workflow_dispatch' || inputs.apply_candidates != true
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 300

    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OSTUDY_CI_LOG_FILTER: warn,ostudy=info
      OSTUDY_LOG: warn,ostudy=info
      OSTUDY_DIAGNOSTICS_ACTIVE: "1"
      OSTUDY_DIAGNOSTICS_AUTOMATIC: "1"
      OSTUDY_KEEP_FAILURE_ARTIFACTS: "1"

    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Expose pinned user toolchains and persistent caches
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          echo "OSTUDY_DIAGNOSTIC_ARTIFACT_ROOT=$RUNNER_TEMP/ostudy-diagnostics" >> "$GITHUB_ENV"
          mkdir -p \
            "$HOME/.cache/ostudy/gradle" \
            "$HOME/.cache/ostudy/cargo-target"

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Select qualification gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_GATE: ${{ inputs.gate || 'all-full' }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            gate="$DISPATCH_GATE"
          elif [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            gate="fast"
          else
            gate="all-full"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "Selected qualification gate: $gate"

      - name: Publish qualification pending status
        if: steps.gate.outputs.gate != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -nc \
            --arg state pending \
            --arg context 'ostudy/qualification' \
            --arg description 'Exact-head qualification is running' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$QUALIFIED_SHA" \
            -d "$payload" >/dev/null || \
            echo 'WARN: could not publish ostudy/qualification pending status.' >&2

      - name: Publish static qualification pending status
        if: steps.gate.outputs.gate != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -nc \
            --arg state pending \
            --arg context 'ostudy/static' \
            --arg description 'Static qualification is running' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$QUALIFIED_SHA" \
            -d "$payload" >/dev/null || \
            echo 'WARN: could not publish ostudy/static pending status.' >&2

      - name: Run static qualification first
        id: static_qualification
        if: steps.gate.outputs.gate != 'preflight'
        run: |
          set -o pipefail
          bash ./scripts/check-static.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-static-check.log"

      - name: Publish static qualification result
        if: always() && steps.gate.outputs.gate != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_OUTCOME: ${{ steps.static_qualification.outcome }}
        run: |
          case "$STATIC_OUTCOME" in
            success)
              state=success
              description='Static qualification passed'
              ;;
            failure)
              state=failure
              description='Static qualification failed'
              ;;
            *)
              state=error
              description="Static qualification ended: $STATIC_OUTCOME"
              ;;
          esac
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ostudy/static' \
            --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$QUALIFIED_SHA" \
            -d "$payload" >/dev/null || \
            echo 'WARN: could not publish ostudy/static result status.' >&2

      - name: Verify unified runner resources and nested KVM
        if: steps.gate.outputs.gate != 'static'
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Require committed Rust dependency graph
        if: steps.gate.outputs.gate != 'static'
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            --locked \
            > /dev/null

      - name: Run fast qualification
        if: steps.gate.outputs.gate == 'fast'
        run: |
          set -o pipefail
          bash ./scripts/check-fast.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-fast-check.log"

      - name: Run authoritative Linux qualification
        if: steps.gate.outputs.gate == 'linux-full' || steps.gate.outputs.gate == 'all-full'
        run: |
          set -o pipefail
          bash ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-full-check.log"

      - name: Run authoritative Android compile and package qualification
        if: steps.gate.outputs.gate == 'android-full' || steps.gate.outputs.gate == 'all-full'
        run: |
          set -o pipefail
          bash ./scripts/android-test.sh 2>&1 | tee "$RUNNER_TEMP/ostudy-android-test.log"

      - name: Run authoritative Android Emulator smoke qualification
        if: steps.gate.outputs.gate == 'android-full' || steps.gate.outputs.gate == 'all-full'
        run: |
          set -o pipefail
          bash ./scripts/android-emulator-smoke.sh \
            --artifacts "$RUNNER_TEMP/android-smoke" \
            2>&1 | tee "$RUNNER_TEMP/ostudy-android-smoke.log"

      - name: Summarize qualification failure
        if: failure()
        run: |
          node ./scripts/summarize-check-failure.mjs \
            --diagnostics "$RUNNER_TEMP/ostudy-diagnostics" \
            --diagnostics "$RUNNER_TEMP/android-smoke" \
            "$RUNNER_TEMP/ostudy-static-check.log" \
            "$RUNNER_TEMP/ostudy-fast-check.log" \
            "$RUNNER_TEMP/ostudy-full-check.log" \
            "$RUNNER_TEMP/ostudy-android-test.log" \
            "$RUNNER_TEMP/ostudy-android-smoke.log" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Export diagnostics after failure
        if: failure()
        run: bash ./scripts/export-diagnostics.sh "$RUNNER_TEMP/ostudy-unified-diagnostics.tar.gz"

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-diagnostics-${{ env.QUALIFIED_SHA }}
          path: ${{ runner.temp }}/ostudy-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bounded failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-unified-${{ env.QUALIFIED_SHA }}
          path: |
            ${{ runner.temp }}/ostudy-unified-diagnostics.tar.gz
            ${{ runner.temp }}/ostudy-static-check.log
            ${{ runner.temp }}/ostudy-fast-check.log
            ${{ runner.temp }}/ostudy-full-check.log
            ${{ runner.temp }}/ostudy-android-test.log
            ${{ runner.temp }}/ostudy-android-smoke.log
            ${{ runner.temp }}/android-smoke/**
            src-tauri/gen/android/app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish exact-head qualification summary
        if: always()
        env:
          GATE: ${{ steps.gate.outputs.gate }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '# ostudy qualification'
            echo
            echo "- Head: \`$QUALIFIED_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Gate: \`$GATE\`"
            echo "- Diagnostic baseline: \`$OSTUDY_CI_LOG_FILTER\`"
            echo "- Status: **$JOB_STATUS**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish exact-head qualification commit status
        if: always() && steps.gate.outputs.gate != 'preflight'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success)
              state=success
              description='Exact-head qualification passed'
              ;;
            failure)
              state=failure
              description='Exact-head qualification failed'
              ;;
            *)
              state=error
              description="Exact-head qualification ended: $JOB_STATUS"
              ;;
          esac
          payload="$(jq -nc \
            --arg state "$state" \
            --arg context 'ostudy/qualification' \
            --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$QUALIFIED_SHA" \
            -d "$payload" >/dev/null || \
            echo 'WARN: could not publish ostudy/qualification result status.' >&2

  apply-generated-candidates:
    if: github.event_name == 'workflow_dispatch' && inputs.apply_candidates == true
    permissions:
      contents: write
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 15

    steps:
      - name: Check out selected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Resolve and format canonical Rust sources
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            > /dev/null
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Validate generated scope
        run: |
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          if [[ -z "$changed" ]]; then
            echo "No generated Rust changes were required."
            exit 0
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^src-tauri/(Cargo\.lock|.*\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Generated normalization changed unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit canonical candidates
        run: |
          if git diff --quiet -- src-tauri; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock src-tauri/src src-tauri/build.rs
          git commit -m "chore: normalize Rust source and lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
