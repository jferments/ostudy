name: Apply final Phase 2 fixes

on:
  push:
    branches: [agent/phase-2-standalone-flashcard-core]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply exact final fixes and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/final.patch.gz.b64" <<'PAYLOAD'

PAYLOAD
          base64 --decode "$RUNNER_TEMP/final.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/final.patch"
          echo "22cc7a6fe113605430b092f805c4246ff04759bbac3d765900fccd60c14c1e66  $RUNNER_TEMP/final.patch" | sha256sum --check
          git apply --index --whitespace=error-all "$RUNNER_TEMP/final.patch"
          rm -f .github/workflows/phase2-source-snapshot.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete Phase 2 validation and safeguards"
          git push origin HEAD:agent/phase-2-standalone-flashcard-core
