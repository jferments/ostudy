name: Fix PR41 AI profile regression test

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/workflows/fix-pr41-profile-test.yml
      - .github/fix-pr41-profile-test.py

permissions:
  contents: write

concurrency:
  group: fix-pr41-profile-test
  cancel-in-progress: true

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose user-local tools
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Update stale creation-flow test
        run: python3 .github/fix-pr41-profile-test.py

      - name: Run AI settings tests
        run: |
          pnpm vitest run src/screens/SettingsScreen.test.tsx src/screens/SettingsScreen.extended.test.tsx
          pnpm exec tsc --noEmit

      - name: Publish clean test update
        run: |
          git rm -f .github/workflows/fix-pr41-profile-test.yml .github/fix-pr41-profile-test.py
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: update AI profile creation regression"
          git push origin HEAD:agent/ui-platform-overhaul
