name: Fix PR41 AI profile regression test

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/workflows/fix-pr41-profile-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose user-local tools
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Update stale creation-flow test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/screens/SettingsScreen.extended.test.tsx")
          text = path.read_text(encoding="utf-8")
          old = '    fireEvent.click(screen.getByRole("button", { name: "Add llama.cpp" }));\n'
          new = '''    fireEvent.click(screen.getByRole("button", { name: "New profile" }));
    expect(
      (screen.getByRole("combobox", { name: "Provider type" }) as HTMLSelectElement).value,
    ).toBe("llama_cpp");
'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one legacy Add llama.cpp test action, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run AI settings tests
        run: |
          pnpm vitest run src/screens/SettingsScreen.test.tsx src/screens/SettingsScreen.extended.test.tsx
          pnpm exec tsc --noEmit

      - name: Publish clean test update
        run: |
          git rm .github/workflows/fix-pr41-profile-test.yml
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: update AI profile creation regression"
          git push origin HEAD:agent/ui-platform-overhaul
