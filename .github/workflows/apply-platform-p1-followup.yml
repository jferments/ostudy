name: Apply platform P1 follow-up

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p1-followup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply P1 follow-up
        run: node ./scripts/apply-platform-p1-followup.mjs

      - name: Install frontend and native dependencies
        run: |
          pnpm install --frozen-lockfile
          ./scripts/install-native-deps.sh --pdfium-only

      - name: Format and compile generated sources
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          pnpm exec tsc -b --pretty false
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features
          node ./scripts/verify-repository-policy.mjs
          node ./scripts/verify-platform-boundaries.mjs
          git diff --check

      - name: Commit qualified P1 implementation
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: qualify portable runtime services"
          git push origin HEAD:agent/platform-portability-p0-p2
