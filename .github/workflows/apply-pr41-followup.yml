name: Apply PR41 follow-up

on:
  push:
    branches:
      - agent/ui-platform-overhaul

permissions:
  contents: write

concurrency:
  group: apply-pr41-followup
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply document tag cleanup
        run: node ./scripts/apply-pr41-followup.mjs

      - name: Verify migration checksum and Rust formatting
        run: |
          node ./scripts/check-migration-checksums.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Remove temporary applicator and publish product tree
        run: |
          git rm scripts/apply-pr41-followup.mjs .github/workflows/apply-pr41-followup.yml
          git add -A
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: keep document tags subject-matter only"
          git push origin HEAD:agent/ui-platform-overhaul
