name: PR54 provider-neutral document refactor

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: pr54-provider-neutral-document-refactor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply provider-neutral document refactor
        run: |
          python3 ./scripts/pr54_stream_transport_refactor.py
          python3 ./scripts/pr54_document_pipeline_refactor.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo 'Provider-neutral document refactor is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/src/task_cancellation.rs \
            src-tauri/src/ai/gateway.rs \
            src-tauri/src/ai/concurrency.rs \
            src-tauri/src/ai/document_intelligence_adapter.rs \
            src-tauri/src/ai/document_intelligence.rs \
            src-tauri/src/document_generation.rs \
            src/ipc/documents.ts \
            src/screens/DocumentsScreen.tsx \
            src/screens/DocumentsProgress.test.tsx \
            src/screens/settings/AiLlmSettings.tsx \
            docs/user-guide/ai-providers.md \
            docs/architecture/document-ai-routing.md \
            docs/architecture/ai-and-document-processing.md
          git diff --cached --check
          git commit -m 'refactor(ai): use provider-neutral stream liveness and cloud batching'
          git push origin HEAD:agent/pre-public-platform-hardening
