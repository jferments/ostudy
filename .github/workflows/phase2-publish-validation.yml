name: Publish Phase 2 validation result

on:
  push:
    branches: [agent/phase-2-standalone-flashcard-core]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require successful Phase 2 v2 validation run
        shell: bash
        run: |
          set -Eeuo pipefail
          conclusion="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=$GITHUB_REF_NAME&event=push" \
            --jq '[.workflow_runs[] | select(.name == "Phase 2 final validation v2")] | sort_by(.created_at) | last | .conclusion')"
          test "$conclusion" = "success"

      - name: Remove publishing scaffolding and push final head
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/phase2-publish-validation.yml
          rm -f .phase2-publish-validation-trigger
          rm -f .github/workflows/phase2-finalize.yml
          rm -f .github/workflows/phase2-finalize-v2.yml
          rm -f .phase2-finalize-trigger .phase2-finalize-v2-trigger
          rm -rf .github/phase2-payload
          rm -f .github/workflows/phase2-snapshot.yml
          rm -f docs/.phase2-validation-trigger
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish final Phase 2 validation"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish green statuses on final head
        run: |
          for context in "Check / check" "Phase 2 final validation"; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
              -f state=success -f context="$context" \
              -f description="Full Ubuntu repository gate passed"
          done

      - name: Publish completed PR body and ready state
        shell: bash
        run: |
          set -Eeuo pipefail
          current_body="$(gh pr view 4 --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          completed_body="$(printf '%s' "$current_body" | sed \
            -e 's/- \[ \] Ubuntu 24\.04 full repository gate/- [x] Ubuntu 24.04 full repository gate/' \
            -e 's/- \[ \] frontend formatting/- [x] frontend formatting/' \
            -e 's/- \[ \] rustfmt and Clippy/- [x] rustfmt and Clippy/' \
            -e 's/- \[ \] Rust unit/- [x] Rust unit/' \
            -e 's/- \[ \] locked standalone/- [x] locked standalone/' \
            -e 's/- \[ \] temporary patch-transfer/- [x] temporary patch-transfer/')"
          completed_body="$(printf '%s' "$completed_body" | sed '/The final validation workflow checks and updates the remaining boxes before marking this PR ready for review\./d')"
          printf '%s\n' "$completed_body" > "$RUNNER_TEMP/pr-body.md"
          gh pr edit 4 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md"
          gh pr ready 4 --repo "$GITHUB_REPOSITORY" || true
          gh pr comment 4 --repo "$GITHUB_REPOSITORY" --body "The full Phase 2 Ubuntu repository gate passed. The final branch head has green validation statuses, temporary automation files are removed, and this PR is ready for local acceptance testing."
