name: PR54 one-shot Rust formatting

on:
  push:
    branches:
      - agent/pre-public-platform-hardening

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[rustfmt-normalized]') }}
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Expose Rust toolchain
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply canonical Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit formatter output
        run: |
          if git diff --quiet -- src-tauri; then
            echo "No Rust formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src src-tauri/build.rs
          git commit -m "style: apply canonical Rust formatting [rustfmt-normalized]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
