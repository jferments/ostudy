name: PR 51 credential UI wiring

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): wire credential UI') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Apply credential UI wiring
        run: python3 ./scripts/pr51-wire-credential-ui.py

      - name: Verify frontend types and targeted synchronization test
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm exec vitest run src/screens/settings/DeviceSyncSettings.test.tsx

      - name: Commit qualified wiring and remove one-shot machinery
        run: |
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git commit -m "chore(pr51): wire credential UI"
          git push origin HEAD:agent/android-completion-a4-a7
