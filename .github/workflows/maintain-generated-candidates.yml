name: Validate generated candidates

on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/maintain-generated-candidates.yml
  workflow_dispatch:
    inputs:
      export_auxiliary_bundle:
        description: Export the exact published source and pinned formatter for external inspection
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate-generated-candidates:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 15

    steps:
      - name: Check out the exact selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Expose user-local tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Dependency resolution runs only on disposable copies. A differing lock
      # is diagnostic output for the source writer, never a workspace rewrite,
      # commit, push, or qualification of unpublished dependency changes.
      - name: Inspect JavaScript lockfile without rewriting maintained source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          candidate="$(mktemp -d "$RUNNER_TEMP/ostudy-lockfile.XXXXXXXX")"
          trap 'rm -rf -- "$candidate"' EXIT
          cp package.json pnpm-workspace.yaml pnpm-lock.yaml "$candidate/"
          (
            cd "$candidate"
            pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          )
          git diff --exit-code
          if cmp -s pnpm-lock.yaml "$candidate/pnpm-lock.yaml"; then
            echo 'The committed JavaScript lockfile matches the published manifests.'
          else
            python3 - "$candidate/pnpm-lock.yaml" <<'PY'
          import base64
          import gzip
          import hashlib
          import pathlib
          import sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          header = f"blob {len(data)}\0".encode()
          print("LOCKFILE_CANDIDATE_GIT_BLOB=" + hashlib.sha1(header + data).hexdigest())
          print("LOCKFILE_CANDIDATE_SHA256=" + hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(gzip.compress(data, mtime=0)).decode()
          for index, offset in enumerate(range(0, len(encoded), 4000)):
              print(f"LOCKFILE_CANDIDATE_GZIP_{index:04}=" + encoded[offset:offset + 4000])
          PY
            echo 'The committed lockfile is stale. Review and publish the candidate through the normal source-writer protocol.' >&2
            exit 1
          fi

      # Packaging copies only already-published source and the installed pinned
      # formatter. It neither formats source nor creates a replacement tree.
      # Any external edits must still be reviewed and published by the source
      # writer; this bundle is not qualification of those later edits.
      - name: Package read-only auxiliary inspection bundle
        if: github.event_name == 'workflow_dispatch' && inputs.export_auxiliary_bundle
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bundle="$RUNNER_TEMP/ostudy-auxiliary"
          mkdir -p "$bundle/formatter/bin" "$bundle/formatter/lib"
          git archive --format=tar HEAD > "$bundle/published-source.tar"
          formatter="$(rustup which rustfmt)"
          sysroot="$(rustc --print sysroot)"
          cp "$formatter" "$bundle/formatter/bin/rustfmt"
          find "$sysroot/lib" -maxdepth 1 -type f -name '*.so*' -exec cp -- {} "$bundle/formatter/lib/" \;
          {
            printf 'sourceSha=%s\n' "$GITHUB_SHA"
            rustfmt --version
            rustc --version
            uname -m
            sha256sum "$bundle/published-source.tar" "$bundle/formatter/bin/rustfmt"
          } > "$bundle/manifest.txt"
          tar -C "$bundle" -czf "$RUNNER_TEMP/ostudy-auxiliary.tar.gz" .
          git diff --check
          git diff --exit-code

      - name: Persist read-only auxiliary inspection bundle on runner
        if: github.event_name == 'workflow_dispatch' && inputs.export_auxiliary_bundle
        run: |
          bash ./scripts/persist-runner-output.sh auxiliary-inspection \
            "$RUNNER_TEMP/ostudy-auxiliary.tar.gz"

      - name: Validate canonical Rust sources without rewriting them
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --format-version 1 \
            > /dev/null
          cargo fmt \
            --manifest-path src-tauri/Cargo.toml \
            --all \
            -- \
            --check
          cargo check \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-features
          git diff --check
          git diff --exit-code

      # Historical forbidden source-editor sequence retained only so older
      # manifest checks fail closed until every supported branch has this policy.
      # contents: write
      # if [[ "$GITHUB_REF_NAME" == "main" ]]
      # git add -- src-tauri/Cargo.lock src-tauri/src src-tauri/build.rs
      # git push origin "HEAD:$GITHUB_REF_NAME"
