name: Validate generated Rust candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-generated-candidates:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 15

    steps:
      - name: Check out the exact selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Expose user-local tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate canonical Rust sources without rewriting them
        run: |
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --format-version 1 \
            > /dev/null
          cargo fmt \
            --manifest-path src-tauri/Cargo.toml \
            --all \
            -- \
            --check
          cargo check \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-features
          git diff --check
          git diff --exit-code

      # Historical forbidden source-editor sequence retained only so older
      # manifest checks fail closed until every supported branch has this policy.
      # contents: write
      # if [[ "$GITHUB_REF_NAME" == "main" ]]
      # git add -- src-tauri/Cargo.lock src-tauri/src src-tauri/build.rs
      # git push origin "HEAD:$GITHUB_REF_NAME"
