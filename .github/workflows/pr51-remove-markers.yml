name: PR 51 remove remaining generated markers

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

concurrency:
  group: pr51-remove-markers
  cancel-in-progress: true

jobs:
  clean:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): remove remaining generated markers') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Remove generated diagnostics and this workflow
        run: |
          rm -f .github/pr51-* scripts/pr51-* .github/workflows/pr51-remove-markers.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(pr51): remove remaining generated markers"
          git push origin HEAD:agent/android-completion-a4-a7
