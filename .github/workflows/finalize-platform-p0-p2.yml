name: Finalize platform portability P0-P2

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: finalize-platform-p0-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve final Rust lint findings and retire workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/editor_drafts.rs")
          text = path.read_text()
          old = "use std::{collections::BTreeSet, path::PathBuf};"
          new = "use std::collections::BTreeSet;"
          if old not in text:
              raise SystemExit("editor_drafts.rs warning anchor was not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("src-tauri/src/authoring/card_types_and_templates/templates.rs")
          text = path.read_text()
          old = """fn load_assets_by_ids(
              connection: &Connection,
              paths: &AppPaths,
              asset_ids: &[String],
          )"""
          new = """fn load_assets_by_ids(
              connection: &Connection,
              _paths: &AppPaths,
              asset_ids: &[String],
          )"""
          if old not in text:
              raise SystemExit("templates.rs warning anchor was not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("src-tauri/src/asset_lifecycle.rs")
          text = path.read_text()
          old = """    let row: Option<(String, i64, Option<i64>, Option<i64>, String)> = connection"""
          new = """    type ActiveDraftRow = (String, i64, Option<i64>, Option<i64>, String);
              let row: Option<ActiveDraftRow> = connection"""
          if old not in text:
              raise SystemExit("asset_lifecycle.rs type-complexity anchor was not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("src-tauri/src/platform/mod.rs")
          text = path.read_text()
          desktop_old = "return desktop::runtime();"
          mobile_old = "return mobile_stub::runtime();"
          if desktop_old not in text or mobile_old not in text:
              raise SystemExit("platform runtime return anchors were not found")
          text = text.replace(desktop_old, "desktop::runtime()", 1)
          text = text.replace(mobile_old, "mobile_stub::runtime()", 1)
          path.write_text(text)
          PY
          rm -f .github/workflows/finalize-platform-p0-p2.yml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision audited PDFium runtime
        run: ./scripts/install-native-deps.sh --pdfium-only

      - name: Run complete repository gate
        env:
          OSTUDY_PDFIUM_PATH: ${{ github.workspace }}/src-tauri/resources/native/pdfium/libpdfium.so
        run: ./scripts/check.sh

      - name: Commit fully qualified tree
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete P0-P2 full qualification"
          git push origin HEAD:agent/platform-portability-p0-p2
