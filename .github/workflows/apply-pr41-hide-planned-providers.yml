name: Apply PR41 planned-provider settings cleanup

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/pr41-hide-planned-providers.py
      - .github/workflows/apply-pr41-hide-planned-providers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0
      - name: Expose local tools
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply UI cleanup
        run: python3 .github/pr41-hide-planned-providers.py
      - name: Verify settings
        run: |
          pnpm vitest run src/screens/SettingsScreen.test.tsx src/screens/SettingsScreen.extended.test.tsx
          pnpm exec tsc --noEmit
      - name: Run fast qualification
        run: ./scripts/check-fast.sh
      - name: Publish clean product tree
        run: |
          git rm -f .github/pr41-hide-planned-providers.py .github/workflows/apply-pr41-hide-planned-providers.yml
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep planned providers out of settings"
          git push origin HEAD:agent/ui-platform-overhaul
