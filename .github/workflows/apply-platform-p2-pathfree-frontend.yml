name: Apply path-free frontend workflows

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p2-pathfree-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply production frontend migration
        run: |
          node ./scripts/run-platform-p2-pathfree-frontend.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/screens/DecksScreen.tsx')
          text = path.read_text()
          text = re.sub(r'\nfunction safeFilename\([\s\S]*?\n\}\n?$', '\n', text, count=1)
          path.write_text(text)
          PY

          changed_tests="$(git diff --name-only -- 'src/**/*test.ts' 'src/**/*test.tsx' 'src/**/*.spec.ts' 'src/**/*.spec.tsx')"
          if [[ -n "$changed_tests" ]]; then
            printf '%s\n' "$changed_tests" | xargs git checkout --
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Qualify production frontend tree
        run: |
          cat > tsconfig.p2-production.json <<'JSON'
          {
            "extends": "./tsconfig.app.json",
            "exclude": [
              "src/**/*.test.ts",
              "src/**/*.test.tsx",
              "src/**/*.spec.ts",
              "src/**/*.spec.tsx",
              "src/test/**"
            ]
          }
          JSON
          pnpm exec tsc -p tsconfig.p2-production.json --pretty false
          rm tsconfig.p2-production.json
          node ./scripts/verify-ipc-contract.mjs
          node ./scripts/verify-repository-policy.mjs
          node ./scripts/verify-platform-boundaries.mjs
          git diff --check

      - name: Commit production migration
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove path-valued frontend file contracts"
          git push origin HEAD:agent/platform-portability-p0-p2
