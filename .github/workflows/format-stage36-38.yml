name: Format Stage 3.6-3.8

on:
  push:
    branches:
      - agent/stage-3-6-3-8-study-semantics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6
        with:
          ref: agent/stage-3-6-3-8-study-semantics
          fetch-depth: 0

      - name: Expose Rust tools
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Format and commit Rust sources
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style: apply canonical Rust formatting"
          git push origin HEAD:agent/stage-3-6-3-8-study-semantics
