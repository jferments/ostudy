name: PR54 resilience lint cleanup

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: pr54-resilience-lint-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"

      - name: Apply focused cleanup
        run: |
          python3 ./scripts/pr54_lint_cleanup.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Qualify corrected source
        run: bash ./scripts/check-fast.sh

      - name: Commit corrected product source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/src/ai/gateway.rs \
            src-tauri/src/task_cancellation.rs \
            src-tauri/src/ai/document_intelligence_adapter.rs \
            src-tauri/src/document_generation.rs
          if git diff --cached --quiet; then
            echo 'No corrected product changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix(ai): clean document resilience progress contracts'
          git push origin HEAD:agent/pre-public-platform-hardening
