name: Apply Stage 3.6-3.8 native follow-ups

on:
  push:
    branches:
      - agent/stage-3-6-3-8-scheduling-analytics-clean
    paths:
      - scripts/apply-stage36-38-schedule-date-intent.py
      - .github/workflows/fix-stage36-38-native-compile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage-3-6-3-8-scheduling-analytics-clean
      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply canonical date intent
        run: python3 scripts/apply-stage36-38-schedule-date-intent.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit native scheduling follow-up
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make rescheduling backend-owned date intent"
          git push origin HEAD:agent/stage-3-6-3-8-scheduling-analytics-clean
      - name: Compile and test scheduling
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml schedule_controls -- --nocapture
