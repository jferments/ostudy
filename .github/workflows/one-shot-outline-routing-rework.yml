name: One-shot outline routing rework

on:
  push:
    branches: [agent/pre-public-platform-hardening]

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 45
    steps:
      - name: Check out branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0

      - name: Expose pinned toolchains
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"

      - name: Normalize one-shot patcher boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-outline-routing-rework.py')
          value = path.read_text()

          # Avoid replacement collisions after mutating the standard plan.
          value = value.replace(
              '("generation_window_max_tokens: 5_000,", "generation_window_max_tokens: 7_000,"),',
              '("generation_window_max_tokens: 5_000,", "generation_window_max_tokens: 6_500,"),',
          )
          value = value.replace(
              '("generation_window_max_units: 10,", "generation_window_max_units: 12,"),',
              '("generation_window_max_units: 10,", "generation_window_max_units: 14,"),',
          )

          test_start = value.index('replace_once(scale, "assert_eq!(plan.generation_window_max_tokens, 5_000);"')
          test_end = value.index('\n# Hierarchy metadata remains', test_start)
          test_block = '''value = read(scale)\nfor old, new in [\n    ("assert_eq!(plan.generation_window_max_tokens, 5_000);", "assert_eq!(plan.generation_window_max_tokens, 6_500);"),\n    ("assert!(plan.outline_window_max_tokens < 10_000);", "assert!(plan.outline_window_max_tokens < 14_000);"),\n    ("assert!(plan.generation_window_max_tokens < 7_000);", "assert!(plan.generation_window_max_tokens < 10_000);"),\n    ("assert_eq!(plan.outline_window_max_tokens, 10_000);", "assert_eq!(plan.outline_window_max_tokens, 14_000);"),\n    ("assert_eq!(plan.outline_window_max_units, 18);", "assert_eq!(plan.outline_window_max_units, 24);"),\n    ("assert_eq!(plan.generation_window_max_tokens, 7_000);", "assert_eq!(plan.generation_window_max_tokens, 10_000);"),\n    ("assert_eq!(plan.generation_window_max_units, 12);", "assert_eq!(plan.generation_window_max_units, 18);"),\n]:\n    value = value.replace(old, new)\nwrite(scale, value)\n'''
          value = value[:test_start] + test_block + value[test_end:]

          bad_start = value.index('replace_region(\n    semantics,\n    "    #[test]\\n    fn partitioned_windows_do_not_overlap_across_chapters() {"')
          bad_end = value.index('\n# OpenRouter routing:', bad_start)
          corrected = r"""value = read(semantics)
stale_test = "    #[test]\n    fn partitioned_windows_do_not_overlap_across_chapters() {"
stale_start = value.find(stale_test)
module_end = value.rfind("\n}")
if stale_start < 0 or module_end < stale_start:
    raise SystemExit("document_semantics.rs: stale chapter-boundary test not found")
new_test = r'''    #[test]
    fn packed_windows_can_cross_heading_boundaries_without_losing_provenance() {
        let mut chunks = Vec::new();
        for index in 0..8 {
            let mut value = chunk(index, &[index + 1], 700);
            value.heading_context = Some(if index < 4 {
                "Chapter A".to_string()
            } else {
                "Chapter B".to_string()
            });
            if index == 5 {
                value.element_types = vec!["image".to_string()];
            }
            chunks.push(value);
        }
        let plan = DocumentScalePlan::for_unit_count(138);
        let windows = build_partitioned_semantic_windows(&chunks, plan, 2_100, 3, 0);
        assert!(windows.iter().any(|window| {
            window.source_locator().first() <= 4 && window.source_locator().last() >= 5
        }));
        assert!(windows.iter().any(|window| window.source_text.contains("Chapter B")));
        assert!(windows
            .iter()
            .any(|window| window.visual_page_numbers.contains(&6)));
    }
'''
write(semantics, value[:stale_start] + new_test + value[module_end:])
"""
          value = value[:bad_start] + corrected + value[bad_end:]
          path.write_text(value)
          PY

      - name: Apply product rework
        run: python3 scripts/apply-outline-routing-rework.py

      - name: Remove one-shot scaffolding
        run: |
          rm -f scripts/apply-outline-routing-rework.py
          rm -f .github/workflows/one-shot-outline-routing-rework.yml

      - name: Format and update the locked Rust graph
        run: |
          cd src-tauri
          cargo fmt --all
          cargo check
          cargo test --lib document_semantics
          cargo test --lib ai::providers::openrouter
          cargo test --lib document_scale
          cargo test --lib document_generation
          cd ..

      - name: Run static qualification
        run: bash ./scripts/check-static.sh

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'perf(ai): parallelize and optimize document provider routing'
          git push origin HEAD:agent/pre-public-platform-hardening
