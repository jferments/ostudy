name: Qualify external file dialog freeze fix

on:
  push:
    branches:
      - agent/fix-external-file-dialog-freezes

permissions:
  contents: write

concurrency:
  group: qualify-external-file-dialog-freezes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/fix-external-file-dialog-freezes
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply non-blocking file dialog fix
        run: node ./scripts/apply-external-file-dialog-fix.mjs

      - name: Install and provision
        run: |
          pnpm install --frozen-lockfile
          ./scripts/install-native-deps.sh --pdfium-only
          echo "OSTUDY_PDFIUM_PATH=$GITHUB_WORKSPACE/src-tauri/resources/native/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run complete repository gate
        run: ./scripts/check.sh

      - name: Remove temporary tooling and commit
        run: |
          rm scripts/apply-external-file-dialog-fix.mjs
          rm .github/workflows/apply-external-file-dialog-fix.yml
          git diff --check
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: make native file dialogs non-blocking"
          git push origin HEAD:agent/fix-external-file-dialog-freezes
