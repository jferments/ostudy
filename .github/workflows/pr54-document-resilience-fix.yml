name: PR54 document resilience fix

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: pr54-document-resilience-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply real-provider acceptance fixes
        run: python3 ./scripts/pr54_document_resilience_fix.py

      - name: Canonical Rust formatting and patch validation
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit product changes when needed
        run: |
          if git diff --quiet; then
            echo 'No product changes remain to apply.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/src/task_cancellation.rs \
            src-tauri/src/ai/providers/openrouter.rs \
            src-tauri/src/ai/gateway.rs \
            src-tauri/src/ai/document_intelligence_adapter.rs \
            src-tauri/src/ai/document_intelligence.rs \
            src-tauri/src/document_generation.rs \
            src-tauri/src/document_scale.rs \
            src/ipc/documents.ts \
            src/screens/DocumentsScreen.tsx \
            src/screens/DocumentsProgress.test.tsx \
            docs/architecture/document-ai-routing.md
          git diff --cached --check
          git commit -m 'fix(ai): make document generation resilient to slow provider routes'
          git push origin HEAD:agent/pre-public-platform-hardening
