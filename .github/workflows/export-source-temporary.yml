name: Apply Phase 1 repository patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-phase-1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chore/phase-1-repository-stabilization'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v6
        with:
          ref: chore/phase-1-repository-stabilization
          fetch-depth: 0

      - name: Download and verify the staged patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : > "$RUNNER_TEMP/phase1.patch.gz.b64"
          for part in 00 01 02 03 04 05; do
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github.raw+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --get \
              --data-urlencode "ref=automation/phase-1-patch-payload" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.phase1-payload/part-${part}.b64" \
              >> "$RUNNER_TEMP/phase1.patch.gz.b64"
          done
          echo "fe3171cb81443cc29d2791ed8af13ea607adfec7893d98bfcbef05771e014e77  $RUNNER_TEMP/phase1.patch.gz.b64" | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/phase1.patch.gz.b64" > "$RUNNER_TEMP/phase1.patch.gz"
          echo "14df26b28eb53b04a35459d67c14384bf51675235a01c0b28c278769fcf448d8  $RUNNER_TEMP/phase1.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout "$RUNNER_TEMP/phase1.patch.gz" > "$RUNNER_TEMP/phase1.patch"
          echo "f3517470e548c4532e283edba46f82bc1ec86f69386b5ca031892fa7053d4b1d  $RUNNER_TEMP/phase1.patch" | sha256sum --check --strict

      - name: Apply and commit the Phase 1 patch
        run: |
          set -Eeuo pipefail
          git apply --check --binary "$RUNNER_TEMP/phase1.patch"
          git apply --index --binary "$RUNNER_TEMP/phase1.patch"
          rm -- .github/workflows/export-source-temporary.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: stabilize repository and CI"
          git push origin HEAD:chore/phase-1-repository-stabilization
