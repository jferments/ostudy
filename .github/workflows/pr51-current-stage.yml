name: PR 51 current failure stage

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  classify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): current failure stage') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Encode current stage and compiler family
        run: |
          rm -f .github/pr51-current-stage-* .github/pr51-current-error-*
          if [[ ! -f .github/pr51-integration-status.txt ]]; then
            touch .github/pr51-current-stage-no-status
          else
            stage="unknown"
            for candidate in source format install rust fast android; do
              if grep -q "^${candidate}=failure$" .github/pr51-integration-status.txt; then
                stage="$candidate"
                break
              fi
            done
            touch ".github/pr51-current-stage-${stage}"
            grep -Eiq 'error\[E[0-9]+\]' .github/pr51-integration-status.txt && touch .github/pr51-current-error-rust-code
            grep -Eiq 'unresolved import|failed to resolve|cannot find (type|function|value|module|crate)' .github/pr51-integration-status.txt && touch .github/pr51-current-error-rust-unresolved
            grep -Eiq 'mismatched types|expected .*found' .github/pr51-integration-status.txt && touch .github/pr51-current-error-rust-type
            grep -Eiq 'borrow of moved value|cannot borrow|does not live long enough' .github/pr51-integration-status.txt && touch .github/pr51-current-error-rust-borrow
            grep -Eiq 'unused import|dead code|never used' .github/pr51-integration-status.txt && touch .github/pr51-current-error-rust-warning
            grep -Eiq 'error TS[0-9]+' .github/pr51-integration-status.txt && touch .github/pr51-current-error-typescript
            grep -Eiq '^e: |Kotlin compilation|Unresolved reference' .github/pr51-integration-status.txt && touch .github/pr51-current-error-kotlin
            grep -Eiq 'Could not resolve|Could not find .*tesseract|Could not GET' .github/pr51-integration-status.txt && touch .github/pr51-current-error-gradle-resolution
            grep -Eiq 'Repository policy|IPC contract|Platform boundaries|Documentation:' .github/pr51-integration-status.txt && touch .github/pr51-current-error-policy
            grep -Eiq 'There were failing tests|FAILURES!!!|INSTRUMENTATION_FAILED' .github/pr51-integration-status.txt && touch .github/pr51-current-error-test
          fi

      - name: Commit markers and remove workflow
        run: |
          rm -f .github/workflows/pr51-current-stage.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add .github/pr51-current-* .github/workflows/pr51-current-stage.yml
          git commit -m "chore(pr51): current failure stage"
          git push origin HEAD:agent/android-completion-a4-a7
