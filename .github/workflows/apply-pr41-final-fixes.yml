name: Apply PR41 final fixes

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/workflows/apply-pr41-final-fixes.yml
      - .github/pr41-final-fixes.py

permissions:
  contents: write

concurrency:
  group: apply-pr41-final-fixes
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision audited PDFium runtime
        run: ./scripts/install-native-deps.sh --pdfium-only

      - name: Apply final product changes
        run: python3 .github/pr41-final-fixes.py

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run focused native regressions
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib pdf_backend::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib document_pdf_tests::structured_extraction_and_pdfium_rendering_process_a_real_fixture
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib practice_selection::operation_tests

      - name: Run focused frontend regressions
        run: |
          pnpm vitest run \
            src/screens/practice/ActivePractice.test.tsx \
            src/screens/PracticeScreen.test.tsx \
            src/screens/SettingsScreen.test.tsx

      - name: Typecheck production frontend
        run: pnpm exec tsc --noEmit

      - name: Publish product-only tree
        run: |
          git rm -f .github/workflows/apply-pr41-final-fixes.yml .github/pr41-final-fixes.py
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finish PDF, practice, and AI profile regressions"
          git push origin HEAD:agent/ui-platform-overhaul
