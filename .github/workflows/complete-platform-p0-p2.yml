name: Complete platform portability P0-P2

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: complete-platform-p0-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply pending path-free frontend changes
        run: |
          if grep -q '"export_library_backup"' src/ipc/backup.ts \
             && [[ -f scripts/run-platform-p2-pathfree-frontend.mjs ]]; then
            node scripts/run-platform-p2-pathfree-frontend.mjs
          fi
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/screens/DecksScreen.tsx")
          text = path.read_text()
          start = text.find("\nfunction safeFilename(")
          if start >= 0:
              end = text.find("\nfunction summarize(", start)
              if end < 0:
                  raise SystemExit("DecksScreen safeFilename boundary is incomplete")
              text = text[:start] + text[end:]
              path.write_text(text)
          PY

      - name: Apply pending durable draft source changes
        run: |
          if ! grep -q 'name: "durable_editor_drafts"' src-tauri/src/database.rs \
             && [[ -f scripts/apply-platform-p2-drafts-native.mjs ]]; then
            node scripts/apply-platform-p2-drafts-native.mjs
          fi
          if ! grep -q 'useDurableDraft' src/screens/CardEditorScreen.tsx \
             && [[ -f scripts/apply-platform-p2-drafts-frontend.mjs ]]; then
            node scripts/apply-platform-p2-drafts-frontend.mjs
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          migration_path = Path("src-tauri/migrations/0025_durable_editor_drafts.sql")
          if not migration_path.exists():
              raise SystemExit("Migration 25 is missing")
          checksum = hashlib.sha256(migration_path.read_bytes()).hexdigest()

          path = Path("src-tauri/src/database.rs")
          text = path.read_text()
          if 'name: "durable_editor_drafts"' not in text:
              match = re.search(r'(\s+Migration \{\n\s+version: 24,[\s\S]*?\n\s+\},\n)(\];)', text)
              if not match:
                  raise SystemExit("Migration 24 registry anchor missing")
              entry = f'''    Migration {{
                  version: 25,
                  name: "durable_editor_drafts",
                  checksum: "{checksum}",
                  sql: include_str!("../migrations/0025_durable_editor_drafts.sql"),
              }},
          '''
              text = text[:match.end(1)] + entry + text[match.start(2):]
          text = re.sub(
              r'(version: 25,\n\s+name: "durable_editor_drafts",\n\s+checksum: ")[0-9a-f]{64}("[^}]+)',
              rf'\g<1>{checksum}\g<2>',
              text,
          )
          text = re.sub(r'LATEST_SCHEMA_VERSION: i64 = \d+', 'LATEST_SCHEMA_VERSION: i64 = 25', text)
          path.write_text(text)

          path = Path("src-tauri/src/lib.rs")
          text = path.read_text()
          if "mod editor_drafts;" not in text:
              text = text.replace("mod error;", "mod editor_drafts;\nmod error;")
          if "editor_drafts::reconcile_startup(&database)" not in text:
              marker = '''external_files::reconcile_startup(&database, &paths)
                          .map_err(|error| io::Error::other(error.message))?;'''
              replacement = marker + '''
                      editor_drafts::reconcile_startup(&database)
                          .map_err(|error| io::Error::other(error.message))?;'''
              if marker not in text:
                  raise SystemExit("External-file startup reconciliation anchor missing")
              text = text.replace(marker, replacement)
          if "editor_drafts::open_editor_draft" not in text:
              marker = "external_files::release_prepared_export,"
              replacement = '''external_files::release_prepared_export,
                      editor_drafts::open_editor_draft,
                      editor_drafts::save_editor_draft,
                      editor_drafts::discard_editor_draft,
                      editor_drafts::commit_editor_draft,
                      editor_drafts::list_editor_drafts,'''
              if marker not in text:
                  raise SystemExit("Tauri external-file command registry anchor missing")
              text = text.replace(marker, replacement)
          path.write_text(text)

          path = Path("src-tauri/src/asset_lifecycle.rs")
          text = path.read_text()
          text = text.replace(
              "WHERE committed_at IS NULL AND canceled_at IS NULL AND expires_at < ?1",
              "WHERE committed_at IS NULL AND canceled_at IS NULL AND retention_mode = 'ephemeral' AND expires_at < ?1",
          )
          if "pub(crate) fn retire_unused_editor_assets" not in text:
              at = text.index("fn retire_unused_draft_assets(")
              wrappers = '''pub(crate) fn retire_unused_editor_assets(
                  connection: &Connection,
                  paths: &AppPaths,
                  draft_id: &str,
                  retained: &BTreeSet<String>,
                  now: i64,
                  reason: &str,
              ) -> Result<Vec<PathBuf>, CommandError> {
                  retire_unused_draft_assets(connection, paths, draft_id, retained, now, reason)
              }

              pub(crate) fn remove_editor_cleanup_paths(paths: &[PathBuf]) {
                  remove_paths_best_effort(paths);
              }

              '''
              text = text[:at] + wrappers + text[at:]
          path.write_text(text)

          path = Path("src-tauri/src/library_backup.rs")
          text = path.read_text().replace("const BACKUP_VERSION: i64 = 2;", "const BACKUP_VERSION: i64 = 3;")
          text = text.replace(
              "SELECT COUNT(*) FROM asset_drafts\n                 WHERE committed_at IS NULL AND canceled_at IS NULL",
              "SELECT COUNT(*) FROM asset_drafts\n                 WHERE committed_at IS NULL AND canceled_at IS NULL\n                   AND retention_mode = 'ephemeral'",
          )
          old = "SELECT id, relative_path, mime_type, byte_size\n             FROM assets\n             WHERE lifecycle_state = 'ready' AND deleted_at IS NULL\n             ORDER BY id"
          new = """SELECT a.id,
                    CASE WHEN a.lifecycle_state = 'ready'
                         THEN a.relative_path ELSE a.staged_relative_path END,
                    a.mime_type, a.byte_size
             FROM assets a
             LEFT JOIN asset_drafts ad ON ad.id = a.draft_id
             LEFT JOIN editor_drafts ed ON ed.id = ad.editor_draft_id
             WHERE a.deleted_at IS NULL
               AND (
                 a.lifecycle_state = 'ready'
                 OR (
                   a.lifecycle_state = 'staged'
                   AND ad.retention_mode = 'persistent_editor'
                   AND ad.committed_at IS NULL AND ad.canceled_at IS NULL
                   AND ed.state IN ('active', 'conflicted')
                 )
               )
             ORDER BY a.id"""
          text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Repair tests for final contracts
        run: node scripts/repair-platform-p2-tests.mjs

      - name: Update maintained documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/roadmap.md")
          text = path.read_text()
          marker = "## Current priorities\n"
          note = '''## Completed portability foundation (P0-P2)

          The shared runtime now exposes typed platform capabilities for external files, secure secrets, lifecycle, time zones, and resource observation. External imports are staged into managed storage, exports are prepared before publication, card images use opaque asset identities, and card/template/bulk/AI-profile metadata editors retain bounded device-local drafts across process loss. Android, iOS, Windows, and macOS adapters and packaging remain later platform phases.

          '''
          if "## Completed portability foundation (P0-P2)" not in text:
              if marker not in text:
                  raise SystemExit("Roadmap current-priorities anchor missing")
              text = text.replace(marker, note + marker)
          path.write_text(text)

          path = Path("docs/installation/mobile.md")
          text = path.read_text()
          old = "No installable mobile application, generated mobile project, or supported mobile build procedure is currently included in the repository."
          new = "No installable mobile application or supported mobile build procedure is currently included in the repository. The shared P0-P2 runtime, opaque file-transfer layer, and durable authoring drafts are now implemented, but Android/iOS native adapters and generated projects remain future work."
          text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove temporary applicators
        run: |
          rm -f scripts/apply-platform-p2-drafts-native.mjs
          rm -f scripts/apply-platform-p2-drafts-frontend.mjs
          rm -f scripts/apply-platform-p2-pathfree-frontend.mjs
          rm -f scripts/run-platform-p2-pathfree-frontend.mjs
          rm -f scripts/fix-platform-p2-draft-ui.mjs
          rm -f scripts/repair-platform-p2-richtext-test.mjs
          rm -f scripts/repair-platform-p2-tests.mjs
          rm -f .github/workflows/apply-platform-p2-drafts-native.yml
          rm -f .github/workflows/finalize-platform-p2-drafts-native.yml
          rm -f .github/workflows/apply-platform-p2-drafts-frontend.yml
          rm -f .github/workflows/apply-platform-p2-pathfree-frontend.yml
          rm -f .github/workflows/complete-platform-p0-p2.yml

      - name: Install and provision
        run: |
          pnpm install --frozen-lockfile
          ./scripts/install-native-deps.sh --pdfium-only
          echo "OSTUDY_PDFIUM_PATH=$GITHUB_WORKSPACE/src-tauri/resources/native/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run terminal qualification
        run: |
          set -o pipefail
          {
            cargo fmt --manifest-path src-tauri/Cargo.toml --all
            pnpm exec tsc -b --pretty false
            pnpm test
            cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features
            cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features
            node scripts/verify-project-manifests.mjs
            node scripts/verify-ipc-contract.mjs
            node scripts/verify-repository-policy.mjs
            node scripts/verify-platform-boundaries.mjs
            node scripts/verify-documentation.mjs
            git diff --check
          } 2>&1 | tee "$RUNNER_TEMP/p0-p2-terminal.log"

      - name: Commit completed P0-P2 implementation
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No completed P0-P2 changes remain to commit."
            exit 0
          fi
          git commit -m "feat: complete platform portability phases P0-P2"
          git push origin HEAD:agent/platform-portability-p0-p2
