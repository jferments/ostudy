name: Finalize Phase 2

on:
  push:
    branches:
      - agent/phase-2-standalone-flashcard-core
    paths:
      - .phase2-source-export-trigger

permissions:
  contents: write

concurrency:
  group: phase2-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out the Phase 2 branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-standalone-flashcard-core
          fetch-depth: 0

      - name: Apply the final repair patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .phase2-b64-part-* | base64 --decode > "$RUNNER_TEMP/phase2-final.patch"
          git apply --check "$RUNNER_TEMP/phase2-final.patch"
          git apply "$RUNNER_TEMP/phase2-final.patch"
          rm -f \
            .phase2-b64-part-* \
            .phase2-patch-part-* \
            .phase2-patch-ready \
            .phase2-source-export-trigger
          rm -f .github/workflows/phase2-source-export.yml

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            jq \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            python3 \
            sqlite3 \
            webkit2gtk-driver \
            xauth \
            xvfb

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.14.0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Run the full repository gate
        shell: bash
        run: |
          set +e
          ./scripts/check.sh >"$RUNNER_TEMP/phase2-final-validation.log" 2>&1
          status=$?
          printf '%s\n' "$status" >"$RUNNER_TEMP/phase2-final-validation-status.txt"
          cat "$RUNNER_TEMP/phase2-final-validation.log"
          exit 0

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-final-validation
          path: |
            ${{ runner.temp }}/phase2-final-validation.log
            ${{ runner.temp }}/phase2-final-validation-status.txt
          if-no-files-found: error
          retention-days: 1

      - name: Require validation success
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/phase2-final-validation-status.txt")" = "0"

      - name: Commit the validated Phase 2 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete and validate the Phase 2 implementation"
          git push origin HEAD:agent/phase-2-standalone-flashcard-core

      - name: Delete obsolete staging branches
        shell: bash
        run: |
          set -Eeuo pipefail
          for branch in agent/phase-2-payload-staging agent/phase-2-payload-staging-v3; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
