name: Phase 2 repair validation

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .phase2-patch-ready

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.event.pull_request.head.ref == 'agent/phase-2-standalone-flashcard-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      OSTUDY_SKIP_NATIVE_SMOKE: "1"

    steps:
      - name: Check out the Phase 2 branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assemble and apply the repair patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .phase2-patch-part-* > "$RUNNER_TEMP/phase2.patch"
          git apply --check "$RUNNER_TEMP/phase2.patch"
          git apply "$RUNNER_TEMP/phase2.patch"
          rm .phase2-patch-part-* .phase2-patch-ready

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            jq \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            python3 \
            sqlite3 \
            webkit2gtk-driver \
            xauth \
            xvfb

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.14.0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Run the repair validation gate
        shell: bash
        run: |
          set +e
          ./scripts/check.sh >"$RUNNER_TEMP/phase2-validation.log" 2>&1
          status=$?
          printf '%s\n' "$status" >"$RUNNER_TEMP/phase2-validation-status.txt"
          cat "$RUNNER_TEMP/phase2-validation.log"
          exit 0

      - name: Commit the repaired source
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: repair Phase 2 validation failures"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload repair validation output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-repair-validation
          path: |
            ${{ runner.temp }}/phase2-validation.log
            ${{ runner.temp }}/phase2-validation-status.txt
          if-no-files-found: warn
          retention-days: 1
