name: Fix Stage 3.6-3.8 full gate

on:
  push:
    branches:
      - agent/stage-3-6-3-8-scheduling-analytics-projections
    paths:
      - scripts/fix_stage36_38_full_gate.py
      - .github/workflows/fix-stage36-38-full-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage-3-6-3-8-scheduling-analytics-projections
      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply final full-gate corrections
        run: python3 scripts/fix_stage36_38_full_gate.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit corrected source
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve final Stage 3.6 through 3.8 regressions"
          git push origin HEAD:agent/stage-3-6-3-8-scheduling-analytics-projections
      - name: Run full qualification gate
        run: ./scripts/check.sh
