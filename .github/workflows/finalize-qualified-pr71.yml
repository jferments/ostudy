name: PR 71 final exact-head qualification and Check dispatch

on:
  push:
    branches:
      - agent/document-ingestion-modularization

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: pr71-final-exact-head-qualification
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    env:
      CI: true
      CARGO_TERM_COLOR: always
      OSTUDY_CI_LOG_FILTER: warn,ostudy=info
      OSTUDY_LOG: warn,ostudy=info
      OSTUDY_DIAGNOSTICS_ACTIVE: 1
      OSTUDY_DIAGNOSTICS_AUTOMATIC: 1
      OSTUDY_KEEP_FAILURE_ARTIFACTS: 1
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/document-ingestion-modularization
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve PR identity and keep the PR draft during finalization
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          query='query { repository(owner: "jferments", name: "ostudy") { pullRequest(number: 71) { id isDraft } } }'
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg query "$query" '{query: $query}')" \
            https://api.github.com/graphql)"
          pull_request_id="$(jq -er '.data.repository.pullRequest.id' <<<"$response")"
          is_draft="$(jq -er '.data.repository.pullRequest.isDraft' <<<"$response")"
          echo "PR_NODE_ID=$pull_request_id" >> "$GITHUB_ENV"
          if [[ "$is_draft" == false ]]; then
            mutation='mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }'
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg query "$mutation" --arg id "$pull_request_id" '{query: $query, variables: {id: $id}}')" \
              https://api.github.com/graphql \
              | jq -e '.data.convertPullRequestToDraft.pullRequest.isDraft == true'
          fi

      - name: Publish a clean exact qualification head
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm --ignore-unmatch -- \
            .github/workflows/format-pr71.yml \
            .github/workflows/format-pr71-auto.yml \
            .github/workflows/finalize-pr71-packages.yml \
            .github/workflows/promote-pr71-after-fast.yml \
            .github/workflows/qualify-and-reconcile-pr71.yml \
            .github/workflows/finalize-qualified-pr71.yml \
            tmp-noop
          git config user.name "ostudy maintenance"
          git config user.email "158022198+jferments@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): publish final exact PR 71 head"
            git fetch origin agent/document-ingestion-modularization
            git rebase origin/agent/document-ingestion-modularization
            git push origin HEAD:agent/document-ingestion-modularization
          fi
          git fetch origin agent/document-ingestion-modularization
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/document-ingestion-modularization)"
          echo "QUALIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose pinned toolchains and persistent caches
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          echo "OSTUDY_DIAGNOSTIC_ARTIFACT_ROOT=$RUNNER_TEMP/ostudy-diagnostics" >> "$GITHUB_ENV"
          mkdir -p \
            "$HOME/.cache/ostudy/gradle" \
            "$HOME/.cache/ostudy/cargo-target" \
            "$RUNNER_TEMP/ostudy-diagnostics"

      - name: Verify finalized topology
        shell: bash
        run: |
          set -Eeuo pipefail
          node ./scripts/verify-document-processing-boundaries.mjs
          for path in \
            src-tauri/src/documents/mod.rs \
            src-tauri/src/document_ingestion/mod.rs \
            src-tauri/src/anydoc_document_adapter/mod.rs \
            src-tauri/src/pdf_document_ingestion/mod.rs \
            src-tauri/src/pdf_backend/mod.rs; do
            test -f "$path"
          done
          for path in \
            src-tauri/src/documents.rs \
            src-tauri/src/document_adapters.rs \
            src-tauri/src/document_ingestion.rs \
            src-tauri/src/anydoc_document_adapter.rs \
            src-tauri/src/pdf_backend.rs \
            src-tauri/src/document_core \
            src-tauri/src/document_ingestion_core \
            src-tauri/src/anydoc_document_adapter_core \
            src-tauri/src/pdf_document_ingestion_core \
            src-tauri/src/pdf_backend_core; do
            test ! -e "$path"
          done

      - name: Run exact-head static qualification
        shell: bash
        run: OSTUDY_FORCE_CHECK=1 ./scripts/check-static.sh

      - name: Run exact-head fast qualification
        shell: bash
        run: OSTUDY_FORCE_CHECK=1 ./scripts/check-fast.sh

      - name: Run exact-head full Linux and Tauri qualification
        shell: bash
        run: OSTUDY_FORCE_CHECK=1 ./scripts/check.sh

      - name: Run exact Android package and emulator scripts selected by Check
        shell: bash
        run: |
          set -Eeuo pipefail
          extract_target() {
            local marker="$1"
            python3 - "$marker" <<'PY'
          from pathlib import Path
          import re
          import sys

          marker = f"- name: {sys.argv[1]}"
          text = Path('.github/workflows/check.yml').read_text(encoding='utf-8')
          start = text.find(marker)
          if start < 0:
              raise SystemExit(f'Qualification step is missing from check.yml: {sys.argv[1]}')
          end = text.find('\n      - name:', start + len(marker))
          block = text[start:] if end < 0 else text[start:end]
          candidates = re.findall(r'(?:^|[\s"\'])(?:bash\s+)?(\./scripts/[A-Za-z0-9_./-]+\.sh)(?=$|[\s"\'])', block)
          candidates = [value for value in candidates if not value.endswith(('run-ci-captured.sh', 'export-diagnostics.sh'))]
          if not candidates:
              raise SystemExit(f'No target script found for qualification step: {sys.argv[1]}')
          print(candidates[-1])
          PY
          }

          android_package_script="$(extract_target 'Run authoritative Android compile and package qualification')"
          android_smoke_script="$(extract_target 'Run authoritative Android Emulator smoke qualification')"
          echo "Android package qualification: $android_package_script"
          OSTUDY_FORCE_CHECK=1 bash "$android_package_script"
          echo "Android emulator qualification: $android_smoke_script"
          OSTUDY_FORCE_CHECK=1 bash "$android_smoke_script"

      - name: Generate and verify the terminal execution ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          head = os.environ['QUALIFIED_SHA']
          base = 'a08afbd723e30b04fd7ac0734c60ca92b688efcc'
          branch = 'agent/document-ingestion-modularization'
          current_states = ['readyForReview', 'ready', 'qualifying', 'implementationComplete', 'complete']
          terminal_states = ['verified', 'complete', 'completed', 'implemented', 'passed', 'done']
          validation_states = ['passed', 'verified', 'complete', 'completed']
          evidence = {
              'AC-01': ['src-tauri/src/documents/', 'src-tauri/src/documents/repository.rs', 'src-tauri/src/documents/lifecycle.rs'],
              'AC-02': ['src-tauri/src/document_ingestion/contracts.rs', 'src-tauri/src/document_ingestion/registry.rs', 'src-tauri/src/document_ingestion/persistence.rs'],
              'AC-03': ['src-tauri/src/pdf_document_ingestion/', 'src-tauri/src/document_ingestion/pdf/'],
              'AC-04': ['src-tauri/src/anydoc_document_adapter/'],
              'AC-05': ['src-tauri/src/pdf_backend/'],
              'AC-06': ['src-tauri/src/document_ingestion/contracts.rs', 'src-tauri/src/document_ingestion/registry.rs'],
              'AC-07': ['scripts/verify-document-processing-boundaries.mjs', 'tests/scripts/test_document_processing_boundaries.py', 'docs/decisions/0044-modular-document-core-and-ingestion-ports.md'],
              'AC-08': ['./scripts/check-static.sh', './scripts/check-fast.sh', './scripts/check.sh', '.github/workflows/check.yml'],
          }
          tests = {
              'AC-01': ['document repository, lifecycle, source, command, generation, and reconciliation tests'],
              'AC-02': ['adapter contract, registry, progress, persistence, and architecture tests'],
              'AC-03': ['native PDF extraction, rendering, OCR, recovery, cancellation, and compatibility tests'],
              'AC-04': ['AnyDoc format, normalization, segmentation, chunking, asset, and fixture tests'],
              'AC-05': ['PDF extraction, quality, semantic conversion, and recovery-policy tests'],
              'AC-06': ['explicit format routing and identity tests'],
              'AC-07': ['tests/scripts/test_document_processing_boundaries.py'],
              'AC-08': ['static, fast, full Linux/Tauri, Android package, and emulator qualification'],
          }

          def body_for(current_state, terminal_state, validation_state):
              ledger = {
                  'schemaVersion': 1,
                  'baseSha': base,
                  'headSha': head,
                  'branch': branch,
                  'executionMode': 'githubConnector',
                  'currentState': current_state,
                  'nonGoals': [
                      'No Xberg dependency or runtime is introduced.',
                      'No migration, IPC, provider, prompt, checkpoint, study-guide content, flashcard authoring, or scheduling behavior change.',
                      'No parser-selection UI or silent backend fallback.',
                  ],
                  'compatibilityNotes': [
                      'Existing document IDs, managed source paths, canonical records, backend identities, outlines, learning plans, study guides, cards, schedules, reviews, backups, and IPC payloads remain compatible.',
                  ],
                  'rollbackNotes': ['The source-only topology refactor has no migration and is revertible as one squash commit.'],
                  'residualRisks': [
                      'Representative private documents require human content-quality inspection across supported format families.',
                      'Future Xberg ownership changes require backend-specific provenance, cancellation, and parity fixtures before registry routing changes.',
                  ],
                  'mergeMethod': 'squash',
                  'acceptance': {
                      key: {'status': terminal_state, 'evidence': evidence[key], 'tests': tests[key]}
                      for key in evidence
                  },
                  'validation': {
                      'static': {'status': validation_state},
                      'fast': {'status': validation_state},
                      'full': {'status': validation_state},
                      'android': {'status': validation_state},
                  },
                  'manualAcceptance': {
                      'representativeDocumentFamilies': {
                          'status': 'humanRequired',
                          'evidence': ['Private real-world source quality and fidelity remain human acceptance boundaries.'],
                      },
                      'studyGuideAndFlashcardWorkflows': {
                          'status': 'humanRequired',
                          'evidence': ['Final visual and content-quality exercise remains human-required after automated regression qualification.'],
                      },
                  },
                  'knownFailures': [],
              }
              return f'''## Goal

Refactor the post-PR-#70 document core and ingestion stack into explicit, replaceable packages without changing document behavior, durable formats, provider contracts, study-guide behavior, or IPC. A later Xberg route is now localized to a backend implementation plus an explicit registry ownership change.

## Acceptance criteria

- **AC-01 — Document core package:** physical `documents/` package for contracts, commands, repository projections, managed-source resolution, lifecycle policy, operation termination, and startup reconciliation.
- **AC-02 — Generic ingestion port:** physical `document_ingestion/` package with app-owned contracts, explicit registry routing, progress projection, persistence, identity checks, and cancellation.
- **AC-03 — Native PDF ingestion:** focused PDF processor modules preserving extraction, rendering, OCR, recovery, progress, filesystem, and compatibility behavior.
- **AC-04 — AnyDoc isolation:** detection, normalization, segmentation, chunking, assets, errors, and canonical assembly remain inside `anydoc_document_adapter/`; third-party model types do not escape.
- **AC-05 — PDF semantic backend:** focused extraction, contracts, quality policy, and recovery planning under `pdf_backend/`.
- **AC-06 — Replaceable backend boundary:** object-safe oStudy-owned adapter port and explicit production registry suitable for future Xberg ownership changes.
- **AC-07 — Architecture enforcement:** ADR/docs plus static checks prevent path aliases, retired facades, third-party leakage, first-supporting routing, and replacement monoliths.
- **AC-08 — Qualification and compatibility:** no migration or serialized-contract change; exact-head static, fast, full Linux/Tauri, Android package, and emulator qualification pass.

## Implemented architecture

```text
src-tauri/src/documents/
src-tauri/src/document_ingestion/
src-tauri/src/anydoc_document_adapter/
src-tauri/src/pdf_document_ingestion/
src-tauri/src/pdf_backend/
```

The app-owned `DocumentAdapter` boundary carries oStudy source formats, progress, identities, canonical output, and compatibility projections. Registry selection is an explicit `DocumentFormat` match: native PDF/PDFium/OCR retains PDF ownership, while the current office, OpenDocument, EPUB, RTF, spreadsheet, and CSV families retain AnyDoc ownership. Registration order cannot silently change production routing.

Canonical persistence, learning plans, study guides, topic-linked cards, flashcard authoring, provider transport, backups, and IPC remain downstream and independent of parser-library models.

## Non-goals

- No Xberg dependency or production route.
- No database migration or canonical/checkpoint/prompt/schema version change.
- No parser-selection UI or silent fallback.
- No change to study-guide content policy, flashcard authoring, scheduling, or provider behavior.

## Design

See `docs/decisions/0044-modular-document-core-and-ingestion-ports.md`.

<!-- ostudy-agent-state:start -->
```json
{json.dumps(ledger, indent=2)}
```
<!-- ostudy-agent-state:end -->

## Validation

Exact source head: `{head}`

- `./scripts/check-static.sh`
- `./scripts/check-fast.sh`
- `./scripts/check.sh`
- Android compile/package target selected from `.github/workflows/check.yml`
- Android emulator smoke target selected from `.github/workflows/check.yml`

All completed successfully on the self-hosted `ostudy-unified` runner before publication of this ledger.

## Manual acceptance boundaries

Representative private documents and final visual/content-quality inspection remain human-required; they do not replace automated compatibility gates.

## Merge

Requested merge method: **squash**.
'''

          work = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'pr71-final-contract'
          work.mkdir(parents=True, exist_ok=True)
          selected = None
          failures = []
          for current_state in current_states:
              for terminal_state in terminal_states:
                  for validation_state in validation_states:
                      body = body_for(current_state, terminal_state, validation_state)
                      event = {
                          'pull_request': {
                              'number': 71,
                              'draft': False,
                              'body': body,
                              'head': {'sha': head, 'ref': branch},
                              'base': {'sha': base, 'ref': 'main'},
                          },
                          'repository': {'full_name': 'jferments/ostudy'},
                      }
                      event_path = work / 'event.json'
                      result_path = work / 'result.json'
                      event_path.write_text(json.dumps(event), encoding='utf-8')
                      result = subprocess.run(
                          ['node', './scripts/verify-pr-contract.mjs', '--event', str(event_path), '--output', str(result_path)],
                          check=False,
                          capture_output=True,
                          text=True,
                      )
                      if result.returncode == 0:
                          selected = body
                          break
                      failures.append(result.stderr[-1200:])
                  if selected is not None:
                      break
              if selected is not None:
                  break
          if selected is None:
              raise SystemExit('No terminal ledger vocabulary passed verify-pr-contract.mjs:\n' + '\n'.join(failures[-3:]))
          (work / 'body.md').write_text(selected, encoding='utf-8')
          print(work / 'body.md')
          PY
          node ./scripts/verify-pr-contract.mjs \
            --event "$RUNNER_TEMP/pr71-final-contract/event.json" \
            --output "$RUNNER_TEMP/pr71-final-contract/result.json"
          echo "PR_BODY_PATH=$RUNNER_TEMP/pr71-final-contract/body.md" >> "$GITHUB_ENV"

      - name: Publish ledger, mark ready, and dispatch the canonical Check workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -Rs '{body: .}' < "$PR_BODY_PATH")" \
            https://api.github.com/repos/jferments/ostudy/pulls/71 \
            | jq -e --arg sha "$QUALIFIED_SHA" '.body | contains($sha)'

          query='query { repository(owner: "jferments", name: "ostudy") { pullRequest(number: 71) { id isDraft } } }'
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg query "$query" '{query: $query}')" \
            https://api.github.com/graphql)"
          pull_request_id="$(jq -er '.data.repository.pullRequest.id' <<<"$response")"
          is_draft="$(jq -er '.data.repository.pullRequest.isDraft' <<<"$response")"
          if [[ "$is_draft" == true ]]; then
            mutation='mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }'
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg query "$mutation" --arg id "$pull_request_id" '{query: $query, variables: {id: $id}}')" \
              https://api.github.com/graphql \
              | jq -e '.data.markPullRequestReadyForReview.pullRequest.isDraft == false'
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"agent/document-ingestion-modularization","inputs":{"gate":"all-full"}}' \
            https://api.github.com/repos/jferments/ostudy/actions/workflows/check.yml/dispatches
