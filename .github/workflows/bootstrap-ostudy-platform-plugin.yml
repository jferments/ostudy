name: Bootstrap ostudy Android platform plugin

on:
  push:
    branches:
      - agent/android-a1-a3
    paths:
      - .github/workflows/bootstrap-ostudy-platform-plugin.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-ostudy-platform-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 30
    steps:
      - name: Check out Android branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-a1-a3
          fetch-depth: 0

      - name: Install JavaScript dependencies
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile

      - name: Generate plugin skeleton
        run: |
          if [[ ! -f plugins/ostudy-platform/Cargo.toml ]]; then
            rm -rf tauri-plugin-ostudy-platform
            # The current plugin generator still requests metadata through a TTY.
            # Empty answers select its safe defaults; the repository pins and
            # verifies the final metadata after generation.
            yes '' | script -qec \
              "pnpm tauri plugin new ostudy-platform --no-api --no-example --android" \
              /dev/null
            mkdir -p plugins
            mv tauri-plugin-ostudy-platform plugins/ostudy-platform
          fi
          find plugins/ostudy-platform -maxdepth 7 -type f | sort

      - name: Commit generated plugin
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git add -f plugins/ostudy-platform
          if git diff --cached --quiet; then
            echo "No plugin generation changes were required."
            exit 0
          fi
          git commit -m "feat: generate the Android platform plugin skeleton"
          git fetch origin agent/android-a1-a3
          git rebase --autostash origin/agent/android-a1-a3
          git push origin HEAD:agent/android-a1-a3
