name: Apply durable draft frontend integration

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p2-drafts-frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 75
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply durable draft UI
        run: node ./scripts/apply-platform-p2-drafts-frontend.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check production integration
        run: |
          cat > tsconfig.p2-production.json <<'JSON'
          {
            "extends": "./tsconfig.app.json",
            "exclude": [
              "src/**/*.test.ts",
              "src/**/*.test.tsx",
              "src/**/*.spec.ts",
              "src/**/*.spec.tsx",
              "src/test/**"
            ]
          }
          JSON
          pnpm exec tsc -p tsconfig.p2-production.json --pretty false
          rm tsconfig.p2-production.json
          git diff --check

      - name: Commit durable draft UI
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: autosave and recover authoring drafts"
          git push origin HEAD:agent/platform-portability-p0-p2
