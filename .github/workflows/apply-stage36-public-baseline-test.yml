name: Apply Stage 3.6-3.8 public-baseline test fix

on:
  push:
    branches:
      - agent/pre-public-platform-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-stage36-public-baseline-test-fix
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on:
      - self-hosted
      - linux
      - x64
      - ostudy-unified
    timeout-minutes: 60

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Expose toolchains and native cache
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"

      - name: Replace stale pre-baseline regression expectation
        run: |
          python3 scripts/apply-stage36-public-baseline-test.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          rm scripts/apply-stage36-public-baseline-test.py
          rm .github/workflows/apply-stage36-public-baseline-test.yml
          rm -f scripts/stage36-workflow-trigger.txt

      - name: Commit source-only result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align Stage 3.6-3.8 regression with public baseline"
          git push origin HEAD:agent/pre-public-platform-hardening

      - name: Provision native runtime and verify the corrected contract
        run: |
          ./scripts/install-native-deps.sh --pdfium-only
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib stage36_38_regression_tests::public_baseline_preserves_stage36_38_attribution_schema -- --exact
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
