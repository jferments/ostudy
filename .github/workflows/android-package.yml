name: Android package

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Android artifact to build
        required: true
        default: debug-apk
        type: choice
        options:
          - debug-apk
          - release-apk
          - release-aab

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 180
    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out selected source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Expose pinned user toolchains and persistent caches
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          mkdir -p \
            "$HOME/.cache/ostudy/gradle" \
            "$HOME/.cache/ostudy/cargo-target"

      - name: Verify unified Android runner
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Install Android build prerequisites
        run: |
          pnpm install --frozen-lockfile
          bash ./scripts/install-android-deps.sh
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          source ./scripts/android-env.sh
          android_write_local_properties
          android_emit_github_environment

      - name: Build selected Android artifact
        env:
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          case "$ARTIFACT" in
            debug-apk)
              bash ./scripts/android-build.sh --debug --apk --target aarch64
              apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*debug*.apk' -printf '%T@ %p\n' | sort -nr | awk 'NR == 1 { $1=""; sub(/^ /, ""); print }')"
              bash ./scripts/verify-android-package.sh "$apk" debug
              ;;
            release-apk)
              bash ./scripts/android-build.sh --release --apk --target all
              apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -printf '%T@ %p\n' | sort -nr | awk 'NR == 1 { $1=""; sub(/^ /, ""); print }')"
              bash ./scripts/verify-android-package.sh "$apk" release
              ;;
            release-aab)
              bash ./scripts/android-build.sh --release --aab --target all
              ;;
            *)
              printf 'Unsupported Android artifact kind: %s\n' "$ARTIFACT" >&2
              exit 2
              ;;
          esac

      - name: Upload Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-android-${{ inputs.artifact }}-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
