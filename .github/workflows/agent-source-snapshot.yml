name: Agent source snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 10
    env:
      QUALIFIED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$QUALIFIED_SHA"

      - name: Create source snapshot
        run: |
          git archive --format=tar.gz --output="$RUNNER_TEMP/ostudy-source-$QUALIFIED_SHA.tar.gz" HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-source-${{ env.QUALIFIED_SHA }}
          path: ${{ runner.temp }}/ostudy-source-${{ env.QUALIFIED_SHA }}.tar.gz
          if-no-files-found: error
          retention-days: 1
