name: PR 51 classify integration failure

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  classify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): classify integration failure') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Classify failure record
        run: |
          test -f .github/pr51-integration-status.txt
          rm -f .github/pr51-marker-*
          stage="unknown"
          for candidate in source format install rust fast android; do
            if grep -q "^${candidate}=failure$" .github/pr51-integration-status.txt; then
              stage="$candidate"
              break
            fi
          done
          touch ".github/pr51-marker-stage-${stage}"
          declare -A patterns=(
            [rust-unresolved]='unresolved import|cannot find (type|function|value|module|crate)|failed to resolve'
            [rust-variant]='no variant or associated item'
            [rust-method]='no method named'
            [rust-type]='mismatched types|expected .* found'
            [rust-borrow]='borrow of moved value|cannot borrow|does not live long enough'
            [rust-warning]='unused import|dead code|never used'
            [typescript]='error TS[0-9]+'
            [dependency-policy]='supply-chain|dependency|Cargo.lock|manifest'
            [repository-policy]='Repository policy|IPC contract|Platform boundaries|Documentation:'
            [kotlin]='^e: |Kotlin compilation|Unresolved reference'
            [gradle-resolution]='Could not resolve|Could not find .*tesseract|Could not GET'
            [android-manifest]='Manifest merger failed|uses-sdk|foregroundServiceType'
            [android-test]='There were failing tests|FAILURES!!!|INSTRUMENTATION_FAILED'
            [tesseract-model]='eng.traineddata|Tesseract'
          )
          for name in "${!patterns[@]}"; do
            if grep -Eiq "${patterns[$name]}" .github/pr51-integration-status.txt; then
              touch ".github/pr51-marker-${name}"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/pr51-integration-status.txt').read_text(errors='replace')
          lines = [line.strip() for line in text.splitlines()]
          candidates = [
              line for line in lines
              if re.search(r'(error\[E\d+\]|error TS\d+|^e: |error:|FAILURE:|FAILED during:)', line, re.I)
          ]
          first = candidates[0] if candidates else 'no recognized first-error line'
          slug = re.sub(r'[^a-z0-9]+', '-', first.lower()).strip('-')[:120] or 'unknown'
          Path(f'.github/pr51-marker-first-{slug}').touch()
          PY

      - name: Commit only classification markers and remove classifier
        run: |
          rm -f .github/workflows/pr51-classify.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add .github/pr51-marker-* .github/workflows/pr51-classify.yml
          git commit -m "chore(pr51): classify integration failure"
          git push origin HEAD:agent/android-completion-a4-a7
