name: PR 51 fresh Rust check

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): fresh Rust check') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Run exact-head Cargo check
        id: cargo
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/pr51-fresh-rust.log"

      - name: Record exact result
        env:
          OUTCOME: ${{ steps.cargo.outcome }}
        run: |
          rm -f .github/pr51-fresh-rust-* .github/pr51-rust-symbol-*
          if [[ "$OUTCOME" == "success" ]]; then
            touch .github/pr51-fresh-rust-pass
          else
            touch .github/pr51-fresh-rust-fail
            cp "$RUNNER_TEMP/pr51-fresh-rust.log" .github/pr51-fresh-rust.log
            python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/pr51-fresh-rust.log').read_text(errors='replace')
          patterns = {
              'crate-ring': r'undeclared crate or module `ring`|unresolved import `ring`',
              'crate-qrcode': r'undeclared crate or module `qrcode`|unresolved import `qrcode`',
              'external-json': r'ExternalFileKind::Json|no variant or associated item named `Json`',
              'scan-qr': r'ScanQrCodeResult|scan_qr_code',
              'background': r'DocumentExecutionLease|BeginBackgroundExecutionRequest|UpdateBackgroundExecutionRequest|EndBackgroundExecutionRequest',
              'helpers': r'preview_remote_snapshot|sync_identity|acknowledge_transport_base|remove_transport_base',
              'types': r'mismatched types|expected .*found',
              'borrow': r'borrow of moved value|cannot borrow|does not live long enough',
              'method': r'no method named',
              'variant': r'no variant or associated item named',
              'private': r'is private|private field|private function',
              'warning': r'unused import|dead code|never used',
          }
          for name, pattern in patterns.items():
              if re.search(pattern, text, re.I):
                  Path(f'.github/pr51-fresh-rust-{name}').touch()
          for code in sorted(set(re.findall(r'error\[(E\d+)\]', text))):
              Path(f'.github/pr51-fresh-rust-code-{code.lower()}').touch()
          PY
          fi
          rm -f .github/workflows/pr51-fresh-rust.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add Cargo.lock src-tauri/Cargo.lock .github/pr51-fresh-rust-* .github/workflows/pr51-fresh-rust.yml 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore(pr51): fresh Rust check ${OUTCOME}"
          git push origin HEAD:agent/android-completion-a4-a7
          [[ "$OUTCOME" == "success" ]]
