name: PR 51 sync file-transfer wiring

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

concurrency:
  group: pr51-one-shot-wiring
  cancel-in-progress: false

jobs:
  wire:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(sync): wire path-free file transfer') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Apply asserted sync file-transfer wiring
        run: python3 ./scripts/pr51-sync-files.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Commit wiring and remove temporary machinery
        env:
          EXPECTED_BRANCH: agent/android-completion-a4-a7
        run: |
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH"
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(sync): wire path-free file transfer"
          git push origin HEAD:"$EXPECTED_BRANCH"
