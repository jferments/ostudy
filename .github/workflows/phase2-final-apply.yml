name: Apply final Phase 2 patch

on:
  pull_request:
    branches: [main]
    paths:
      - .phase2-final-apply-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/phase-2-standalone-flashcard-core' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-standalone-flashcard-core
          fetch-depth: 0
      - name: Apply exact final patch and remove transfer files
        shell: bash
        run: |
          set -Eeuo pipefail
          awk '
            /^H4sI/ { capture = 1 }
            capture && $0 != "PAYLOAD" { print }
            /^PAYLOAD$/ { capture = 0 }
          ' .github/workflows/phase2-source-snapshot.yml > "$RUNNER_TEMP/final.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/final.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/final.patch"
          echo "22cc7a6fe113605430b092f805c4246ff04759bbac3d765900fccd60c14c1e66  $RUNNER_TEMP/final.patch" | sha256sum --check
          git apply --index --whitespace=error-all "$RUNNER_TEMP/final.patch"
          rm -f \
            .github/workflows/phase2-source-snapshot.yml \
            .github/workflows/phase2-final-apply.yml \
            .phase2-final-fix-trigger \
            .phase2-final-apply-trigger
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete Phase 2 validation and safeguards"
          git push origin HEAD:agent/phase-2-standalone-flashcard-core
