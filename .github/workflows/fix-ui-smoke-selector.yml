name: Fix UI smoke selector

on:
  push:
    branches:
      - agent/ui-platform-overhaul

permissions:
  contents: write

concurrency:
  group: fix-ui-smoke-selector
  cancel-in-progress: true

jobs:
  fix:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Update native smoke selector
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/webdriver/smoke.py")
          text = path.read_text(encoding="utf-8")
          old = "button.confidence-score-button[aria-keyshortcuts='2'][aria-label^='2 Medium,']"
          new = "button.confidence-score-button[aria-keyshortcuts='2'][aria-label='2 Medium']"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one legacy rating selector, found {text.count(old)}")
          text = text.replace(old, new)
          text = text.replace(
              "# contract instead of waiting for a text substring that cannot match.",
              "# contract rather than depending on nested visible-text whitespace.",
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit selector fix
        run: |
          git add tests/webdriver/smoke.py
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test: update native practice rating selector"
          git push origin HEAD:agent/ui-platform-overhaul
