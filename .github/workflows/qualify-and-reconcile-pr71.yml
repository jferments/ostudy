name: PR 71 one-shot authoritative qualification and ledger reconciliation

on:
  push:
    branches:
      - agent/document-ingestion-modularization

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr71-authoritative-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    env:
      CI: true
      CARGO_TERM_COLOR: always
      OSTUDY_CI_LOG_FILTER: warn,ostudy=info
      OSTUDY_LOG: warn,ostudy=info
      OSTUDY_DIAGNOSTICS_ACTIVE: 1
      OSTUDY_DIAGNOSTICS_AUTOMATIC: 1
      OSTUDY_KEEP_FAILURE_ARTIFACTS: 1
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/document-ingestion-modularization
          fetch-depth: 0
          persist-credentials: true

      - name: Keep PR 71 draft while its source head and ledger change
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          query='query { repository(owner: "jferments", name: "ostudy") { pullRequest(number: 71) { id isDraft } } }'
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg query "$query" '{query: $query}')" \
            https://api.github.com/graphql)"
          pull_request_id="$(jq -er '.data.repository.pullRequest.id' <<<"$response")"
          is_draft="$(jq -er '.data.repository.pullRequest.isDraft' <<<"$response")"
          echo "PR_NODE_ID=$pull_request_id" >> "$GITHUB_ENV"
          if [[ "$is_draft" == false ]]; then
            mutation='mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }'
            curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --arg query "$mutation" --arg id "$pull_request_id" '{query: $query, variables: {id: $id}}')" \
              https://api.github.com/graphql \
              | jq -e '.data.convertPullRequestToDraft.pullRequest.isDraft == true'
          fi

      - name: Remove one-shot workflows and publish the exact qualification head
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm --ignore-unmatch -- \
            .github/workflows/promote-pr71-after-fast.yml \
            .github/workflows/qualify-and-reconcile-pr71.yml
          git config user.name "ostudy maintenance"
          git config user.email "158022198+jferments@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): publish final PR 71 qualification head"
            git fetch origin agent/document-ingestion-modularization
            git rebase origin/agent/document-ingestion-modularization
            git push origin HEAD:agent/document-ingestion-modularization
          fi
          git fetch origin agent/document-ingestion-modularization
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/agent/document-ingestion-modularization)"
          echo "QUALIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Expose pinned toolchains and persistent caches
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          echo "OSTUDY_DIAGNOSTIC_ARTIFACT_ROOT=$RUNNER_TEMP/ostudy-diagnostics" >> "$GITHUB_ENV"
          mkdir -p \
            "$HOME/.cache/ostudy/gradle" \
            "$HOME/.cache/ostudy/cargo-target" \
            "$RUNNER_TEMP/ostudy-diagnostics"

      - name: Require the finalized package topology
        shell: bash
        run: |
          set -Eeuo pipefail
          node ./scripts/verify-document-processing-boundaries.mjs
          for path in \
            src-tauri/src/documents/mod.rs \
            src-tauri/src/document_ingestion/mod.rs \
            src-tauri/src/anydoc_document_adapter/mod.rs \
            src-tauri/src/pdf_document_ingestion/mod.rs \
            src-tauri/src/pdf_backend/mod.rs; do
            test -f "$path"
          done

      - name: Run static qualification
        shell: bash
        run: OSTUDY_FORCE_CHECK=1 ./scripts/check-static.sh

      - name: Run fast qualification
        shell: bash
        run: OSTUDY_FORCE_CHECK=1 ./scripts/check-fast.sh

      - name: Run authoritative Linux qualification
        shell: bash
        run: OSTUDY_FORCE_CHECK=1 ./scripts/check.sh

      - name: Locate and run the authoritative Android package script
        shell: bash
        run: |
          set -Eeuo pipefail
          script="$(python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('.github/workflows/check.yml').read_text(encoding='utf-8')
          marker = '- name: Run authoritative Android compile and package qualification'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Android compile qualification step is missing from check.yml')
          end = text.find('\n      - name:', start + len(marker))
          block = text[start:] if end < 0 else text[start:end]
          candidates = re.findall(r'(?:^|[\s"\'])(?:bash\s+)?(\./scripts/[A-Za-z0-9_./-]+\.sh)(?=$|[\s"\'])', block)
          candidates = [value for value in candidates if not value.endswith(('run-ci-captured.sh', 'export-diagnostics.sh'))]
          if not candidates:
              raise SystemExit('Could not identify the Android compile script from check.yml')
          print(candidates[-1])
          PY
          )"
          echo "Running $script"
          OSTUDY_FORCE_CHECK=1 bash "$script"

      - name: Locate and run the authoritative Android emulator smoke script
        shell: bash
        run: |
          set -Eeuo pipefail
          script="$(python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('.github/workflows/check.yml').read_text(encoding='utf-8')
          marker = '- name: Run authoritative Android Emulator smoke qualification'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Android emulator qualification step is missing from check.yml')
          end = text.find('\n      - name:', start + len(marker))
          block = text[start:] if end < 0 else text[start:end]
          candidates = re.findall(r'(?:^|[\s"\'])(?:bash\s+)?(\./scripts/[A-Za-z0-9_./-]+\.sh)(?=$|[\s"\'])', block)
          candidates = [value for value in candidates if not value.endswith(('run-ci-captured.sh', 'export-diagnostics.sh'))]
          if not candidates:
              raise SystemExit('Could not identify the Android emulator script from check.yml')
          print(candidates[-1])
          PY
          )"
          echo "Running $script"
          OSTUDY_FORCE_CHECK=1 bash "$script"

      - name: Build and validate the exact-head PR execution ledger
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          head = os.environ['QUALIFIED_SHA']
          base = 'a08afbd723e30b04fd7ac0734c60ca92b688efcc'
          branch = 'agent/document-ingestion-modularization'
          state_candidates = ['readyForReview', 'ready', 'qualifying', 'implementationComplete', 'complete']
          acceptance_candidates = ['verified', 'complete', 'completed', 'implemented', 'passed', 'done']
          validation_candidates = ['passed', 'verified', 'complete', 'completed']

          evidence = {
              'AC-01': ['src-tauri/src/documents/', 'src-tauri/src/documents/repository.rs', 'src-tauri/src/documents/lifecycle.rs'],
              'AC-02': ['src-tauri/src/document_ingestion/contracts.rs', 'src-tauri/src/document_ingestion/registry.rs', 'src-tauri/src/document_ingestion/persistence.rs'],
              'AC-03': ['src-tauri/src/pdf_document_ingestion/', 'src-tauri/src/document_ingestion/pdf/'],
              'AC-04': ['src-tauri/src/anydoc_document_adapter/'],
              'AC-05': ['src-tauri/src/pdf_backend/'],
              'AC-06': ['src-tauri/src/document_ingestion/contracts.rs', 'src-tauri/src/document_ingestion/registry.rs'],
              'AC-07': ['scripts/verify-document-processing-boundaries.mjs', 'tests/scripts/test_document_processing_boundaries.py', 'docs/decisions/0044-modular-document-core-and-ingestion-ports.md'],
              'AC-08': ['./scripts/check-static.sh', './scripts/check-fast.sh', './scripts/check.sh', '.github/workflows/check.yml'],
          }
          tests = {
              'AC-01': ['documents package unit tests', 'guide-only lifecycle regression'],
              'AC-02': ['registry and identity tests', 'canonical persistence tests'],
              'AC-03': ['native PDF ingestion and OCR/recovery tests'],
              'AC-04': ['AnyDoc fixture and normalization tests'],
              'AC-05': ['PDF extraction, quality, and recovery-policy tests'],
              'AC-06': ['explicit format-routing tests', 'architecture verifier tests'],
              'AC-07': ['tests/scripts/test_document_processing_boundaries.py'],
              'AC-08': ['static, fast, full Linux/Tauri, Android package, and emulator qualification'],
          }

          def render_body(current_state: str, acceptance_status: str, validation_status: str) -> str:
              acceptance = {
                  key: {'status': acceptance_status, 'evidence': evidence[key], 'tests': tests[key]}
                  for key in evidence
              }
              ledger = {
                  'schemaVersion': 1,
                  'baseSha': base,
                  'headSha': head,
                  'branch': branch,
                  'executionMode': 'githubConnector',
                  'currentState': current_state,
                  'nonGoals': [
                      'No Xberg dependency or runtime is introduced.',
                      'No migration, IPC, provider, prompt, checkpoint, study-guide content, flashcard authoring, or scheduling behavior change.',
                      'No parser-selection UI or silent backend fallback.',
                  ],
                  'compatibilityNotes': [
                      'Existing document IDs, managed source paths, canonical records, backend identities, outlines, learning plans, study guides, cards, schedules, reviews, backups, and IPC payloads remain compatible.',
                  ],
                  'rollbackNotes': [
                      'This is a source-only topology refactor with no migration and can be reverted as one squash commit.',
                  ],
                  'residualRisks': [
                      'Representative private documents still require human source-quality inspection across PDF, Word, presentation, EPUB, OpenDocument, RTF, spreadsheet, and CSV families.',
                      'A future Xberg route still requires backend-specific parity fixtures before registry ownership changes.',
                  ],
                  'mergeMethod': 'squash',
                  'acceptance': acceptance,
                  'validation': {
                      'static': {'status': validation_status},
                      'fast': {'status': validation_status},
                      'full': {'status': validation_status},
                      'android': {'status': validation_status},
                  },
                  'manualAcceptance': {
                      'representativeDocumentFamilies': {
                          'status': 'humanRequired',
                          'evidence': ['Automated fixtures cover supported families; private real-world source quality remains a human acceptance boundary.'],
                      },
                      'studyGuideAndFlashcardWorkflows': {
                          'status': 'humanRequired',
                          'evidence': ['Automated qualification covers contracts and regressions; final visual/content-quality exercise remains human acceptance.'],
                      },
                  },
                  'knownFailures': [],
              }
              return f'''## Goal

Refactor the post-PR-#70 document core and ingestion stack into explicit, replaceable packages without changing document behavior, durable formats, provider contracts, study-guide behavior, or IPC. The resulting port makes a future Xberg route a backend and registry change rather than another learning-pipeline rewrite.

## Acceptance criteria

- **AC-01 — Document core package:** physical `documents/` package for contracts, commands, repository projections, managed-source resolution, lifecycle policy, operation termination, and startup reconciliation.
- **AC-02 — Generic ingestion port:** physical `document_ingestion/` package with app-owned contracts, explicit registry routing, progress projection, persistence, identity checks, and cancellation.
- **AC-03 — Native PDF ingestion:** focused PDF processor modules preserving extraction, rendering, OCR, recovery, progress, filesystem, and compatibility behavior.
- **AC-04 — AnyDoc isolation:** parser detection, normalization, segmentation, chunking, assets, errors, and canonical assembly remain inside `anydoc_document_adapter/`; third-party model types do not escape.
- **AC-05 — PDF semantic backend:** focused extraction, contracts, quality policy, and recovery planning under `pdf_backend/`.
- **AC-06 — Replaceable backend boundary:** object-safe oStudy-owned adapter port and explicit production registry suitable for future Xberg ownership changes.
- **AC-07 — Architecture enforcement:** maintained ADR/docs plus static regression checks preventing path aliases, retired facades, third-party leakage, first-supporting routing, and replacement monoliths.
- **AC-08 — Qualification and compatibility:** no migration or serialized-contract change; exact-head static, fast, full Linux/Tauri, Android package, and emulator qualification pass.

## Implemented architecture

The five former root files are now normal Rust packages:

```text
src-tauri/src/documents/
src-tauri/src/document_ingestion/
src-tauri/src/anydoc_document_adapter/
src-tauri/src/pdf_document_ingestion/
src-tauri/src/pdf_backend/
```

`DocumentAdapter` and its request, identity, progress, and output contracts are owned by oStudy. Registry routing is an explicit `DocumentFormat` match: PDF remains on the native PDF/PDFium/OCR processor, while the currently supported office, OpenDocument, EPUB, RTF, spreadsheet, and CSV families remain on AnyDoc. A future Xberg implementation must be deliberately assigned format ownership; registration order cannot silently change production behavior.

Canonical persistence, learning plans, study guides, topic-linked cards, flashcard authoring, provider transport, backups, and IPC remain downstream of this boundary and do not depend on parser-library models.

## Non-goals

- No Xberg dependency or production routing in this PR.
- No database migration or canonical/checkpoint/prompt/schema version change.
- No parser-selection UI or silent backend fallback.
- No change to study-guide content policy, flashcard authoring, scheduling, or provider behavior.

## Design

See `docs/decisions/0044-modular-document-core-and-ingestion-ports.md`.

<!-- ostudy-agent-state:start -->
```json
{json.dumps(ledger, indent=2)}
```
<!-- ostudy-agent-state:end -->

## Validation

Exact source head: `{head}`

- `./scripts/check-static.sh`
- `./scripts/check-fast.sh`
- `./scripts/check.sh`
- The Android compile/package script selected by `.github/workflows/check.yml`
- The Android emulator smoke script selected by `.github/workflows/check.yml`

All commands above completed successfully on the self-hosted `ostudy-unified` runner before this ledger was published.

## Manual acceptance boundaries

Representative private documents and final visual/content-quality inspection remain human-required. These do not replace or weaken the automated compatibility gates.

## Merge

Requested merge method: **squash**.
'''

          selected = None
          diagnostics = []
          work = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'pr71-contract'
          work.mkdir(parents=True, exist_ok=True)
          for current_state in state_candidates:
              for acceptance_status in acceptance_candidates:
                  for validation_status in validation_candidates:
                      body = render_body(current_state, acceptance_status, validation_status)
                      event = {
                          'pull_request': {
                              'number': 71,
                              'draft': False,
                              'body': body,
                              'head': {'sha': head, 'ref': branch},
                              'base': {'sha': base, 'ref': 'main'},
                          },
                          'repository': {'full_name': 'jferments/ostudy'},
                      }
                      event_path = work / 'event.json'
                      output_path = work / 'result.json'
                      event_path.write_text(json.dumps(event), encoding='utf-8')
                      result = subprocess.run(
                          [
                              'node',
                              './scripts/verify-pr-contract.mjs',
                              '--event',
                              str(event_path),
                              '--output',
                              str(output_path),
                          ],
                          check=False,
                          capture_output=True,
                          text=True,
                      )
                      if result.returncode == 0:
                          selected = body
                          break
                      diagnostics.append(result.stderr[-1000:])
                  if selected is not None:
                      break
              if selected is not None:
                  break
          if selected is None:
              raise SystemExit('No terminal execution-ledger vocabulary satisfied verify-pr-contract.mjs:\n' + '\n'.join(diagnostics[-3:]))
          (work / 'body.md').write_text(selected, encoding='utf-8')
          print(work / 'body.md')
          PY
          body_path="$RUNNER_TEMP/pr71-contract/body.md"
          node ./scripts/verify-pr-contract.mjs \
            --event "$RUNNER_TEMP/pr71-contract/event.json" \
            --output "$RUNNER_TEMP/pr71-contract/result.json"
          echo "PR_BODY_PATH=$body_path" >> "$GITHUB_ENV"

      - name: Publish the verified ledger and mark PR 71 ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          body_json="$(jq -Rs '{body: .}' < "$PR_BODY_PATH")"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data "$body_json" \
            https://api.github.com/repos/jferments/ostudy/pulls/71 \
            | jq -e --arg sha "$QUALIFIED_SHA" '.body | contains($sha)'

          mutation='mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { pullRequest { number isDraft } } }'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg query "$mutation" --arg id "$PR_NODE_ID" '{query: $query, variables: {id: $id}}')" \
            https://api.github.com/graphql \
            | jq -e '.data.markPullRequestReadyForReview.pullRequest.isDraft == false'
