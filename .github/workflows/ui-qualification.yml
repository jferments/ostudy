name: UI qualification

on:
  push:
    branches:
      - agent/ui-foundation-overhaul-u0-u9
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ui-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: >-
      github.event_name == 'pull_request' ||
      !startsWith(github.event.head_commit.message, 'test: record UI qualification')
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify static repository contracts
        run: pnpm check:static

      - name: Run the fast development gate
        run: pnpm check:fast

      - name: Run the complete repository gate
        run: pnpm check

      - name: Verify semantic UI policy
        run: node scripts/verify-ui-policy.mjs

      - name: Record commit-specific qualification evidence
        if: github.event_name == 'push'
        shell: bash
        run: |
          qualified_sha="$(git rev-parse HEAD)"
          qualified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p docs/development
          cat > docs/development/ui-qualification-evidence.md <<EOF
          # UI modernization qualification evidence

          The UI modernization branch passed its repository qualification gates on the self-hosted runner.

          - Qualified commit: \`${qualified_sha}\`
          - Qualified at: \`${qualified_at}\`
          - Runner class: \`self-hosted\`
          - Static contracts: \`pnpm check:static\`
          - Fast gate: \`pnpm check:fast\`
          - Full gate: \`pnpm check\`
          - UI policy: \`node scripts/verify-ui-policy.mjs\`

          Android remains independently enforced by the repository's Android check workflow so emulator and platform-specific failures cannot be hidden by this marker.
          EOF
          if git diff --quiet -- docs/development/ui-qualification-evidence.md; then
            echo "Qualification evidence is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/ui-qualification-evidence.md
          git commit -m "test: record UI qualification for ${qualified_sha}"
          git push origin HEAD:agent/ui-foundation-overhaul-u0-u9
