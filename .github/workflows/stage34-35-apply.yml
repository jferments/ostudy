name: Apply Stage 3.4 and 3.5 source changes

on:
  push:
    branches:
      - agent/stage-3-4-3-5-transfer-repairs
    paths:
      - .github/workflows/stage34-35-apply.yml
      - scripts/apply-stage34-35-core.py
      - scripts/apply-stage34-35-transfer.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply versioned repair cutover
        run: python3 scripts/apply-stage34-35-core.py
      - name: Apply transfer and backup wiring
        run: python3 scripts/apply-stage34-35-transfer.py
      - name: Refresh locked Rust dependencies
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: implement coherent transfer and versioned repairs" || exit 0
          git push origin HEAD:agent/stage-3-4-3-5-transfer-repairs
