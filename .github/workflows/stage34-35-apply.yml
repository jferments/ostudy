name: Stage 3.4 and 3.5 full qualification

on:
  push:
    branches:
      - agent/stage-3-4-3-5-transfer-repairs
    paths:
      - .github/workflows/stage34-35-apply.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, linux, x64, ostudy]
    steps:
      - uses: actions/checkout@v4
      - name: Run complete qualification gate
        run: ./scripts/check.sh
