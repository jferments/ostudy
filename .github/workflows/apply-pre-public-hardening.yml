name: Apply pre-public platform hardening

on:
  push:
    branches: [agent/pre-public-platform-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pre-public-platform-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 30

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned user toolchains
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply deterministic source and schema transformations
        run: python3 scripts/apply-pre-public-hardening.py

      - name: Normalize generated schema-manifest field names
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("src-tauri/tests/fixtures/public-baseline-schema.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["objects"] = [
              {
                  "objectType": item.pop("type"),
                  "name": item["name"],
                  "sql": item["sql"],
              }
              for item in manifest["objects"]
          ]
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Verify generated baseline and scanner contracts
        run: |
          python3 -m json.tool src-tauri/tests/fixtures/public-baseline-schema.json >/dev/null
          test "$(find src-tauri/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -eq 1
          test -f src-tauri/migrations/0001_public_baseline.sql
          grep -Fq "ostudy-public-v1" src-tauri/migrations/0001_public_baseline.sql
          node scripts/verify-android-qr-scanner.mjs

      - name: Commit generated implementation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No transformation changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete pre-public platform hardening"
          git push origin HEAD:agent/pre-public-platform-hardening
