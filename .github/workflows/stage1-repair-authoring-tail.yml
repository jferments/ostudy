name: Repair Stage 1 authoring tail

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .stage1-repair-authoring-tail

permissions:
  contents: write

concurrency:
  group: phase-2-stage-1-authoring-tail-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/phase-2-stage-1-authoring-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install pinned Rustfmt
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Repair the truncated file and format Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/authoring.rs')
          text = path.read_text(encoding='utf-8')
          expected = '''        std::env::temp_dir().join(format!(
              "ostudy-phase2-{label}-{}-{nonce}",
              std::process::id()
          ))'''.replace('          ', '        ', 1)
          if not text.endswith(expected):
              raise SystemExit('authoring.rs did not have the expected truncated tail')
          path.write_text(text + '\n    }\n}\n', encoding='utf-8')
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          rm -f .stage1-repair-authoring-tail
          rm -f .github/workflows/stage1-repair-authoring-tail.yml
          git diff --check

      - name: Commit and publish the repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore and format the Stage 1 authoring module'
          git push origin HEAD:agent/phase-2-stage-1-authoring-foundation
