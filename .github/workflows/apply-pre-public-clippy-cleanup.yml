name: Apply final pre-public Clippy cleanup

on:
  push:
    branches: [agent/pre-public-platform-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-final-pre-public-clippy-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 45

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Expose toolchains
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"

      - name: Scope automatic-layout helpers to tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/authoring/card_types_and_templates/templates.rs")
          source = path.read_text(encoding="utf-8")
          old = '''use automatic_layout::{
              automatic_template_field_lookup_from_dtos, normalize_typed_template_layout,
              AutomaticTemplateFieldLookup,
          };
          '''
          new = '''#[cfg(test)]
          use automatic_layout::{
              automatic_template_field_lookup_from_dtos, normalize_typed_template_layout,
              AutomaticTemplateFieldLookup,
          };
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected one automatic-layout import block, found {source.count(old)}")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit final lint cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: scope automatic-layout helpers to tests"
          git push origin HEAD:agent/pre-public-platform-hardening

      - name: Provision native runtime and run strict Rust linting
        run: |
          ./scripts/install-native-deps.sh --pdfium-only
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
