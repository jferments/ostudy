name: Stage 1 source export

on:
  push:
    branches:
      - agent/phase-2-stage-1-authoring-foundation
    paths:
      - .github/workflows/stage1-source-export.yml
      - .stage1-source-export-trigger
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - .github/workflows/stage1-source-export.yml
      - .stage1-source-export-trigger

permissions:
  contents: read

jobs:
  export:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/phase-2-stage-1-authoring-foundation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out clean Stage 1 branch
        uses: actions/checkout@v6
        with:
          path: current
          fetch-depth: 0

      - name: Archive clean Stage 1 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          cd current
          tar --exclude=.git --exclude=target --exclude=node_modules -czf "$RUNNER_TEMP/ostudy-stage1-source.tar.gz" .

      - name: Upload clean Stage 1 source tree
        uses: actions/upload-artifact@v7
        with:
          name: ostudy-stage1-source
          path: ${{ runner.temp }}/ostudy-stage1-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Check out failed Phase 2 branch as a read-only reference
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-standalone-flashcard-core
          path: prior-phase2
          fetch-depth: 0

      - name: Assemble the prior final source for selective reuse
        shell: bash
        run: |
          set -Eeuo pipefail
          cd prior-phase2
          cat .phase2-patch-part-* > "$RUNNER_TEMP/prior-phase2-final.patch"
          git apply --check "$RUNNER_TEMP/prior-phase2-final.patch"
          git apply "$RUNNER_TEMP/prior-phase2-final.patch"
          rm -f .phase2-b64-part-* .phase2-patch-part-* .phase2-patch-ready .phase2-source-export-trigger
          rm -f .github/workflows/phase2-source-export.yml
          tar --exclude=.git --exclude=target --exclude=node_modules -czf "$RUNNER_TEMP/prior-phase2-reference.tar.gz" .

      - name: Upload prior Phase 2 reference tree
        uses: actions/upload-artifact@v7
        with:
          name: prior-phase2-reference
          path: ${{ runner.temp }}/prior-phase2-reference.tar.gz
          if-no-files-found: error
          retention-days: 1
