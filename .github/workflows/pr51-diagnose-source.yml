name: PR 51 diagnose source integration

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): diagnose source anchor') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Encode exact source failure
        run: |
          test -f .github/pr51-integration-status.txt
          rm -f .github/pr51-source-anchor-*
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('.github/pr51-integration-status.txt').read_text(errors='replace')
          messages = {
              'module-declarations': r'Could not locate module anchor|Could not locate document module declarations',
              'command-registry': r'Could not locate the unique Tauri command registry|Could not locate device.sync command registry',
              'document-import': r'Could not locate document operation imports',
              'document-lease': r'document execution lease',
              'android-capability': r'Android background capability',
              'cargo-dependencies': r'Could not locate Cargo dependencies',
              'qr-registration': r'QR plugin registration|Could not locate Android document plugin registration',
              'qr-constructor': r'QR constructor|Could not locate mobile plugin constructor',
              'qr-handle': r'QR handle field|Could not locate mobile document plugin field',
              'qr-implementation-end': r'Could not locate mobile plugin implementation end',
              'qr-settings-import': r'QR settings import|Could not locate SyncQrCode import',
              'qr-receive-button': r'QR receive button|Could not locate receive invitation button',
              'sync-platform-import': r'sync platform imports|Could not locate AppPaths import',
              'sync-file-dtos': r'sync file DTOs|Could not locate sync result DTO anchor',
              'sync-transport-anchor': r'path.free sync commands|transport sync helpers|Could not locate sync transport helper anchor|Could not locate capture_sync_snapshot_for_transport',
              'unknown-runtime': r'RuntimeError:',
          }
          found = False
          for name, pattern in messages.items():
              if re.search(pattern, text, re.I):
                  Path(f'.github/pr51-source-anchor-{name}').touch()
                  found = True
          if not found:
              Path('.github/pr51-source-anchor-no-runtime-match').touch()
          PY

      - name: Commit marker and remove diagnostic workflow
        run: |
          rm -f .github/workflows/pr51-diagnose-source.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add .github/pr51-source-anchor-* .github/workflows/pr51-diagnose-source.yml
          git commit -m "chore(pr51): diagnose source anchor"
          git push origin HEAD:agent/android-completion-a4-a7
