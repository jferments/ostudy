name: Finalize UI product overhaul

on:
  push:
    branches:
      - agent/ui-platform-overhaul

permissions:
  contents: write

concurrency:
  group: finalize-ui-product-overhaul
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 60
    steps:
      - name: Check out development branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply final product transformations
        run: |
          set -o pipefail
          if ! {
            node ./scripts/finalize-ui-product-overhaul-fixes.mjs before
            node ./scripts/finalize-ui-product-overhaul.mjs
            node ./scripts/finalize-ui-product-overhaul-fixes.mjs after
          } 2>&1 | tee "$RUNNER_TEMP/ui-finalizer.log"; then
            exit 1
          fi

      - name: Upload finalizer failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-finalizer-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-finalizer.log
          if-no-files-found: error
          retention-days: 7

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run fast qualification before publishing
        env:
          OSTUDY_FORCE_CHECK: "1"
        run: |
          set -o pipefail
          ./scripts/check-fast.sh 2>&1 | tee "$RUNNER_TEMP/ui-fast.log"

      - name: Upload fast-gate failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-fast-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-fast.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish validated product tree
        run: |
          set -o pipefail
          {
            git rm -f scripts/finalize-ui-product-overhaul.mjs scripts/finalize-ui-product-overhaul-fixes.mjs
            git add -A
            git config user.name "ostudy CI"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "refactor: complete responsive UI platform overhaul"
            git push origin HEAD:agent/ui-platform-overhaul
          } 2>&1 | tee "$RUNNER_TEMP/ui-publish.log"

      - name: Upload publish failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-publish-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-publish.log
          if-no-files-found: ignore
          retention-days: 7
