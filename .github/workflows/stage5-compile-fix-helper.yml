name: Stage 5 compile fix helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out task branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-stage-5-scheduling-controls

      - name: Apply exact compile fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  path.write_text(text.replace(old, new))
                  return
              if old_count == 0 and new_count == 1:
                  return
              raise SystemExit(f"unexpected {label} shape: old={old_count} new={new_count}")

          replace_once(
              Path("src-tauri/src/authoring/tests.rs"),
              '''            due_filter: "all".to_string(),
            reviewed_filter: "all".to_string(),''',
              '''            due_filter: "all".to_string(),
            status_filter: "active".to_string(),
            reviewed_filter: "all".to_string(),''',
              "SearchCardsInput fixture",
          )

          search = Path("src-tauri/src/authoring/search_and_tags.rs")
          replace_once(
              search,
              '''    statement
        .query_map(params_from_iter(values.iter()), tag_from_row)
        .map_err(CommandError::database)?
        .collect::<Result<Vec<_>, _>>()
        .map_err(CommandError::database)
}''',
              '''    let tags = statement
        .query_map(params_from_iter(values.iter()), tag_from_row)
        .map_err(CommandError::database)?
        .collect::<Result<Vec<_>, _>>()
        .map_err(CommandError::database)?;
    Ok(tags)
}''',
              "list_tags iterator",
          )
          replace_once(
              search,
              '''    statement
        .query_map([note_id], |row| row.get(0))
        .map_err(CommandError::database)?
        .collect::<Result<Vec<_>, _>>()
        .map_err(CommandError::database)
}''',
              '''    let tags = statement
        .query_map([note_id], |row| row.get(0))
        .map_err(CommandError::database)?
        .collect::<Result<Vec<_>, _>>()
        .map_err(CommandError::database)?;
    Ok(tags)
}''',
              "load_tag_names iterator",
          )
          PY

      - name: Format and publish fixes
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git add src-tauri/src/authoring/tests.rs src-tauri/src/authoring/search_and_tags.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: repair Stage 5 native compile errors"
          git push origin HEAD:agent/phase-2-stage-5-scheduling-controls
