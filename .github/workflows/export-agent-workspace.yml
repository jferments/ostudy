name: Export agent workspace

on:
  push:
    branches:
      - agent/ui-workflow-redesign

permissions:
  contents: read

jobs:
  export:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head with complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Expose pinned JavaScript toolchain
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          node --version
          pnpm --version

      - name: Install frozen JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Create complete repository bundle
        run: git bundle create "$RUNNER_TEMP/ostudy-repository-${GITHUB_SHA}.bundle" --all

      - name: Create bounded source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=src-tauri/target \
            --exclude=src-tauri/gen/android/.gradle \
            --exclude=src-tauri/gen/android/app/build \
            --exclude=src-tauri/gen/android/build \
            -czf "$RUNNER_TEMP/ostudy-source-${GITHUB_SHA}.tar.gz" .

      - name: Create JavaScript dependency archive
        run: tar -czf "$RUNNER_TEMP/ostudy-node-modules-${GITHUB_SHA}.tar.gz" node_modules

      - name: Upload workspace archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ostudy-workspace-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ostudy-repository-${{ github.sha }}.bundle
            ${{ runner.temp }}/ostudy-source-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/ostudy-node-modules-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
