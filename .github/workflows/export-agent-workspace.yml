name: Export agent workspace

on:
  push:
    branches:
      - agent/ui-workflow-redesign

permissions:
  contents: read

jobs:
  export:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Create bounded source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=src-tauri/target \
            --exclude=src-tauri/gen/android/.gradle \
            --exclude=src-tauri/gen/android/app/build \
            --exclude=src-tauri/gen/android/build \
            -czf "$RUNNER_TEMP/ostudy-source-${GITHUB_SHA}.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: ostudy-source-${{ github.sha }}
          path: ${{ runner.temp }}/ostudy-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
