name: Remove Stage 3.6-3.8 temporary tooling

on:
  push:
    branches:
      - agent/stage-3-6-3-8-scheduling-analytics-projections
    paths:
      - scripts/apply-stage36-38-cleanup.py
      - .github/workflows/stage36-38-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage-3-6-3-8-scheduling-analytics-projections
      - name: Remove temporary tooling
        run: python3 scripts/apply-stage36-38-cleanup.py
      - name: Commit clean merge candidate
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Stage 3.6 through 3.8 temporary tooling"
          git push origin HEAD:agent/stage-3-6-3-8-scheduling-analytics-projections
