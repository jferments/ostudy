name: Apply PR41 native-text v5 follow-up

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/pr41-native-text-v5.py
      - .github/pr41-native-text-v5-pre.py
      - .github/workflows/apply-pr41-native-text-v5.yml

permissions:
  contents: write

concurrency:
  group: apply-pr41-native-text-v5
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision audited PDFium runtime
        run: |
          ./scripts/install-native-deps.sh --pdfium-only
          echo "OSTUDY_PDFIUM_PATH=$GITHUB_WORKSPACE/src-tauri/resources/native/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Apply product changes
        run: |
          python3 .github/pr41-native-text-v5-pre.py
          python3 .github/pr41-native-text-v5.py

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Focused PDF and usage regressions
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib pdf_backend::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib document_ingestion::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib token_usage_accepts_openai_and_llama_cpp_envelopes
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib document_pdf_tests::structured_extraction_and_pdfium_rendering_process_a_real_fixture

      - name: Focused settings regressions
        run: |
          pnpm vitest run src/screens/SettingsScreen.test.tsx src/screens/SettingsScreen.extended.test.tsx
          pnpm exec tsc --noEmit

      - name: Run fast qualification
        run: ./scripts/check-fast.sh

      - name: Publish clean product tree
        run: |
          git rm -f .github/pr41-native-text-v5.py .github/pr41-native-text-v5-pre.py .github/workflows/apply-pr41-native-text-v5.yml
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep readable PDF text native and report llama usage"
          git push origin HEAD:agent/ui-platform-overhaul
