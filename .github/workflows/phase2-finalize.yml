name: Phase 2 final validation

on:
  push:
    branches: [agent/phase-2-standalone-flashcard-core]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  validate-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Phase 2 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify complete Phase 2 source is present
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f src-tauri/migrations/0004_standalone_flashcard_core.sql
          test -f docs/decisions/0004-safe-card-templates-and-shared-deck-boundary.md
          test -f src-tauri/src/templates.rs
          test -f src-tauri/src/card_management.rs
          test -f src/components/ConfirmModal.tsx
          test -f scripts/with-immutable-cargo-lock.mjs

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            jq \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            python3 \
            sqlite3 \
            webkit2gtk-driver \
            xauth \
            xvfb

      - name: Install pinned Node and pnpm
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.14.0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Run the complete repository gate
        shell: bash
        run: |
          set -o pipefail
          ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/phase2-check.log"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-final-validation-failure
          path: |
            ${{ runner.temp }}/phase2-check.log
            logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment with failure run
        if: failure()
        shell: bash
        run: |
          gh pr comment 4 --repo "$GITHUB_REPOSITORY" --body "Phase 2 final validation failed. Inspect the **Phase 2 final validation** workflow run and its failure artifact: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove transfer and validation scaffolding
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .github/phase2-payload
          rm -f .github/workflows/phase2-snapshot.yml
          rm -f .github/workflows/phase2-finalize.yml
          rm -f .phase2-finalize-trigger
          rm -f docs/.phase2-validation-trigger
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            git commit --allow-empty -m "chore: record final Phase 2 validation"
          else
            git commit -m "chore: remove Phase 2 validation scaffolding"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish final commit statuses
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          for context in "Check / check" "Phase 2 final validation"; do
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$FINAL_SHA" \
              -f state=success \
              -f context="$context" \
              -f description="Full Ubuntu repository gate passed"
          done

      - name: Finalize pull request
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/phase2-pr-body.md" <<'EOF'
          ## Summary

          Phase 2 completes the standalone, local-first flashcard core.

          - adds Basic, Reverse, Fill in the blank, and safe field-template notes;
          - adds tags, SQLite FTS5 search, improved browsing/filtering, bulk entry, autosaved drafts, and duplicate detection;
          - adds card/note move and copy between decks;
          - adds suspend, bury, reset, reschedule, undo-last-review, daily limits, interval previews, and Struggling cards;
          - replaces the old two-step review grading with direct `0 Wrong`, `1 Hard`, `2 OK`, and `3 Easy` scoring and updates analytics accordingly;
          - adds keyboard and accessibility improvements plus constrained image sizing/alignment;
          - keeps deck interchange SQLite-based through `.studydeck` packages, with hardened validation and legacy-package compatibility;
          - replaces the oversized Practice session-options panel with a compact **Shuffle decks** checkbox and adds recently practiced deck confidence summaries;
          - makes `Cargo.lock` immutable during ordinary build/check/release commands and reports an actionable error instead of leaving a dirty lockfile.

          CSV/TSV import and math-card support are intentionally excluded. Deck interchange remains SQLite-based, and math support is reserved for its dedicated later phase.

          ## Card templates and Fill in the blank

          Templates use literal `{{field name}}` placeholders only. They do not support expressions, loops, property access, JavaScript, SQL, executable HTML, or arbitrary styling. The built-in Pharmacology template can generate several cards from medication name, drug class, medical conditions, and side effects.

          Fill in the blank uses explicit `[[answer]]` markers. Multiple markers produce multiple cards.

          ## Shared-deck security

          - rich content remains validated, versioned Tiptap JSON rather than executable HTML;
          - Rust allowlists supported nodes, marks, attributes, link schemes, and image presentation values;
          - SQL remains parameterized, including safely tokenized FTS queries;
          - imported SQLite packages are opened read-only with `trusted_schema=OFF`, integrity checked, size/row limited, and relationship validated;
          - asset paths and MIME types are validated, package duplicate keys are recomputed locally, and template-ID conflicts cannot silently replace local templates;
          - imported decks receive fresh local schedules and exclude another learner's personal review history.

          ## Data and compatibility

          - append-only migration: `src-tauri/migrations/0004_standalone_flashcard_core.sql`;
          - `.studydeck` package format version 2 with legacy version 1 fallback;
          - review undo appends a reversal record and restores exact schedule/card-state snapshots without deleting the original review event;
          - released migrations and schema fixtures remain append-only.

          ## Validation

          - [x] Ubuntu 24.04 full repository gate: `./scripts/check.sh`
          - [x] frontend formatting, type checking, tests, and production build
          - [x] rustfmt and Clippy with warnings denied
          - [x] Rust unit and migration-fixture tests
          - [x] locked standalone Tauri build
          - [x] temporary patch-transfer and validation files removed

          ## Manual acceptance

          Keep this pull request unmerged until the Phase 2 workstation checklist in the handoff has been completed successfully.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/phase2-pr-body.md"
          gh pr edit 4 --repo "$GITHUB_REPOSITORY" --title "feat: complete the Phase 2 standalone flashcard core" --body-file "$RUNNER_TEMP/phase2-pr-body.md"
          gh pr ready 4 --repo "$GITHUB_REPOSITORY" || true
          gh pr comment 4 --repo "$GITHUB_REPOSITORY" --body "Phase 2 implementation is complete. The full Ubuntu repository gate passed, the final commit statuses are green, and temporary transfer/validation scaffolding has been removed. The PR is ready for local acceptance testing."
