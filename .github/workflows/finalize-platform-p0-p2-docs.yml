name: Finalize P0-P2 documentation

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: finalize-platform-p0-p2-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 90
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply final maintained documentation
        run: node ./scripts/apply-platform-p0-p2-final-docs.mjs

      - name: Install and provision
        run: |
          pnpm install --frozen-lockfile
          ./scripts/install-native-deps.sh --pdfium-only
          echo "OSTUDY_PDFIUM_PATH=$GITHUB_WORKSPACE/src-tauri/resources/native/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run complete repository gate
        run: ./scripts/check.sh

      - name: Remove temporary tooling and commit
        run: |
          rm scripts/apply-platform-p0-p2-final-docs.mjs
          rm .github/workflows/finalize-platform-p0-p2-docs.yml
          git diff --check
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize completed P0-P2 portability foundation"
          git push origin HEAD:agent/platform-portability-p0-p2
