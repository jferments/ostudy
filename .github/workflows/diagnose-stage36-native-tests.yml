name: Diagnose Stage 3.6 native tests

on:
  push:
    branches:
      - agent/stage-3-6-3-8-scheduling-analytics-clean
    paths:
      - .github/workflows/diagnose-stage36-native-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage-3-6-3-8-scheduling-analytics-clean
      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Capture native test result
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture > /tmp/stage36-native-tests.log 2>&1
          status=$?
          mkdir -p tmp
          {
            echo "exit_status=$status"
            tail -n 400 /tmp/stage36-native-tests.log
          } > tmp/stage36-native-test-tail.txt
          exit 0
      - name: Commit diagnostic tail
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add tmp/stage36-native-test-tail.txt
          git commit -m "chore: capture Stage 3.6 native test diagnostics"
          git push origin HEAD:agent/stage-3-6-3-8-scheduling-analytics-clean
