name: PR 51 credential and schedule wiring

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): wire encrypted credentials') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 60
    env:
      CI: true
      CARGO_TERM_COLOR: never
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Apply credential and schedule wiring
        run: python3 ./scripts/pr51-wire-credentials.py

      - name: Format and qualify fast path
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          bash ./scripts/check-fast.sh

      - name: Commit qualified wiring and remove one-shot machinery
        run: |
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git commit -m "chore(pr51): wire encrypted credentials"
          git push origin HEAD:agent/android-completion-a4-a7
