name: PR 51 Android release-candidate qualification

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

concurrency:
  group: pr51-release-candidate
  cancel-in-progress: true

jobs:
  qualify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): release-candidate result') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 180
    env:
      CI: true
      CARGO_TERM_COLOR: never
      GRADLE_USER_HOME: ${{ github.workspace }}/.runner-cache/gradle
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Verify unified runner
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Run fast qualification
        id: fast
        continue-on-error: true
        run: bash ./scripts/check-fast.sh 2>&1 | tee "$RUNNER_TEMP/pr51-rc-fast.log"

      - name: Run full Linux qualification
        id: full
        if: steps.fast.outcome == 'success'
        continue-on-error: true
        run: bash ./scripts/check.sh 2>&1 | tee "$RUNNER_TEMP/pr51-rc-full.log"

      - name: Run Android compile and instrumentation-package qualification
        id: android
        if: steps.full.outcome == 'success'
        continue-on-error: true
        run: bash ./scripts/android-test.sh 2>&1 | tee "$RUNNER_TEMP/pr51-rc-android.log"

      - name: Run API-36 emulator and native instrumentation smoke
        id: emulator
        if: steps.android.outcome == 'success'
        continue-on-error: true
        run: bash ./scripts/android-smoke.sh 2>&1 | tee "$RUNNER_TEMP/pr51-rc-emulator.log"

      - name: Build debug package through public wrapper
        id: debug_package
        if: steps.emulator.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile
          pnpm android:build:debug 2>&1 | tee "$RUNNER_TEMP/pr51-rc-debug-package.log"
          pnpm android:artifacts | tee -a "$RUNNER_TEMP/pr51-rc-debug-package.log"

      - name: Install debug package through public wrapper on a fresh emulator
        id: install_wrapper
        if: steps.debug_package.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb kill-server || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd ostudy-api36-phone \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-load \
            -no-snapshot-save \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/pr51-install-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          timeout 300 bash -c '
            until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do
              sleep 2
            done
          '
          adb shell input keyevent 82 || true
          pnpm android:install:debug 2>&1 | tee "$RUNNER_TEMP/pr51-rc-install-wrapper.log"
          adb shell pm path io.github.jferments.ostudy | grep -F 'package:'
          adb shell am start -W -n io.github.jferments.ostudy/.MainActivity \
            | tee -a "$RUNNER_TEMP/pr51-rc-install-wrapper.log"
          adb shell pidof io.github.jferments.ostudy

      - name: Build release APK and AAB through public wrappers
        id: release_package
        if: steps.install_wrapper.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            pnpm android:build:release
            pnpm android:bundle:release
            pnpm android:artifacts
          } 2>&1 | tee "$RUNNER_TEMP/pr51-rc-release-package.log"

      - name: Record release-candidate result
        env:
          FAST_OUTCOME: ${{ steps.fast.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
          ANDROID_OUTCOME: ${{ steps.android.outcome }}
          EMULATOR_OUTCOME: ${{ steps.emulator.outcome }}
          DEBUG_PACKAGE_OUTCOME: ${{ steps.debug_package.outcome }}
          INSTALL_WRAPPER_OUTCOME: ${{ steps.install_wrapper.outcome }}
          RELEASE_PACKAGE_OUTCOME: ${{ steps.release_package.outcome }}
        run: |
          rm -f .github/pr51-release-candidate-*
          success=true
          for value in \
            "$FAST_OUTCOME" \
            "$FULL_OUTCOME" \
            "$ANDROID_OUTCOME" \
            "$EMULATOR_OUTCOME" \
            "$DEBUG_PACKAGE_OUTCOME" \
            "$INSTALL_WRAPPER_OUTCOME" \
            "$RELEASE_PACKAGE_OUTCOME"; do
            [[ "$value" == "success" ]] || success=false
          done
          if [[ "$success" == true ]]; then
            touch .github/pr51-release-candidate-pass
          else
            touch .github/pr51-release-candidate-fail
            {
              echo "fast=$FAST_OUTCOME"
              echo "full=$FULL_OUTCOME"
              echo "android=$ANDROID_OUTCOME"
              echo "emulator=$EMULATOR_OUTCOME"
              echo "debug_package=$DEBUG_PACKAGE_OUTCOME"
              echo "install_wrapper=$INSTALL_WRAPPER_OUTCOME"
              echo "release_package=$RELEASE_PACKAGE_OUTCOME"
              for log in "$RUNNER_TEMP"/pr51-rc-*.log; do
                [[ -f "$log" ]] || continue
                echo
                echo "===== $(basename "$log") ====="
                tail -n 220 "$log"
              done
            } > .github/pr51-release-candidate.log
          fi
          rm -f .github/workflows/pr51-release-candidate.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git commit -m "chore(pr51): release-candidate result $success"
          git push origin HEAD:agent/android-completion-a4-a7
          [[ "$success" == true ]]

      - name: Upload Android package and emulator evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr51-release-candidate-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
            src-tauri/gen/android/app/build/reports/**
            .artifacts/android-smoke/**
            .github/pr51-release-candidate.log
          if-no-files-found: ignore
          retention-days: 14
