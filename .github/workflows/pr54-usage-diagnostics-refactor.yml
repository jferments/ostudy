name: PR54 usage diagnostics refactor

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: pr54-usage-diagnostics-refactor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply structured usage diagnostics refactor
        run: |
          python3 ./scripts/pr54_usage_diagnostics_refactor.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Qualify corrected source
        run: bash ./scripts/check-fast.sh

      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/src/ai/document_intelligence.rs \
            src-tauri/src/document_more.rs \
            scripts/analyze-document-usage.mjs \
            tests/scripts/test_analyze_document_usage.py
          if git diff --cached --quiet; then
            echo 'Structured usage diagnostics refactor is already applied.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'fix(ai): keep document usage analysis aligned with structured logs'
          git push origin HEAD:agent/pre-public-platform-hardening
