name: Stage47 AI Patch

on:
  push:
    branches:
      - agent/stage-4-7-large-document-resilience

permissions:
  contents: write

concurrency:
  group: stage47-ai-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10
    steps:
      - name: Check out Stage 4.7 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/stage-4-7-large-document-resilience
          fetch-depth: 0
      - name: Expose developer tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply AI resilience patch and format
        run: |
          node ./scripts/apply-stage47-ai.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
      - name: Commit AI resilience patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/ai/document_intelligence.rs src-tauri/src/document_semantics.rs src-tauri/src/document_scale.rs src-tauri/src/document_checkpoints.rs src-tauri/src/pdf_render_backend.rs src-tauri/src/lib.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: bound and checkpoint large-document AI tasks"
          git push origin HEAD:agent/stage-4-7-large-document-resilience
