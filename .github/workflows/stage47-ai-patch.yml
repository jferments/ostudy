name: Stage47 Source Patch

on:
  push:
    branches:
      - agent/stage-4-7-large-document-resilience

permissions:
  contents: write

concurrency:
  group: stage47-source-patch
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10
    steps:
      - name: Check out Stage 4.7 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/stage-4-7-large-document-resilience
          fetch-depth: 0
      - name: Expose developer tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply Stage 4.7 source patches and format
        run: |
          node ./scripts/apply-stage47-ai.mjs
          node ./scripts/apply-stage47-pipeline.mjs
          node ./scripts/apply-stage47-more.mjs
          node ./scripts/apply-stage47-ui.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
      - name: Commit Stage 4.7 source patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src src-tauri/src src-tauri/migrations src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: segment and resume large-document generation"
          git push origin HEAD:agent/stage-4-7-large-document-resilience
