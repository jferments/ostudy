name: PR38 Compile Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pr38-compile-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/stage-4-3-4-6-pdf-flashcard-generation'
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Expose Rust tools
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply fixes and format
        run: |
          node ./scripts/apply-pr38-compile-fixes.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check
      - name: Commit fixes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: resolve PR38 follow-up compile regressions"
          git push origin "HEAD:${HEAD_REF}"
