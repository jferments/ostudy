name: Finish PR41 follow-up

on:
  push:
    branches:
      - agent/ui-platform-overhaul

permissions:
  contents: write

concurrency:
  group: finish-pr41-followup
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply follow-up fixes
        run: node ./scripts/finish-pr41-followup.mjs

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Remove temporary applicator and publish product tree
        run: |
          git rm scripts/finish-pr41-followup.mjs .github/workflows/finish-pr41-followup.yml
          git add -A
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix: complete practice and analytics regression follow-up"
          git push origin HEAD:agent/ui-platform-overhaul
