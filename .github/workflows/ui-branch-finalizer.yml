name: UI branch finalizer

on:
  push:
    branches:
      - agent/ui-foundation-overhaul-u0-u9
    paths:
      - scripts/finalize-ui-branch.py
      - .github/workflows/ui-branch-finalizer.yml

permissions:
  contents: write

concurrency:
  group: ui-branch-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - name: Check out the UI branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ui-foundation-overhaul-u0-u9

      - name: Restore the PR 45 native base and register migration 26
        run: python3 scripts/finalize-ui-branch.py

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate the generated patch
        run: git diff --check

      - name: Commit the finalized native integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Native integration is already finalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/database.rs src-tauri/src/lib.rs \
            src-tauri/src/stage34_35_regression_tests.rs \
            scripts/verify-project-manifests.mjs
          git commit -m "fix: align folder migration with native architecture"
          git push origin HEAD:agent/ui-foundation-overhaul-u0-u9
