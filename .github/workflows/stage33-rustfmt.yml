name: Stage 3.3 rustfmt

on:
  push:
    branches:
      - agent/stage-3-3-managed-assets-undo-delete

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, linux, x64, ostudy]
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/stage-3-3-managed-assets-undo-delete
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Format Rust sources once
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style: apply Stage 3.3 rustfmt"
          git push origin HEAD:agent/stage-3-3-managed-assets-undo-delete
