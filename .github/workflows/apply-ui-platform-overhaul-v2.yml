name: Apply corrected UI platform overhaul

on:
  push:
    branches:
      - agent/ui-platform-overhaul

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ui-overhaul-applied]') }}
    concurrency:
      group: ui-platform-overhaul-migration
      cancel-in-progress: false
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrected repository migration
        run: node ./scripts/fix-ui-platform-overhaul-migration.mjs

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: |
          pnpm exec prettier --write src scripts docs
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit generated implementation
        run: |
          git config user.name "ostudy UI migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: overhaul responsive cross-platform UI [ui-overhaul-applied]"
          git push origin HEAD:agent/ui-platform-overhaul
