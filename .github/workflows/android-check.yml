name: Android check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Android qualification mode
        required: true
        default: qualification
        type: choice
        options:
          - qualification
          - diagnostic
          - min-sdk-smoke
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: android-check-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'min-sdk' || 'normal' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-diagnostic:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnostic') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true &&
        (contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:android -->') ||
         contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:all -->')))
    runs-on: [self-hosted, linux, x64, ostudy, android, kvm]
    timeout-minutes: 210
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      OSTUDY_CARGO_TARGET_DIR: $HOME/.cache/ostudy/android-diagnostic-cargo-target
      OSTUDY_DIAGNOSTIC_PR: ${{ github.event.pull_request.number || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Expose user-local tools and configure cache
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          mkdir -p "$OSTUDY_CARGO_TARGET_DIR"

      - name: Run multi-failure Android diagnostic sweep
        run: |
          bash ./scripts/check-diagnostic.sh \
            --profile android \
            --output-dir "$RUNNER_TEMP/ostudy-agent-diagnostics"

      - name: Publish Android diagnostic summary
        if: always()
        run: |
          summary="$RUNNER_TEMP/ostudy-agent-diagnostics/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ostudy Android diagnostics\n\nNo summary was produced; inspect the job log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Android diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-agent-diagnostics-android-${{ github.event.pull_request.number || 'dispatch' }}-${{ github.sha }}
          path: ${{ runner.temp }}/ostudy-agent-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  android-compile:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'qualification') ||
      (github.event_name == 'pull_request' && github.event.action != 'edited' &&
        !(github.event.pull_request.draft == true &&
          (contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:android -->') ||
           contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:all -->'))))
    runs-on: [self-hosted, linux, x64, ostudy, android]
    timeout-minutes: 150
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      OSTUDY_CARGO_TARGET_DIR: $HOME/.cache/ostudy/android-cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          mkdir -p "$OSTUDY_CARGO_TARGET_DIR"

      - name: Prepare pinned Android toolchain
        run: |
          bash ./scripts/install-android-deps.sh
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          source ./scripts/android-env.sh
          android_write_local_properties
          android_emit_github_environment

      - name: Verify shared code, arm64 package, x86 smoke package, Gradle, Lint, and instrumentation
        run: bash ./scripts/android-test.sh

      - name: Upload reusable Android build products
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-android-build-${{ github.sha }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/reports/**
            plugins/ostudy-platform/android/build/reports/**
          if-no-files-found: warn
          retention-days: 7

  android-emulator-smoke:
    needs: android-compile
    runs-on: [self-hosted, linux, x64, ostudy, android, kvm]
    timeout-minutes: 120
    env:
      CI: "true"
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare emulator toolchain
        run: |
          bash ./scripts/install-android-deps.sh --with-emulator
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          source ./scripts/android-env.sh
          android_write_local_properties
          android_emit_github_environment
          bash ./scripts/android-runner-doctor.sh

      - name: Download compile-job APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ostudy-android-build-${{ github.sha }}
          path: ${{ runner.temp }}/ostudy-android-build

      - name: Resolve reusable smoke APKs
        id: apks
        run: |
          app_apk="$({
            find "$RUNNER_TEMP/ostudy-android-build" -type f -name '*.apk' \
              ! -path '*/androidTest/*' -printf '%T@ %p\n' 2>/dev/null || true
          } | sort -nr | awk 'NR == 1 { $1=""; sub(/^ /, ""); print }')"
          test_apk="$({
            find "$RUNNER_TEMP/ostudy-android-build" -type f -name '*.apk' \
              -path '*/androidTest/*' -printf '%T@ %p\n' 2>/dev/null || true
          } | sort -nr | awk 'NR == 1 { $1=""; sub(/^ /, ""); print }')"
          [[ -f "$app_apk" && -f "$test_apk" ]]
          echo "app_apk=$app_apk" >> "$GITHUB_OUTPUT"
          echo "test_apk=$test_apk" >> "$GITHUB_OUTPUT"

      - name: Run official Android Emulator smoke suite without rebuilding
        run: |
          bash ./scripts/android-emulator-smoke.sh \
            --app-apk "${{ steps.apks.outputs.app_apk }}" \
            --test-apk "${{ steps.apks.outputs.test_apk }}" \
            --artifacts "$RUNNER_TEMP/android-smoke"

      - name: Upload emulator diagnostics and structured case results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-android-emulator-${{ github.sha }}
          path: ${{ runner.temp }}/android-smoke/**
          if-no-files-found: warn
          retention-days: 14

  android-min-sdk-smoke:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'min-sdk-smoke')
    runs-on: [self-hosted, linux, x64, ostudy, android, kvm]
    timeout-minutes: 150
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      OSTUDY_CARGO_TARGET_DIR: $HOME/.cache/ostudy/android-min-sdk-cargo-target

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          mkdir -p "$OSTUDY_CARGO_TARGET_DIR"

      - name: Prepare API-minimum emulator toolchain
        run: |
          bash ./scripts/install-android-deps.sh --with-min-emulator
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android
          source ./scripts/android-env.sh
          android_write_local_properties
          android_emit_github_environment
          bash ./scripts/android-runner-doctor.sh --system-image "$ANDROID_MIN_SYSTEM_IMAGE"

      - name: Build one smoke package and instrumentation package
        run: |
          pnpm install --frozen-lockfile
          node ./scripts/verify-android-project.mjs
          bash ./scripts/android-smoke-frontend-preflight.sh
          bash ./scripts/android-build.sh --debug --apk --target x86_64 --smoke-bridge
          bash ./scripts/android-gradle-contracts.sh
          bash ./scripts/android-gradle-postbuild.sh test-packages
          bash ./scripts/verify-build-cleanliness.sh

      - name: Run minimum-SDK compatibility smoke
        run: |
          source ./scripts/android-env.sh
          app_apk="$({
            find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' \
              ! -path '*/androidTest/*' -printf '%T@ %p\n' 2>/dev/null || true
          } | sort -nr | awk 'NR == 1 { $1=""; sub(/^ /, ""); print }')"
          test_apk="$({
            find src-tauri/gen/android/app/build/outputs/apk/androidTest -type f -name '*.apk' \
              -printf '%T@ %p\n' 2>/dev/null || true
          } | sort -nr | awk 'NR == 1 { $1=""; sub(/^ /, ""); print }')"
          bash ./scripts/android-emulator-smoke.sh \
            --app-apk "$app_apk" \
            --test-apk "$test_apk" \
            --avd-name "$ANDROID_MIN_AVD" \
            --system-image "$ANDROID_MIN_SYSTEM_IMAGE" \
            --artifacts "$RUNNER_TEMP/android-min-sdk-smoke"

      - name: Upload minimum-SDK smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-android-min-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/android-min-sdk-smoke/**
          if-no-files-found: warn
          retention-days: 14
