name: Agent Stage 7 completion

on:
  push:
    branches:
      - agent/ui-workflow-redesign-stages-6-13
    paths:
      - scripts/agent-stage7-complete.py
      - scripts/agent-stage7-finalize.py
      - .github/workflows/agent-stage7-complete.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 90
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/ui-workflow-redesign-stages-6-13
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Apply Stage 6 and Stage 7 patches
        run: python3 ./scripts/agent-stage7-finalize.py

      - name: Validate exact patched tree
        env:
          CI: "true"
          OSTUDY_FORCE_CHECK: "1"
        run: |
          bash ./scripts/check-static.sh
          bash ./scripts/check-fast.sh

      - name: Remove one-shot agent files
        run: |
          rm -f ./scripts/agent-stage6-complete.py
          rm -f ./scripts/agent-stage7-complete.py
          rm -f ./scripts/agent-stage7-finalize.py
          rm -f ./.github/workflows/agent-stage6-complete.yml
          rm -f ./.github/workflows/agent-stage7-complete.yml
          rm -f ./tmp-test-do-not-keep.txt ./tmp-test2-do-not-keep.txt ./tmp-test3-do-not-keep.txt

      - name: Commit validated Stage 6 and Stage 7 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Stage 6/7 changes remained to commit."
            exit 0
          fi
          git commit -m "feat(documents): finish Stage 6 and Stage 7 metadata"
          git push origin HEAD:agent/ui-workflow-redesign-stages-6-13
