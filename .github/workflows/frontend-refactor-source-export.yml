name: Frontend refactor source export

'on':
  push:
    branches:
      - agent/frontend-css-ownership-refactor-restart
    paths:
      - .github/workflows/frontend-refactor-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on:
      - self-hosted
      - linux
      - x64
      - ostudy-unified
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Upload exact refactor workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-refactor-source-${{ github.sha }}
          path: |
            .github/**
            docs/**
            scripts/**
            src/**
            src-tauri/src/**
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock
            src-tauri/build.rs
            src-tauri/tauri.conf.json
            tests/**
            index.html
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tsconfig*.json
            vite.config.ts
            vitest.config.mjs
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
