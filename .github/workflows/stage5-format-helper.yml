name: Stage 5 format helper

on:
  push:
    branches:
      - agent/phase-2-stage-5-scheduling-controls

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-stage-5-scheduling-controls

      - name: Install pinned Rust formatter
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

      - name: Format and publish Rust source
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git add \
            src-tauri/src/database.rs \
            src-tauri/src/learning_signals.rs \
            src-tauri/src/practice.rs \
            src-tauri/src/practice_selection.rs \
            src-tauri/src/schedule_controls.rs \
            src-tauri/src/scheduler.rs \
            src-tauri/src/settings.rs \
            src-tauri/src/workload.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply rustfmt to Stage 5 Rust code"
          git push origin HEAD:agent/phase-2-stage-5-scheduling-controls
