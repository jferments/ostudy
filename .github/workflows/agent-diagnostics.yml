name: Agent diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

concurrency:
  group: agent-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    if: >-
      contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:core -->') ||
      contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:all -->')
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 150
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ runner.temp }}/ostudy-agent-diagnostics-cargo
      OSTUDY_DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run multi-failure core diagnostic sweep
        run: |
          bash ./scripts/check-diagnostic.sh \
            --profile core \
            --output-dir "$RUNNER_TEMP/ostudy-agent-diagnostics"

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/ostudy-agent-diagnostics/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ostudy agent diagnostic sweep\n\nNo summary was produced; inspect the job log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-agent-diagnostics-core-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ostudy-agent-diagnostics/**
          if-no-files-found: warn
          retention-days: 14

  android:
    if: >-
      contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:android -->') ||
      contains(github.event.pull_request.body || '', '<!-- agent-diagnostics:all -->')
    runs-on: [self-hosted, linux, x64, ostudy, android, kvm]
    timeout-minutes: 180
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.android-cargo-target
      OSTUDY_DIAGNOSTIC_PR: ${{ github.event.pull_request.number }}

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Run multi-failure Android diagnostic sweep
        run: |
          bash ./scripts/check-diagnostic.sh \
            --profile android \
            --output-dir "$RUNNER_TEMP/ostudy-agent-diagnostics"

      - name: Publish diagnostic summary
        if: always()
        shell: bash
        run: |
          summary="$RUNNER_TEMP/ostudy-agent-diagnostics/summary.md"
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## ostudy Android agent diagnostic sweep\n\nNo summary was produced; inspect the job log.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ostudy-agent-diagnostics-android-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ostudy-agent-diagnostics/**
          if-no-files-found: warn
          retention-days: 14
