name: PR54 provider activity refinement

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: pr54-provider-activity-refinement
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Apply provider activity refinement
        run: |
          python3 ./scripts/pr54_provider_activity_refinement.py
          git diff --check

      - name: Commit product changes
        run: |
          if git diff --quiet; then
            echo 'Provider activity refinement is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/screens/DocumentsScreen.tsx \
            src/screens/DocumentsProgress.test.tsx
          git diff --cached --check
          git commit -m 'fix(ai): distinguish provider heartbeats from model output'
          git push origin HEAD:agent/pre-public-platform-hardening
