name: Apply canonical migration runner fix

on:
  push:
    branches:
      - agent/stage-3-4-3-5-transfer-repairs
    paths:
      - .github/workflows/canonical-migration-runner.yml
      - scripts/apply-canonical-migration-runner.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration runner fix
        run: python3 scripts/apply-canonical-migration-runner.py
      - name: Format and qualify native migration code
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/database.rs
          git commit -m "fix: run physical canonical migration safely" || exit 0
          git push origin HEAD:agent/stage-3-4-3-5-transfer-repairs
