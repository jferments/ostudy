name: Apply PR41 final polish

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/pr41-final-polish.py
      - .github/workflows/apply-pr41-final-polish.yml

permissions:
  contents: write

concurrency:
  group: apply-pr41-final-polish
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 50
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.cache/ostudy/cargo-target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision audited PDFium runtime
        run: |
          ./scripts/install-native-deps.sh --pdfium-only
          echo "OSTUDY_PDFIUM_PATH=$GITHUB_WORKSPACE/src-tauri/resources/native/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Apply product changes
        run: python3 .github/pr41-final-polish.py

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Focused UI and projection tests
        run: |
          pnpm vitest run src/screens/DecksScreen.test.tsx src/screens/DecksScreen.extended.test.tsx src/screens/cards/BulkEntryModal.test.tsx src/screens/practice/ActivePractice.test.tsx
          pnpm exec tsc --noEmit
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib deck_cards::tests

      - name: Fast qualification
        run: ./scripts/check-fast.sh

      - name: Full qualification
        run: ./scripts/check.sh

      - name: Publish clean product tree
        run: |
          git rm -f .github/pr41-final-polish.py .github/workflows/apply-pr41-final-polish.yml
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: polish deck table and active practice layout"
          git push origin HEAD:agent/ui-platform-overhaul
