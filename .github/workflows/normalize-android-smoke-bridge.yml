name: Normalize Android smoke bridge

on:
  push:
    branches:
      - agent/android-a1-a3

permissions:
  contents: write

concurrency:
  group: normalize-android-smoke-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 15
    steps:
      - name: Check out Android branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-a1-a3
          fetch-depth: 0

      - name: Align emulator fixture with shared IPC types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/testing/androidTestBridge.ts")
          text = path.read_text()
          old = '''  if (!deck) {
              deck = await createDeck({
                name: SMOKE_DECK_NAME,
                description: "Created by the official Android emulator smoke test.",
              });
            }
          '''
          new = '''  if (!deck) {
              const created = await createDeck({
                name: SMOKE_DECK_NAME,
                description: "Created by the official Android emulator smoke test.",
              });
              deck = (await listDecks()).find((candidate) => candidate.id === created.id);
              if (!deck) throw new Error("The Android smoke deck was not returned by the library projection.");
            }
          '''
          if old not in text:
              raise SystemExit("Android smoke create-deck fixture anchor was not found")
          text = text.replace(old, new, 1)
          old = '''      frontDoc: richDocument("What platform is this smoke test exercising?"),
                backDoc: richDocument("Android"),
                tags: ["android-smoke"],
                reverseEnabled: false,
                allowDuplicate: false,
          '''
          new = '''      frontDoc: richDocument("What platform is this smoke test exercising?"),
                backDoc: richDocument("Android"),
                frontText: "What platform is this smoke test exercising?",
                backText: "Android",
                tags: ["android-smoke"],
                reverse: false,
                allowDuplicate: false,
          '''
          if old not in text:
              raise SystemExit("Android smoke card fixture anchor was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/normalize-android-smoke-bridge.yml

      - name: Commit typed smoke fixture
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: align Android smoke fixture with shared IPC"
          git push origin HEAD:agent/android-a1-a3
