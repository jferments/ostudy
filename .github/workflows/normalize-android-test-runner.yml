name: Normalize local Android qualification

on:
  push:
    branches:
      - agent/android-a1-a3

permissions:
  contents: write

concurrency:
  group: normalize-android-test-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 15
    steps:
      - name: Check out Android branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/android-a1-a3
          fetch-depth: 0

      - name: Provision desktop-native fixtures in Android test wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/android-test.sh")
          text = path.read_text()
          old = '''android_write_local_properties
          pnpm install --frozen-lockfile
          node ./scripts/verify-android-project.mjs
          '''
          new = '''android_write_local_properties
          pnpm install --frozen-lockfile
          ./scripts/install-native-deps.sh --pdfium-only
          export OSTUDY_PDFIUM_PATH="$ROOT_DIR/src-tauri/resources/native/pdfium/libpdfium.so"
          node ./scripts/verify-android-project.mjs
          '''
          if old not in text:
              raise SystemExit("Android test prerequisite anchor was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/normalize-android-test-runner.yml

      - name: Commit self-contained Android test wrapper
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: provision shared native fixtures for Android checks"
          git push origin HEAD:agent/android-a1-a3
