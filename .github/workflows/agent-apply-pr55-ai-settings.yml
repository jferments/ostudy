name: Apply PR 55 AI settings

on:
  push:
    branches: [agent/ui-ai-semantic-generation-overhaul]
    paths:
      - scripts/agent-pr55-ai-settings.py
      - .github/workflows/agent-apply-pr55-ai-settings.yml

permissions:
  contents: write

concurrency:
  group: agent-apply-pr55-ai-settings
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 60
    steps:
      - name: Check out exact source head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply simplified setup and advanced policy UI
        run: python3 scripts/agent-pr55-ai-settings.py

      - name: Remove one-shot applicator
        run: git rm scripts/agent-pr55-ai-settings.py .github/workflows/agent-apply-pr55-ai-settings.yml

      - name: Format and validate
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            src/screens/settings/AiLlmSettings.tsx \
            src/screens/settings/AiLlmSettings.module.css \
            src/screens/settings/DefaultAiModelSettings.tsx \
            src/screens/settings/DefaultAiModelSettings.module.css \
            src/controllers/aiProfilesController.ts \
            src/ipc/settings.ts \
            src/controllers/useAppController.ts \
            src/screens/SettingsScreen.tsx \
            docs/architecture/ai-and-document-processing.md \
            docs/user-guide/documents-and-ai-generation.md
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          bash ./scripts/check-static.sh
          pnpm exec tsc --noEmit
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Commit implementation
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: simplify AI setup and expose advanced generation policy"
          git push origin HEAD:agent/ui-ai-semantic-generation-overhaul
