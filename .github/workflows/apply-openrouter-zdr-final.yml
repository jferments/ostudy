name: Apply OpenRouter ZDR profile support

on:
  push:
    branches: [agent/pre-public-platform-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-openrouter-zdr-final
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 75

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned toolchains and caches
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"

      - name: Apply ZDR implementation
        run: python3 scripts/internal/apply_openrouter_zdr.py

      - name: Format and regenerate public schema evidence
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          ./scripts/install-native-deps.sh --pdfium-only
          OSTUDY_REGENERATE_PUBLIC_SCHEMA_MANIFEST=1 \
            cargo test \
              --manifest-path src-tauri/Cargo.toml \
              --locked \
              --all-features \
              database::tests::regenerate_public_baseline_schema_manifest \
              -- --exact

      - name: Commit implementation and regenerated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add OpenRouter zero-data-retention profiles"
          git push origin HEAD:agent/pre-public-platform-hardening

      - name: Run targeted exact-source qualification
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b --pretty false
          pnpm exec vitest run \
            src/ipc/aiProfiles.test.ts \
            src/screens/SettingsScreen.test.tsx \
            src/screens/SettingsScreen.extended.test.tsx
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-features \
            openrouter
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-features \
            openrouter_zero_data_retention_is_persisted_and_provider_scoped \
            -- --exact
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --locked \
            --all-targets \
            --all-features \
            -- -D warnings
