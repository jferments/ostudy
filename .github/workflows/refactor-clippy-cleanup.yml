name: Apply native cleanup

on:
  push:
    branches:
      - agent/stage-3-6-3-8-scheduling-analytics-projections
    paths:
      - scripts/refactor_clippy_cleanup.py
      - .github/workflows/refactor-clippy-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/stage-3-6-3-8-scheduling-analytics-projections
      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Apply strict native cleanup
        run: python3 scripts/refactor_clippy_cleanup.py
      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Commit cleanup
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove superseded native paths"
          git push origin HEAD:agent/stage-3-6-3-8-scheduling-analytics-projections
      - name: Run fast gate
        run: bash ./scripts/check-fast.sh
