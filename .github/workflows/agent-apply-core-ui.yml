name: Apply core UI overhaul

on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .agent/apply_core_ui.py.gz
      - .github/workflows/agent-apply-core-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply deterministic UI changes
        run: |
          gzip -dc .agent/apply_core_ui.py.gz > .agent/apply_core_ui.py
          python3 .agent/apply_core_ui.py

      - name: Format Rust changes
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Validate generated diff
        run: git diff --check

      - name: Remove one-shot transformation
        run: rm -f .agent/apply_core_ui.py .agent/apply_core_ui.py.gz .github/workflows/agent-apply-core-ui.yml

      - name: Commit source changes
        run: |
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: reorganize core study UI for responsive platforms"
          git push origin HEAD:${GITHUB_REF_NAME}
