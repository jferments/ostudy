name: PR 51 classify final TypeScript failure

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  classify:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): classify final TypeScript failure') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Encode TypeScript errors
        run: |
          test -f .github/pr51-final-clean.log
          rm -f .github/pr51-ts-*
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.github/pr51-final-clean.log').read_text(errors='replace')
          for code in sorted(set(re.findall(r'TS(\d+)', text))):
              Path(f'.github/pr51-ts-code-{code}').touch()
          symbols = {
              'include-credentials': r'includeCredentials',
              'credential-count': r'credentialCount',
              'imported-credential-count': r'importedCredentialCount',
              'credential-error-count': r'credentialErrorCount',
              'discard-preview': r'discardDeviceSyncPreview',
              'android-qr-scanner': r'AndroidSyncQrScanner',
              'sync-commit-result': r'DeviceSyncCommitResult',
              'start-sync-options': r'StartDeviceSyncOptions',
              'received-sync': r'ReceivedDeviceSync',
          }
          files = {
              'settings': r'DeviceSyncSettings\.tsx',
              'settings-test': r'DeviceSyncSettings\.test\.tsx',
              'ipc': r'ipc/deviceSync\.ts',
              'qr': r'AndroidSyncQrScanner\.tsx|deviceSyncQr\.ts',
          }
          for name, pattern in symbols.items():
              if re.search(pattern, text):
                  Path(f'.github/pr51-ts-symbol-{name}').touch()
          for name, pattern in files.items():
              if re.search(pattern, text):
                  Path(f'.github/pr51-ts-file-{name}').touch()
          lines = [line.strip() for line in text.splitlines() if re.search(r'error TS\d+', line)]
          first = lines[0] if lines else 'unclassified'
          slug = re.sub(r'[^a-z0-9]+', '-', first.lower()).strip('-')[:150]
          Path(f'.github/pr51-ts-first-{slug or "unclassified"}').touch()
          PY

      - name: Commit markers and remove workflow
        run: |
          rm -f .github/workflows/pr51-classify-ts.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add .github/pr51-ts-* .github/workflows/pr51-classify-ts.yml
          git commit -m "chore(pr51): classify final TypeScript failure"
          git push origin HEAD:agent/android-completion-a4-a7
