name: One-off final stale API cleanup

on:
  push:
    branches:
      - agent/phase-2-stage-2-search-filter-redesign

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the development branch
        uses: actions/checkout@v6
        with:
          ref: agent/phase-2-stage-2-search-filter-redesign
          fetch-depth: 0

      - name: Remove obsolete card and practice APIs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_or_done(path: str, old: str, new: str) -> None:
              value = read(path)
              old_count = value.count(old)
              if old_count == 1:
                  write(path, value.replace(old, new))
                  return
              if old_count > 1:
                  raise RuntimeError(f"{path}: replacement source occurs {old_count} times")
              if new not in value:
                  raise RuntimeError(f"{path}: neither old nor final text was found: {old[:100]!r}")

          def remove_if_present(path: str, start: str, end: str) -> None:
              value = read(path)
              start_index = value.find(start)
              if start_index < 0:
                  return
              end_index = value.find(end, start_index)
              if end_index < 0:
                  raise RuntimeError(f"{path}: end marker not found for {start!r}")
              write(path, value[:start_index] + value[end_index:])

          def insert_before_once(path: str, marker: str, addition: str, sentinel: str) -> None:
              value = read(path)
              if sentinel in value:
                  return
              count = value.count(marker)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one insertion marker, found {count}")
              write(path, value.replace(marker, addition + marker))

          ipc = "src/ipc.ts"
          replace_or_done(
              ipc,
              "export interface CreateCardInput {\n"
              "  deckId: string;\n"
              "  frontDoc: RichDocument;\n"
              "  backDoc: RichDocument;\n"
              "  frontText: string;\n"
              "  backText: string;\n"
              "}\n\n"
              "export interface UpdateCardInput {\n"
              "  noteId: string;\n"
              "  revision: number;\n"
              "  frontDoc: RichDocument;\n"
              "  backDoc: RichDocument;\n"
              "  frontText: string;\n"
              "  backText: string;\n"
              "}\n\n"
              "export interface CreateOrganizedCardInput extends CreateCardInput {\n"
              "  tags: string[];\n"
              "  allowDuplicate: boolean;\n"
              "}\n\n"
              "export interface UpdateOrganizedCardInput extends UpdateCardInput {\n"
              "  deckId: string;\n"
              "  tags: string[];\n"
              "  allowDuplicate: boolean;\n"
              "}\n",
              "export interface CreateOrganizedCardInput {\n"
              "  deckId: string;\n"
              "  frontDoc: RichDocument;\n"
              "  backDoc: RichDocument;\n"
              "  frontText: string;\n"
              "  backText: string;\n"
              "  tags: string[];\n"
              "  allowDuplicate: boolean;\n"
              "}\n\n"
              "export interface UpdateOrganizedCardInput {\n"
              "  noteId: string;\n"
              "  deckId: string;\n"
              "  revision: number;\n"
              "  frontDoc: RichDocument;\n"
              "  backDoc: RichDocument;\n"
              "  frontText: string;\n"
              "  backText: string;\n"
              "  tags: string[];\n"
              "  allowDuplicate: boolean;\n"
              "}\n",
          )
          replace_or_done(
              ipc,
              "export async function getCard(noteId: string): Promise<Flashcard> {\n"
              "  return invoke<Flashcard>(\"get_card\", { noteId });\n"
              "}\n\n"
              "export async function createCard(input: CreateCardInput): Promise<Flashcard> {\n"
              "  return invoke<Flashcard>(\"create_card\", { input });\n"
              "}\n\n"
              "export async function updateCard(input: UpdateCardInput): Promise<Flashcard> {\n"
              "  return invoke<Flashcard>(\"update_card\", { input });\n"
              "}\n\n",
              "export async function getOrganizedCard",
          )
          # The replacement above uses the next active declaration as a sentinel; remove only
          # the obsolete wrapper block when it still exists.
          value = read(ipc)
          obsolete_wrappers = (
              "export async function getCard(noteId: string): Promise<Flashcard> {\n"
              "  return invoke<Flashcard>(\"get_card\", { noteId });\n"
              "}\n\n"
              "export async function createCard(input: CreateCardInput): Promise<Flashcard> {\n"
              "  return invoke<Flashcard>(\"create_card\", { input });\n"
              "}\n\n"
              "export async function updateCard(input: UpdateCardInput): Promise<Flashcard> {\n"
              "  return invoke<Flashcard>(\"update_card\", { input });\n"
              "}\n\n"
          )
          if obsolete_wrappers in value:
              write(ipc, value.replace(obsolete_wrappers, ""))
          value = read(ipc)
          obsolete_practice = (
              "/** Starts a strictly scheduled session containing only cards already due. */\n"
              "export async function startPractice(\n"
              "  input: StartPracticeInput,\n"
              "): Promise<PracticeSession> {\n"
              "  return invoke<PracticeSession>(\"start_practice\", { input });\n"
              "}\n\n"
          )
          if obsolete_practice in value:
              write(ipc, value.replace(obsolete_practice, ""))

          lib = "src-tauri/src/lib.rs"
          value = read(lib)
          for registration in [
              "            cards::get_card,\n",
              "            cards::create_card,\n",
              "            cards::update_card,\n",
              "            practice::start_practice,\n",
          ]:
              value = value.replace(registration, "")
          write(lib, value)

          cards = "src-tauri/src/cards.rs"
          replace_or_done(
              cards,
              "//! Flashcard commands, persistence, and rich-text validation.\n"
              "//!\n"
              "//! The React/Tiptap editor sends JSON documents across the Tauri IPC boundary.\n"
              "//! This module treats those documents as untrusted input: it validates the\n"
              "//! supported schema, derives searchable plain text in Rust, and writes notes,\n"
              "//! generated cards, and asset relationships in SQLite transactions. Keeping\n"
              "//! the authoritative validation here prevents a modified frontend or imported\n"
              "//! deck from bypassing the card-content rules.\n",
              "//! Shared card hydration, per-deck browsing, deletion, and rich-text validation.\n"
              "//!\n"
              "//! The React/Tiptap editor sends JSON documents across the Tauri IPC boundary.\n"
              "//! This module treats those documents as untrusted input, validates the supported\n"
              "//! schema, and derives authoritative plain text in Rust. The authoring module owns\n"
              "//! card creation and updates so there is one write path for tags, duplicate\n"
              "//! fingerprints, assets, deck changes, and scheduling invariants.\n",
          )
          replace_or_done(
              cards,
              "use rusqlite::{params, Connection, OptionalExtension, Transaction};\n"
              "use serde::{Deserialize, Serialize};\n",
              "use rusqlite::{params, Connection, OptionalExtension};\n"
              "use serde::Serialize;\n",
          )
          replace_or_done(
              cards,
              "    assets::{ensure_assets_exist, get_assets_for_note, AssetDto},\n",
              "    assets::{get_assets_for_note, AssetDto},\n",
          )
          value = read(cards)
          value = value.replace("    scheduler::insert_new_schedule,\n", "")
          value = value.replace(
              "    util::{generate_id, unix_time_millis, validate_entity_id},\n",
              "    util::{unix_time_millis, validate_entity_id},\n",
          )
          value = value.replace(
              "const CONTENT_FORMAT: &str = \"tiptap-json\";\n"
              "const CONTENT_SCHEMA_VERSION: i64 = 1;\n",
              "",
          )
          write(cards, value)
          remove_if_present(
              cards,
              "#[derive(Debug, Deserialize)]\n#[serde(rename_all = \"camelCase\")]\npub struct CreateCardInput",
              "#[derive(Clone, Debug, Serialize)]",
          )
          remove_if_present(
              cards,
              "#[tauri::command]\npub fn get_card(",
              "#[tauri::command]\npub fn delete_card(",
          )
          remove_if_present(
              cards,
              "pub(crate) fn create_card_in_connection(",
              "fn delete_card_in_connection(",
          )
          remove_if_present(cards, "fn ensure_active_deck(", "fn hydrate_card(")
          remove_if_present(cards, "fn all_asset_ids(", "#[cfg(test)]")
          remove_if_present(
              cards,
              "    #[test]\n    fn creates_updates_lists_and_deletes_a_card() {",
              "    #[test]\n    fn rejects_javascript_links() {",
          )
          insert_before_once(
              cards,
              "    #[test]\n    fn rejects_javascript_links() {\n",
              "    #[test]\n"
              "    fn lists_hydrates_and_deletes_a_card() {\n"
              "        let database = Database::open_in_memory().expect(\"database should open\");\n"
              "        let temporary = tempfile_path();\n"
              "        let paths = AppPaths::new(temporary.clone()).expect(\"paths should initialize\");\n\n"
              "        let deck = database\n"
              "            .with_connection(|connection| {\n"
              "                crate::decks::create_deck_in_connection(\n"
              "                    connection,\n"
              "                    crate::decks::CreateDeckInput {\n"
              "                        name: \"Biology\".to_string(),\n"
              "                        description: None,\n"
              "                    },\n"
              "                )\n"
              "            })\n"
              "            .expect(\"deck should be created\");\n\n"
              "        let (note_id, card_id) = database\n"
              "            .with_connection(|connection| {\n"
              "                let content = validate_content(\n"
              "                    paragraph(\"What is ATP?\"),\n"
              "                    paragraph(\"The cell's immediately usable energy currency.\"),\n"
              "                    \"What is ATP?\".to_string(),\n"
              "                    \"The cell's immediately usable energy currency.\".to_string(),\n"
              "                )?;\n"
              "                let now = unix_time_millis()?;\n"
              "                let note_id = crate::util::generate_id(connection)?;\n"
              "                let card_id = crate::util::generate_id(connection)?;\n"
              "                connection\n"
              "                    .execute(\n"
              "                        \"INSERT INTO notes (\n"
              "                             id, deck_id, note_type, content_format, content_schema_version,\n"
              "                             front_doc, back_doc, front_text, back_text,\n"
              "                             created_at, updated_at, revision\n"
              "                         ) VALUES (\n"
              "                             ?1, ?2, 'basic', 'tiptap-json', 1,\n"
              "                             ?3, ?4, ?5, ?6, ?7, ?7, 1\n"
              "                         )\",\n"
              "                        params![\n"
              "                            note_id,\n"
              "                            deck.id,\n"
              "                            content.front_doc_json,\n"
              "                            content.back_doc_json,\n"
              "                            content.front_text,\n"
              "                            content.back_text,\n"
              "                            now\n"
              "                        ],\n"
              "                    )\n"
              "                    .map_err(CommandError::database)?;\n"
              "                connection\n"
              "                    .execute(\n"
              "                        \"INSERT INTO cards (\n"
              "                             id, note_id, deck_id, direction, template_ordinal,\n"
              "                             created_at, updated_at\n"
              "                         ) VALUES (?1, ?2, ?3, 'forward', 0, ?4, ?4)\",\n"
              "                        params![card_id, note_id, deck.id, now],\n"
              "                    )\n"
              "                    .map_err(CommandError::database)?;\n"
              "                crate::scheduler::insert_new_schedule(connection, &card_id, now)?;\n"
              "                Ok((note_id, card_id))\n"
              "            })\n"
              "            .expect(\"card fixture should be created\");\n\n"
              "        let loaded = database\n"
              "            .with_connection(|connection| {\n"
              "                get_card_from_connection(connection, &paths, &note_id)\n"
              "            })\n"
              "            .expect(\"card should hydrate\");\n"
              "        assert_eq!(loaded.id, card_id);\n"
              "        assert_eq!(loaded.front_text, \"What is ATP?\");\n\n"
              "        let cards = database\n"
              "            .with_connection(|connection| {\n"
              "                list_cards_from_connection(connection, &paths, &deck.id)\n"
              "            })\n"
              "            .expect(\"cards should list\");\n"
              "        assert_eq!(cards.len(), 1);\n\n"
              "        database\n"
              "            .with_connection(|connection| delete_card_in_connection(connection, &note_id))\n"
              "            .expect(\"card should delete\");\n"
              "        let cards = database\n"
              "            .with_connection(|connection| {\n"
              "                list_cards_from_connection(connection, &paths, &deck.id)\n"
              "            })\n"
              "            .expect(\"cards should list\");\n"
              "        assert!(cards.is_empty());\n\n"
              "        let _ = std::fs::remove_dir_all(temporary);\n"
              "    }\n\n",
              "fn lists_hydrates_and_deletes_a_card",
          )

          practice = "src-tauri/src/practice.rs"
          replace_or_done(
              practice,
              "//! Scheduled practice sessions and atomic FSRS review recording.\n"
              "//!\n"
              "//! A session is a snapshot of cards that were due when it started. The answer\n"
              "//! must be revealed before a rating can be submitted. Each accepted rating is\n"
              "//! committed in one SQLite transaction with both the immutable review event\n"
              "//! and the card's mutable schedule. A unique `submission_id` makes retries and\n"
              "//! accidental double-clicks idempotent.\n",
              "//! Practice-session records and atomic FSRS review submission.\n"
              "//!\n"
              "//! Session selection is owned by `practice_selection`; this module owns the\n"
              "//! durable session events and review transaction. An answer must be revealed\n"
              "//! before rating. Each accepted rating appends the immutable review event and\n"
              "//! updates the mutable schedule atomically. A unique `submission_id` makes\n"
              "//! retries and accidental double-clicks idempotent.\n",
          )
          value = read(practice)
          value = value.replace(
              "use std::{\n"
              "    collections::{BTreeSet, HashMap},\n"
              "    hash::{Hash, Hasher},\n"
              "};\n\n",
              "",
          )
          value = value.replace(
              "    cards::{get_card_from_connection, CardDto},\n",
              "    cards::CardDto,\n",
          )
          value = value.replace("    paths::AppPaths,\n", "")
          value = value.replace("const MAX_SESSION_DECKS: usize = 100;\n", "")
          write(practice, value)
          remove_if_present(
              practice,
              "#[derive(Debug, Deserialize)]\n#[serde(rename_all = \"camelCase\")]\npub struct StartPracticeInput",
              "#[derive(Clone, Debug, Serialize)]",
          )
          remove_if_present(
              practice,
              "#[tauri::command]\npub fn start_practice(",
              "#[tauri::command]\npub fn mark_practice_card_viewed(",
          )
          remove_if_present(practice, "fn start_practice_in_connection(", "fn record_practice_event(")
          remove_if_present(practice, "fn validate_deck_ids(", "#[cfg(test)]")
          remove_if_present(
              practice,
              "    #[test]\n    fn requires_at_least_one_deck() {",
              "    #[test]\n    fn completed_sessions_reject_card_events() {",
          )

          practice_selection = "src-tauri/src/practice_selection.rs"
          value = read(practice_selection)
          value = value.replace(
              "    practice::{PracticeCardDto, PracticeSessionDto, StartPracticeInput},\n",
              "    practice::{PracticeCardDto, PracticeSessionDto},\n",
          )
          write(practice_selection, value)
          replace_or_done(
              practice_selection,
              "#[derive(Debug, Deserialize)]\n"
              "#[serde(rename_all = \"camelCase\")]\n"
              "pub struct StartCardPracticeInput {\n",
              "#[derive(Debug, Deserialize)]\n"
              "#[serde(deny_unknown_fields, rename_all = \"camelCase\")]\n"
              "pub struct StartPracticeInput {\n"
              "    pub deck_ids: Vec<String>,\n"
              "    pub shuffle: bool,\n"
              "}\n\n"
              "#[derive(Debug, Deserialize)]\n"
              "#[serde(deny_unknown_fields, rename_all = \"camelCase\")]\n"
              "pub struct StartCardPracticeInput {\n",
          )

          verifier = "scripts/verify-stage2.mjs"
          replace_or_done(
              verifier,
              "  authoring,\n  practiceSelection,\n",
              "  authoring,\n  cardsCore,\n  practice,\n  practiceSelection,\n",
          )
          replace_or_done(
              verifier,
              "  read(\"src-tauri\", \"src\", \"practice_selection.rs\"),\n",
              "  read(\"src-tauri\", \"src\", \"cards.rs\"),\n"
              "  read(\"src-tauri\", \"src\", \"practice.rs\"),\n"
              "  read(\"src-tauri\", \"src\", \"practice_selection.rs\"),\n",
          )
          insert_before_once(
              verifier,
              "if (!practiceSelection.includes(\"start_card_practice\") || !practiceSelection.includes(\"card_ids\")) {\n",
              "for (const removedCommand of [\n"
              "  \"cards::get_card,\",\n"
              "  \"cards::create_card,\",\n"
              "  \"cards::update_card,\",\n"
              "  \"practice::start_practice,\",\n"
              "]) {\n"
              "  if (rustCommands.includes(removedCommand)) {\n"
              "    failures.push(`obsolete Rust command is still registered: ${removedCommand}`);\n"
              "  }\n"
              "}\n"
              "for (const removedWrapper of [\n"
              "  \"export async function getCard(\",\n"
              "  \"export async function createCard(\",\n"
              "  \"export async function updateCard(\",\n"
              "  \"export async function startPractice(\",\n"
              "]) {\n"
              "  if (ipc.includes(removedWrapper)) {\n"
              "    failures.push(`obsolete frontend IPC wrapper remains: ${removedWrapper}`);\n"
              "  }\n"
              "}\n"
              "for (const removedFunction of [\n"
              "  \"pub fn get_card(\",\n"
              "  \"pub fn create_card(\",\n"
              "  \"pub fn update_card(\",\n"
              "  \"create_card_in_connection(\",\n"
              "  \"update_card_in_connection(\",\n"
              "]) {\n"
              "  if (cardsCore.includes(removedFunction)) {\n"
              "    failures.push(`obsolete card API remains: ${removedFunction}`);\n"
              "  }\n"
              "}\n"
              "if (practice.includes(\"pub fn start_practice(\") || practice.includes(\"start_practice_in_connection(\")) {\n"
              "  failures.push(\"obsolete strict-due practice implementation remains\");\n"
              "}\n\n",
              "obsolete Rust command is still registered",
          )
          replace_or_done(
              verifier,
              "  \"OK   Search/Filter multi-deck filters, strict IPC inputs, bulk actions, duplicate review, and temporary practice are wired.\",\n",
              "  \"OK   Search/Filter features are wired, strict IPC inputs reject removed fields, and obsolete APIs are absent.\",\n",
          )

          standards = "docs/agents/CODE-STANDARDS.md"
          insert_before_once(
              standards,
              "## Rust\n",
              "- Remove obsolete feature code end-to-end: UI state, typed wrappers, Rust commands,\n"
              "  request fields, tests, verification rules, and documentation. Do not keep an\n"
              "  ignored field or alias solely so an old internal caller can appear to succeed.\n"
              "- Compatibility shims require a documented durable-data or external-format need\n"
              "  and regression coverage. Bundled frontend/Rust IPC is not an external API by\n"
              "  default; a removed option should fail visibly.\n\n",
              "Remove obsolete feature code end-to-end",
          )
          insert_before_once(
              standards,
              "## TypeScript and React\n",
              "- Do not use `#[allow(dead_code)]` to preserve removed product behavior. A\n"
              "  dead-code allowance needs a specific compiler or platform reason.\n"
              "- Use `deny_unknown_fields` on revised IPC request DTOs when silently accepting\n"
              "  a removed or misspelled field would hide a caller defect.\n\n",
              "Do not use `#[allow(dead_code)]`",
          )

          guardrails = "docs/agents/ARCHITECTURE-GUARDRAILS.md"
          replace_or_done(
              guardrails,
              "Treat the following as compatibility surfaces:\n\n"
              "- Tauri command names and typed frontend wrappers;\n"
              "- stable error codes;\n"
              "- database schemas and migration ordering;\n"
              "- Tiptap schema version and validation taxonomy;\n"
              "- `.studydeck` format and import behavior;\n"
              "- FSRS rating mapping and review idempotency;\n"
              "- the Tauri application identifier and application-data location;\n"
              "- user-visible keyboard, accessibility, and theme behavior.\n\n"
              "A change to any of these requires explicit acceptance criteria, regression\n"
              "coverage, migration or compatibility analysis, and documentation. Durable\n"
              "cross-module changes require an ADR.\n",
              "Durable user data and documented external formats are compatibility surfaces:\n\n"
              "- database schemas and migration ordering;\n"
              "- stable error codes for active durable operations;\n"
              "- Tiptap schema version and validation taxonomy;\n"
              "- `.studydeck` format and import behavior;\n"
              "- FSRS rating mapping, review history, and review idempotency;\n"
              "- the Tauri application identifier and application-data location;\n"
              "- user-visible keyboard, accessibility, and theme behavior.\n\n"
              "The bundled React/Rust IPC layer is an internal contract unless an external API\n"
              "is explicitly documented. When an unreleased or internal feature is removed,\n"
              "delete its wrapper, command, request field, tests, and documentation together.\n"
              "Do not silently accept obsolete fields; revised request DTOs should reject them\n"
              "when acceptance would hide a caller defect.\n\n"
              "Changes to durable compatibility surfaces require explicit acceptance criteria,\n"
              "regression coverage, migration or compatibility analysis, and documentation.\n"
              "Durable cross-module changes require an ADR.\n",
          )

          architecture = "docs/ARCHITECTURE.md"
          replace_or_done(
              architecture,
              "- `cards.rs` validates Tiptap JSON and supports the original basic-card API.\n"
              "- `authoring.rs` owns tags, FTS5 queries, organized card writes, exact duplicate\n"
              "  checks, bulk entry, and transactional move/copy.\n",
              "- `cards.rs` owns shared card hydration, per-deck list/delete behavior, and\n"
              "  canonical Tiptap validation.\n"
              "- `authoring.rs` is the only card create/update boundary; it owns tags, FTS5\n"
              "  queries, duplicate checks, assets, deck changes, bulk entry, and move/copy.\n",
          )

          # Final audit: removed feature surfaces must not remain anywhere they could be called.
          assertions = {
              ipc: [
                  "export interface CreateCardInput",
                  "export interface UpdateCardInput",
                  "export async function getCard(",
                  "export async function createCard(",
                  "export async function updateCard(",
                  "export async function startPractice(",
                  'invoke<PracticeSession>("start_practice"',
              ],
              lib: [
                  "cards::get_card,",
                  "cards::create_card,",
                  "cards::update_card,",
                  "practice::start_practice,",
              ],
              cards: [
                  "pub struct CreateCardInput",
                  "pub struct UpdateCardInput",
                  "pub fn get_card(",
                  "pub fn create_card(",
                  "pub fn update_card(",
                  "create_card_in_connection(",
                  "update_card_in_connection(",
              ],
              practice: [
                  "pub fn start_practice(",
                  "start_practice_in_connection(",
              ],
              "src-tauri/src/authoring/commands.rs": ["skip_duplicates: _", "input.deck_id.as_deref()"],
              "src-tauri/src/authoring/search_and_tags.rs": ["legacy_deck_id", "input.deck_id.as_deref()"],
          }
          for path, stale_values in assertions.items():
              value = read(path)
              for stale in stale_values:
                  if stale in value:
                      raise RuntimeError(f"{path}: stale API remains: {stale}")
          PY

          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git diff --check

      - name: Commit the cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "The cleanup script made no changes." >&2
            exit 1
          fi
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src \
            src-tauri/src \
            scripts/verify-stage2.mjs \
            docs/ARCHITECTURE.md \
            docs/agents/CODE-STANDARDS.md \
            docs/agents/ARCHITECTURE-GUARDRAILS.md
          git commit -m "refactor: remove obsolete card and practice APIs"
          git push origin HEAD:agent/phase-2-stage-2-search-filter-redesign
