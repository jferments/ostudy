name: Finalize Phase 2 Stage 1

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .stage1-finalize-trigger

permissions:
  actions: write
  contents: write

concurrency:
  group: phase-2-stage-1-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/phase-2-stage-1-authoring-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out the exact pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assemble and apply the checksum-verified Stage 1 patch
        shell: bash
        run: |
          set -Eeuo pipefail

          cat .stage1-payload-part-* \
            | tr -d '\r\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/stage1-authoring-foundation.patch.gz"

          gzip --decompress --stdout \
            "$RUNNER_TEMP/stage1-authoring-foundation.patch.gz" \
            > "$RUNNER_TEMP/stage1-authoring-foundation.patch"

          printf '%s  %s\n' \
            'a60606131a8adafeab837659a80c4aba4c060780b724466b2422c939631cc475' \
            "$RUNNER_TEMP/stage1-authoring-foundation.patch" \
            | sha256sum --check --strict

          git apply --check "$RUNNER_TEMP/stage1-authoring-foundation.patch"
          git apply "$RUNNER_TEMP/stage1-authoring-foundation.patch"

          rm -f .stage1-payload-part-* .stage1-finalize-trigger
          rm -f .stage1-source-export-trigger
          rm -f .github/workflows/stage1-finalize.yml
          rm -f .github/workflows/stage1-source-export.yml

          test -z "$(find . -maxdepth 1 -name '.stage1-*' -print -quit)"
          test ! -e .github/workflows/stage1-finalize.yml
          test ! -e .github/workflows/stage1-source-export.yml
          git diff --check

      - name: Run publication preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          node --test scripts/with-immutable-cargo-lock.test.mjs
          node scripts/verify-project-manifests.mjs

      - name: Commit and publish the clean implementation
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'feat: implement Phase 2 Stage 1 authoring foundation'

          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:agent/phase-2-stage-1-authoring-foundation
          git fetch origin agent/phase-2-stage-1-authoring-foundation
          test "$(git rev-parse FETCH_HEAD)" = "$final_sha"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Published Stage 1 commit: $final_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the repository gate for the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run check.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/phase-2-stage-1-authoring-foundation
          echo "Dispatched Check for ${{ steps.publish.outputs.final_sha }}" \
            >> "$GITHUB_STEP_SUMMARY"
