name: PR 51 pin Tesseract model

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  pin:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(android): pin English tessdata') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 60
    env:
      CI: true
      GRADLE_USER_HOME: ${{ github.workspace }}/.runner-cache/gradle
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve official tag and compute model digest
        id: model
        run: |
          repository=https://github.com/tesseract-ocr/tessdata_fast.git
          tag=4.1.0
          peeled="$(git ls-remote "$repository" "refs/tags/${tag}^{}" | awk 'NR == 1 {print $1}')"
          direct="$(git ls-remote "$repository" "refs/tags/${tag}" | awk 'NR == 1 {print $1}')"
          commit="${peeled:-$direct}"
          test "${#commit}" -eq 40
          url="https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/${commit}/eng.traineddata"
          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/eng.traineddata"
          test "$(stat -c %s "$RUNNER_TEMP/eng.traineddata")" -gt 1000000
          digest="$(sha256sum "$RUNNER_TEMP/eng.traineddata" | awk '{print $1}')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Pin immutable model source and SHA-256 in Gradle
        env:
          TESSDATA_COMMIT: ${{ steps.model.outputs.commit }}
          TESSDATA_SHA256: ${{ steps.model.outputs.digest }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path('plugins/ostudy-platform/android/build.gradle.kts')
          content = path.read_text(encoding='utf-8')
          content = content.replace(
              'import java.net.URL\n',
              'import java.net.URL\nimport java.security.MessageDigest\n',
              1,
          )
          content = content.replace(
              'val tessdataFastVersion = "4.1.0"\n',
              f'val tessdataFastCommit = "{os.environ["TESSDATA_COMMIT"]}"\n'
              f'val tessdataFastEnglishSha256 = "{os.environ["TESSDATA_SHA256"]}"\n',
              1,
          )
          content = content.replace(
              '"$tessdataFastVersion/eng.traineddata"',
              '"$tessdataFastCommit/eng.traineddata"',
          )
          size_guard = '''        require(temporary.length() > 1_000_000L) {
            "The pinned English Tesseract model download was incomplete."
        }
'''
          digest_guard = size_guard + '''        val actualSha256 = MessageDigest.getInstance("SHA-256")
            .digest(temporary.readBytes())
            .joinToString("") { byte -> "%02x".format(byte) }
        require(actualSha256 == tessdataFastEnglishSha256) {
            "The pinned English Tesseract model failed SHA-256 verification."
        }
'''
          if 'actualSha256' not in content:
              if size_guard not in content:
                  raise SystemExit('Could not locate tessdata size guard')
              content = content.replace(size_guard, digest_guard, 1)
          path.write_text(content, encoding='utf-8')
          PY

      - name: Rebuild Android package with pinned model
        run: bash ./scripts/android-test.sh

      - name: Commit pin and remove workflow
        run: |
          rm -f .github/workflows/pr51-pin-tessdata.yml
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git commit -m "chore(android): pin English tessdata by commit and SHA-256"
          git push origin HEAD:agent/android-completion-a4-a7
