name: Finalize UI platform overhaul tree

on:
  push:
    branches:
      - agent/ui-platform-overhaul

permissions:
  contents: write

jobs:
  finalize:
    concurrency:
      group: ui-platform-overhaul-finalizer
      cancel-in-progress: false
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize source tree
        run: node ./scripts/finalize-ui-platform-overhaul.mjs

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source
        run: |
          pnpm exec prettier --write src scripts docs
          cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit finalized implementation
        run: |
          git config user.name "ostudy UI migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes were needed."
            exit 0
          fi
          git commit -m "feat: finalize responsive cross-platform UI overhaul"
          git push origin HEAD:agent/ui-platform-overhaul
