name: Qualify pre-public platform hardening

on:
  push:
    branches: [agent/pre-public-platform-hardening]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qualify-pre-public-platform-hardening
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 45

    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned user toolchains and caches
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "OSTUDY_CARGO_TARGET_DIR=$HOME/.cache/ostudy/cargo-target" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$HOME/.cache/ostudy/gradle" >> "$GITHUB_ENV"

      - name: Apply exact repository-policy repairs
        run: |
          git mv scripts/lib/diagnostics.sh scripts/lib/diagnostics.bash
          grep -RIl --exclude-dir=.git 'lib/diagnostics.sh' scripts run-app.sh | xargs -r sed -i 's#lib/diagnostics\.sh#lib/diagnostics.bash#g'
          cat > "$RUNNER_TEMP/patch-hardening.py" <<'PY'
          from pathlib import Path
          import re

          verifier = Path("scripts/verify-project-manifests.mjs")
          source = verifier.read_text(encoding="utf-8")
          old = "for (const match of database.matchAll(/Migration\\s*\\{([\\s\\S]*?)\\},/gu)) {"
          new = "const migrationRegistrySource =\n  database.split(\"const MIGRATIONS:\")[1]?.split(\"pub(crate) const LATEST_SCHEMA_VERSION\")[0] ?? \"\";\nfor (const match of migrationRegistrySource.matchAll(/Migration\\s*\\{([\\s\\S]*?)\\}/gu)) {"
          if source.count(old) != 1:
              raise SystemExit(f"expected one migration-registry parser target, found {source.count(old)}")
          verifier.write_text(source.replace(old, new, 1), encoding="utf-8")

          test = Path("src/screens/SettingsScreen.test.tsx")
          source = test.read_text(encoding="utf-8")
          old = '      "AI/LLM",\n      "Review/Scheduling",\n    ]);'
          new = '      "AI/LLM",\n      "Review/Scheduling",\n      "Diagnostics",\n    ]);'
          if source.count(old) != 1:
              raise SystemExit(f"expected one settings-tab expectation target, found {source.count(old)}")
          test.write_text(source.replace(old, new, 1), encoding="utf-8")

          logging = Path("src-tauri/src/logging.rs")
          source = logging.read_text(encoding="utf-8")
          old = "time::{Duration, SystemTime, UNIX_EPOCH}"
          if source.count(old) != 1:
              raise SystemExit(f"expected one direct clock import, found {source.count(old)}")
          source = source.replace(old, "time::Duration", 1)
          pattern = r"fn timestamp_millis\(\) -> i64 \{[\s\S]*?\n\}\n\nfn platform_name\(\) -> &'static str \{[\s\S]*?\n\}\n\n(?=#\[cfg\(test\)\])"
          replacement = "fn timestamp_millis() -> i64 {\n    crate::platform::now_utc_millis().unwrap_or_default()\n}\n\nfn platform_name() -> &'static str {\n    std::env::consts::OS\n}\n\n"
          source, count = re.subn(pattern, replacement, source, count=1)
          if count != 1:
              raise SystemExit(f"expected one clock/platform implementation block, found {count}")
          logging.write_text(source, encoding="utf-8")
          PY
          python3 "$RUNNER_TEMP/patch-hardening.py"
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git add -A

      - name: Run fast exact-head qualification with targeted diagnostics
        run: ./scripts/check-fast.sh --debug=database,ai,qr --keep-artifacts

      - name: Commit qualified repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: qualify pre-public platform hardening"
          git push origin HEAD:agent/pre-public-platform-hardening
