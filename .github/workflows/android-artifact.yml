name: Android artifact

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Android artifact to build
        required: true
        default: debug-apk
        type: choice
        options:
          - debug-apk
          - release-apk
          - release-aab
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 90
    env:
      CI: true
      CARGO_TERM_COLOR: always
      GRADLE_USER_HOME: ${{ github.workspace }}/.runner-cache/gradle
      OSTUDY_CARGO_TARGET_DIR: ${{ github.workspace }}/.runner-cache/cargo-target
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify unified Android runner
        run: bash ./scripts/runner/guest-preflight.sh

      - name: Install exact JavaScript graph
        run: pnpm install --frozen-lockfile

      - name: Select artifact kind
        id: artifact
        env:
          REQUESTED: ${{ github.event.inputs.artifact }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            kind="release-aab"
          else
            kind="${REQUESTED:-debug-apk}"
          fi
          case "$kind" in
            debug-apk)
              echo "command=build-debug" >> "$GITHUB_OUTPUT"
              echo "extension=apk" >> "$GITHUB_OUTPUT"
              ;;
            release-apk)
              echo "command=build-release" >> "$GITHUB_OUTPUT"
              echo "extension=apk" >> "$GITHUB_OUTPUT"
              ;;
            release-aab)
              echo "command=bundle-release" >> "$GITHUB_OUTPUT"
              echo "extension=aab" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported Android artifact kind: $kind" >&2
              exit 2
              ;;
          esac
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - name: Build Android artifact
        run: node ./scripts/android-package.mjs "${{ steps.artifact.outputs.command }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ostudy-${{ steps.artifact.outputs.kind }}-${{ github.sha }}
          path: src-tauri/gen/android/app/build/outputs/**/*.${{ steps.artifact.outputs.extension }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
