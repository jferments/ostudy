name: Apply PR41 quality pass

# Temporary self-hosted applicator; removed by the successful run.
on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/workflows/apply-pr41-quality-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply quality and selection fixes
        run: |
          python3 .github/fix-pr41-helper.py
          set +e
          python3 .github/pr41-quality-pass.py > .github/pr41-apply-error.txt 2>&1
          status=$?
          cat .github/pr41-apply-error.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "ostudy CI"
            git config user.email "actions@users.noreply.github.com"
            git add .github/pr41-quality-pass.py .github/pr41-apply-error.txt
            git commit -m "ci: capture PR41 applicator failure"
            git push origin HEAD:agent/ui-platform-overhaul
            exit "$status"
          fi
          rm -f .github/pr41-apply-error.txt

      - name: Normalize formatting
        run: |
          set +e
          {
            cargo fmt --manifest-path src-tauri/Cargo.toml
            pnpm exec prettier --write src/screens/DocumentsScreen.tsx src/styles/features/ui-overhaul.css
          } > .github/pr41-format-error.txt 2>&1
          status=$?
          cat .github/pr41-format-error.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "ostudy CI"
            git config user.email "actions@users.noreply.github.com"
            git add .github/pr41-format-error.txt
            git commit -m "ci: capture PR41 formatting failure"
            git push origin HEAD:agent/ui-platform-overhaul
            exit "$status"
          fi
          rm -f .github/pr41-format-error.txt

      - name: Run focused regression checks
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml pdf_backend::tests --locked
          cargo test --manifest-path src-tauri/Cargo.toml ai::document_intelligence::tests --locked
          cargo test --manifest-path src-tauri/Cargo.toml workload::tests --locked
          pnpm vitest run src/screens/DocumentsScreen.test.tsx

      - name: Remove applicator and publish product tree
        run: |
          git rm .github/workflows/apply-pr41-quality-pass.yml .github/pr41-quality-pass.py .github/fix-pr41-helper.py
          git rm -f .github/pr41-apply-error.txt .github/pr41-format-error.txt || true
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve document generation and practice selection"
          git push origin HEAD:agent/ui-platform-overhaul
