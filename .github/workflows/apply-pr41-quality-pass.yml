fn response_token_usage(response: &Value) -> (Option<u64>, Option<u64>, Option<u64>) {
    let read = |pointers: &[&str]| {
        pointers
            .iter()
            .find_map(|pointer| response.pointer(pointer).and_then(Value::as_u64))
    };
    let prompt = read(&[
        "/usage/prompt_tokens",
        "/usage/input_tokens",
        "/timings/prompt_n",
        "/tokens_evaluated",
    ]);
    let completion = read(&[
        "/usage/completion_tokens",
        "/usage/output_tokens",
        "/timings/predicted_n",
        "/tokens_predicted",
    ]);
    let total = read(&["/usage/total_tokens"])
        .or_else(|| prompt.zip(completion).map(|(left, right)| left.saturating_add(right)));
    (prompt, completion, total)
}'''
