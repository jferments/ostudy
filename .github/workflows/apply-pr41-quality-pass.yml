name: Apply PR41 quality pass

# Temporary self-hosted applicator; removed by the successful run.
on:
  push:
    branches:
      - agent/ui-platform-overhaul
    paths:
      - .github/workflows/apply-pr41-quality-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/ui-platform-overhaul
          fetch-depth: 0

      - name: Expose local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision audited PDFium runtime
        run: ./scripts/install-native-deps.sh --pdfium-only

      - name: Apply quality and selection fixes
        run: |
          python3 .github/fix-pr41-helper.py
          python3 .github/pr41-quality-pass.py
          rm -f .github/pr41-apply-error.txt

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run focused regression checks
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib pdf_backend::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib ai::document_intelligence::tests
          cargo test --manifest-path src-tauri/Cargo.toml --locked --all-features --lib workload::tests
          pnpm vitest run src/screens/DocumentsScreen.test.tsx

      - name: Remove applicator and publish product tree
        run: |
          git rm -f .github/workflows/apply-pr41-quality-pass.yml .github/pr41-quality-pass.py .github/fix-pr41-helper.py
          git rm -f .github/pr41-apply-error.txt .github/pr41-format-error.txt .github/pr41-test-error.txt || true
          git config user.name "ostudy CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: improve document generation and practice selection"
          git push origin HEAD:agent/ui-platform-overhaul
