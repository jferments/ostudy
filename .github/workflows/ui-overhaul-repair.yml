name: UI overhaul repair and qualification

on:
  push:
    branches:
      - agent/ui-foundation-overhaul-u0-u9
    paths:
      - .github/workflows/ui-overhaul-repair.yml
      - scripts/repair-ui-overhaul-registration.mjs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ui-overhaul-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-qualify:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore native registration files from main and apply the folder patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src-tauri/src/database.rs src-tauri/src/lib.rs
          node scripts/repair-ui-overhaul-registration.mjs
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Commit the repaired native registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ostudy qualification bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "Native registration was already current."
          else
            git add src-tauri/src/database.rs src-tauri/src/lib.rs
            git commit -m "fix: restore native registration and add deck folders"
            git push origin HEAD:agent/ui-foundation-overhaul-u0-u9
          fi

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run qualification gates and capture evidence
        id: qualification
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p .qualification
          overall=0

          run_gate() {
            local key="$1"
            shift
            echo "Running $key: $*"
            set +e
            "$@" >".qualification/${key}.log" 2>&1
            local code=$?
            set -e
            echo "$code" >".qualification/${key}.status"
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          set -e
          run_gate static pnpm check:static
          run_gate fast pnpm check:fast
          run_gate full pnpm check

          {
            echo "<!-- ostudy-ui-overhaul-qualification -->"
            echo "## UI overhaul qualification"
            echo
            echo "Branch: \`${GITHUB_REF_NAME}\`"
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            for key in static fast full; do
              code="$(cat ".qualification/${key}.status")"
              if [ "$code" -eq 0 ]; then
                result="PASS"
              else
                result="FAIL (exit ${code})"
              fi
              echo "### ${key}: ${result}"
              echo '```text'
              tail -n 80 ".qualification/${key}.log"
              echo '```'
              echo
            done
          } > .qualification/comment.md

          cat .qualification/comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "overall=${overall}" >> "$GITHUB_OUTPUT"

      - name: Publish qualification evidence to PR 46
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- ostudy-ui-overhaul-qualification -->';
            const body = fs.existsSync('.qualification/comment.md')
              ? fs.readFileSync('.qualification/comment.md', 'utf8')
              : `${marker}\n## UI overhaul qualification\n\nThe qualification job stopped before it could produce logs.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 46,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 46,
                body,
              });
            }

      - name: Fail when a qualification gate failed
        if: steps.qualification.outputs.overall != '0'
        shell: bash
        run: exit 1
