name: Apply atomic draft retirement in frontend

on:
  push:
    branches:
      - agent/platform-portability-p0-p2

permissions:
  contents: write

concurrency:
  group: apply-platform-p2-atomic-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy]
    timeout-minutes: 120
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/platform-portability-p0-p2
          fetch-depth: 0

      - name: Expose user-local tools
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Apply frontend atomicity changes
        run: node ./scripts/apply-platform-p2-atomic-frontend.mjs

      - name: Install and provision
        run: |
          pnpm install --frozen-lockfile
          ./scripts/install-native-deps.sh --pdfium-only
          echo "OSTUDY_PDFIUM_PATH=$GITHUB_WORKSPACE/src-tauri/resources/native/pdfium/libpdfium.so" >> "$GITHUB_ENV"

      - name: Run complete repository gate
        run: ./scripts/check.sh

      - name: Remove applicator and commit
        run: |
          rm scripts/apply-platform-p2-atomic-frontend.mjs
          rm .github/workflows/apply-platform-p2-atomic-frontend.yml
          git diff --check
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: hand durable drafts to canonical frontend writes"
          git push origin HEAD:agent/platform-portability-p0-p2
