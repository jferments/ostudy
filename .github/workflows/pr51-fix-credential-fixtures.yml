name: PR 51 fix credential fixtures

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'test(sync): update received credential fixtures') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Patch only typed received-sync fixtures
        run: python3 ./scripts/pr51-fix-credential-fixtures.py

      - name: Verify TypeScript and synchronization behavior
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -b
          pnpm exec vitest run src/screens/settings/DeviceSyncSettings.test.tsx

      - name: Commit verified fixture repair
        run: |
          rm -f .github/pr51-final-clean.log .github/pr51-final-stage-* .github/pr51-final-error-* .github/pr51-ts-*
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git commit -m "test(sync): update received credential fixtures"
          git push origin HEAD:agent/android-completion-a4-a7
