name: PR54 document output capacity fix

on:
  push:
    branches: [agent/pre-public-platform-hardening]

concurrency:
  group: pr54-document-output-capacity-fix
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 45
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/pre-public-platform-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Expose pinned tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply document provider fixes
        run: |
          python3 ./scripts/pr54_fix_document_telemetry.py
          python3 ./scripts/pr54_fix_document_output_capacity.py
          python3 ./scripts/pr54_fix_model_capability_probe.py
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          rm -f \
            .github/workflows/pr54-fix-document-output-capacity.yml \
            .github/pr54-fix-document-output-capacity-trigger.txt \
            scripts/pr54_fix_document_telemetry.py \
            scripts/pr54_fix_document_output_capacity.py \
            scripts/pr54_fix_model_capability_probe.py
          git diff --check

      - name: Run canonical fast qualification
        run: bash ./scripts/check-fast.sh

      - name: Commit qualified product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/src/logging.rs \
            src-tauri/src/task_cancellation.rs \
            src-tauri/src/ai/providers.rs \
            src-tauri/src/ai/document_provider.rs \
            src-tauri/src/ai/probes.rs \
            src-tauri/src/ai/gateway.rs \
            src-tauri/src/ai/document_intelligence.rs \
            src-tauri/src/ai/document_intelligence_adapter.rs \
            src-tauri/src/document_scale.rs \
            src-tauri/src/document_generation.rs \
            src-tauri/src/document_checkpoints.rs \
            src-tauri/src/documents.rs \
            src-tauri/src/document_more.rs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Product fixes are already applied.'
            exit 0
          fi
          git commit -m 'fix(ai): recover structured document output safely'
          git push origin HEAD:agent/pre-public-platform-hardening
