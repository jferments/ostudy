name: PR 51 fix module wiring

on:
  push:
    branches:
      - agent/android-completion-a4-a7

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(pr51): make module wiring order-independent') }}
    runs-on: [self-hosted, ostudy-unified]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/android-completion-a4-a7
          fetch-depth: 0
          persist-credentials: true

      - name: Replace brittle patch_lib implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/pr51-integrate.py')
          content = path.read_text(encoding='utf-8')
          start = content.index('def patch_lib() -> None:\n')
          end = content.index('\ndef patch_document_execution() -> None:\n', start)
          replacement = '''def patch_lib() -> None:\n    relative = "src-tauri/src/lib.rs"\n    content = read(relative)\n    required_modules = [\n        "mod device_sync;",\n        "mod device_sync_transport;",\n        "mod device_sync_qr;",\n        "mod document_background;",\n    ]\n    missing_modules = [module for module in required_modules if module not in content]\n    if missing_modules:\n        lines = content.splitlines(keepends=True)\n        insertion_index = next(\n            (index for index, line in enumerate(lines) if line.startswith("use ") or line.startswith("#[cfg") and index > 0 and any(previous.startswith("use ") for previous in lines[index:index + 3])),\n            None,\n        )\n        if insertion_index is None:\n            insertion_index = next(\n                (index for index, line in enumerate(lines) if line.startswith("use ")),\n                None,\n            )\n        if insertion_index is None:\n            raise RuntimeError("Could not locate the first Rust import in lib.rs")\n        lines[insertion_index:insertion_index] = [f"{module}\\n" for module in missing_modules]\n        content = "".join(lines)\n\n    commands = [\n        "device_sync::get_device_sync_identity",\n        "device_sync::prepare_device_sync_snapshot",\n        "device_sync::preview_device_sync",\n        "device_sync::commit_device_sync",\n        "device_sync::acquire_device_sync_file",\n        "device_sync::export_device_sync_file",\n        "device_sync::share_device_sync_file",\n        "device_sync_transport::start_device_sync_session",\n        "device_sync_transport::receive_device_sync_invitation",\n        "device_sync_transport::get_device_sync_session_status",\n        "device_sync_transport::cancel_device_sync_session",\n        "device_sync_transport::list_trusted_sync_devices",\n        "device_sync_transport::remove_trusted_sync_device",\n        "device_sync_qr::scan_device_sync_qr",\n    ]\n    missing = [command for command in commands if f"{command}," not in content]\n    if missing:\n        anchor = "tauri::generate_handler![\\n"\n        if anchor not in content:\n            raise RuntimeError("Could not locate the Tauri command registry")\n        insertion = "".join(f"            {command},\\n" for command in missing)\n        content = content.replace(anchor, anchor + insertion, 1)\n    write(relative, content)\n\n'''
          path.write_text(content[:start] + replacement + content[end + 1 :], encoding='utf-8')
          PY

      - name: Commit script fix and remove this workflow
        run: |
          rm -f .github/workflows/pr51-fix-module-wiring.yml .github/pr51-source-anchor-*
          git config user.name "ostudy-ci"
          git config user.email "158022198+jferments@users.noreply.github.com"
          git add -A
          git commit -m "chore(pr51): make module wiring order-independent"
          git push origin HEAD:agent/android-completion-a4-a7
