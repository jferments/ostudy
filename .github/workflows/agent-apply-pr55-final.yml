name: Apply PR 55 complete implementation

on:
  push:
    branches: [agent/ui-ai-semantic-generation-overhaul]
    paths:
      - .github/workflows/agent-apply-pr55-final.yml

permissions:
  contents: write

concurrency:
  group: agent-apply-pr55-final
  cancel-in-progress: false

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, ostudy-unified]
    timeout-minutes: 120
    steps:
      - name: Check out exact triggering head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          clean: true
          fetch-depth: 0
          persist-credentials: true

      - name: Apply every remaining PR tranche
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/agent-pr55-phase1-3.py ]]; then
            python3 scripts/agent-pr55-phase1-3.py
          fi
          python3 scripts/agent-pr55-ai-settings.py
          python3 scripts/agent-pr55-document-policy.py
          python3 scripts/agent-pr55-semantic-targets.py

      - name: Remove all one-shot agent automation
        run: |
          rm -f \
            scripts/agent-pr55-phase1-3.py \
            scripts/agent-pr55-ai-settings.py \
            scripts/agent-pr55-document-policy.py \
            scripts/agent-pr55-semantic-targets.py \
            .github/workflows/agent-source-bundle.yml \
            .github/workflows/agent-apply-pr55-phase1-3.yml \
            .github/workflows/agent-apply-pr55-ai-settings.yml \
            .github/workflows/agent-apply-pr55-final.yml

      - name: Format complete changed surface
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --write 'src/**/*.{ts,tsx,css}' 'docs/**/*.md'
          cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Run exact-tree static and compile qualification
        run: |
          set -Eeuo pipefail
          bash ./scripts/check-static.sh
          pnpm exec tsc --noEmit
          cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked

      - name: Publish validated fast-forward commit
        run: |
          set -Eeuo pipefail
          git config user.name "ostudy automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          tree_sha="$(git write-tree)"
          git fetch --no-tags origin agent/ui-ai-semantic-generation-overhaul
          parent_sha="$(git rev-parse FETCH_HEAD)"
          commit_sha="$(printf '%s\n' 'feat: overhaul responsive AI-assisted study workflows' | git commit-tree "$tree_sha" -p "$parent_sha")"
          git reset --hard "$commit_sha"
          git push origin HEAD:agent/ui-ai-semantic-generation-overhaul
